    status: proposed
    decision_source: operator
    repo_class: product-runtime
    requires_security_bindings: true
    security_owner: security-architecture
    validation_behavior:
      posture: covered-by-owner-repo
      wgcf_graph_role: product-runtime-source
      catalog_refs:
        - component-contracts
        - security-bindings
        - review-coverage
      notes: The durable owner repository will keep source validation and review evidence in the owner repo; WGCF may aggregate that evidence without taking product, release, or security authority.
    notes: Recommendation posture is new after checking the existing Prototype Studio, Workspace Governance, WGCF, OOS, Platform Engineering, and Security Architecture ownership boundaries. This proposed public repository is the approved durable product-source target, but it does not exist yet and owns no source, runtime, release, identity, backend mutation, or deployment authority.
products:
