schema_version: 2
lane:
  id: dev-integration
  standard_owner: workspace-governance
  runtime_owner: platform-engineering
  delivery_model: local-ungoverned
  runtime_target: local-k3s
  governed_handoff_target: stage
lane_classes:
  - id: prototype-devint
    purpose: Fast prototype preview for internal tools, client app concepts, UI prototypes, and UI-plus-backend experiments before graduation.
    governed_runtime_evidence: false
  - id: integration-devint
    purpose: Fast cross-repo or workflow integration rehearsal that is not yet governed runtime evidence.
    governed_runtime_evidence: false
  - id: governed-devint
    purpose: Local proof lane for an admitted governed component or workflow before stage handoff.
    governed_runtime_evidence: false
profile_lifecycle:
  statuses:
    - proposed
    - build-admitted
    - active
    - suspended
    - retired
  implementation_statuses:
    - build-admitted
    - active
  self_serve_statuses:
    - active
  request_record_required: true
  build_admission_required_for:
    - build-admitted
  platform_acceptance_required_for:
    - build-admitted
    - active
    - suspended
    - retired
  security_review_ref_required_when_flagged: true
controlled_proof:
  purpose: >-
    Permit one expiring, non-self-serve commissioning proof for an exact
    build-admitted component scope without activating the profile or treating
    the result as governed stage or production evidence.
  authority_type: runtime-drill
  drill_type: component-commissioning-proof
  eligible_profile_statuses:
    - build-admitted
  changes_profile_lifecycle: false
  self_serve_launch_allowed: false
  normal_profile_launch_remains_denied: true
  permit:
    schema_ref: contracts/schemas/controlled-runtime-proof-authorization.schema.json
    schema_version: 2
    required_sections:
      - schema_version
      - authorization_id
      - authority_type
      - drill_type
      - target
      - scope
      - run_binding
      - permit_issuer
      - executor
      - approvals
      - window
      - evidence
      - baseline_and_restore
      - exception_handling
      - stop_conditions
    exact_scope_required: true
    expiration_required: true
    permit_issuer_binding_required: true
    executor_binding_required: true
    semantic_validation:
      unique_binding_keys:
        source_revisions: repo
        runtime_artifacts: artifact_id
        runtime_images: image_ref
      canonical_claims:
        canonicalization: rfc8785
        projection: all-authorization-fields-except-approvals
        approvals_bind_complete_claims: true
        approval_artifact_digests_required: true
      run_consumption:
        mode: atomic-single-use
        keyed_by: authorization_id
        consume_before_first_mutation: true
        duplicate_consumption_denied: true
      immutable_baseline_digest_required: true
  result:
    schema_ref: contracts/schemas/controlled-runtime-proof-result.schema.json
    schema_version: 1
    authorization_binding_required: true
    run_binding_required: true
    scenario_outcomes_required: true
    scenario_outcomes_keyed_by_scenario_id: true
    scenario_ids_must_be_unique: true
    scenario_ids_must_exactly_match_authorization: true
    owner_receipts_required: true
    exact_baseline_evidence_required: true
    baseline_snapshot_must_match_authorization: true
  authorities:
    issuer: platform-engineering
    permit_issuer_source_review_required: true
    executor_owner: platform-engineering
    executor_source_review_required: true
    security_authorizer: security-architecture
    operator_approval_required: true
  owner_surfaces:
    platform_operator:
      repo: platform-engineering
      path: docs/components/temporal/operations.md
    platform_profile:
      repo: platform-engineering
      path: environments/shared/runtime-drills/temporal-component-commissioning-proof.yaml
    security_contract_review:
      repo: security-architecture
      path: docs/reviews/components/2026-08-01-temporal-controlled-commissioning-proof-contract.md
  completion:
    restore_mode: exact-baseline
    restore_required_before_completion: true
    terminal_cleanup_authority_mode: exact-baseline-restore-only
    terminal_cleanup_bound_to_started_run: true
    terminal_cleanup_trigger_scope: any-triggered-stop-condition
    new_proof_actions_allowed_after_stop: false
    post_proof_security_review_required: true
    pre_run_authorization_reusable_as_activation_evidence: false
  forbidden_claims:
    - build-admitted profile became active
    - controlled proof became a self-serve launch path
    - pre-run authorization satisfied post-run activation evidence
    - local proof became governed stage or production evidence
    - post-proof runtime state was retained without governed reclassification
request_admission:
  current_request_adapter:
    system: openproject
    owner_repo: platform-engineering
    target_ref: openproject://projects/workspace-proposals
  required_request_fields:
    - request_record.system
    - request_record.ref
    - requested_by
    - requested_on
    - purpose
  activation_requirements:
    - build-admission-ref
    - owner-runtime-commands-runnable
    - read-only-smoke-passes-when-persistent
    - platform-activation-ref
    - security-review-ref-when-required
  build_admission_requirements:
    - owner-profile-file-exists
    - platform-build-acceptance-ref
    - security-review-ref-when-required
    - implementation-scope-boundary
    - self-serve-launch-denied-until-active
  persistent_request_requirements:
    - runtime.state_model
    - testing.smoke.mutation_mode
    - persistence.justification
    - persistence.retained_data_scope
    - persistence.suspend_resume_semantics
    - persistence.storage_size_or_class
    - persistence.reset_semantics
    - persistence.cutover_plan_when_upgrading
source_state:
  allow_dirty_worktrees: true
  allow_local_only_commits: true
  allow_branch_inputs: true
  allow_worktree_path_overrides: true
  session_manifest_required: true
runtime_state_models:
  - disposable
  - persistent
testing:
  smoke:
    allowed_mutation_modes:
      - read-only
      - mutating
    persistent_profile_rule:
      mutation_mode_must_be: read-only
      mutating_smoke_requires_separate_disposable_profile: true
trigger_guidance:
  required:
    - new-operator-workflow
    - cross-repo-api-iteration
    - canonical-backend-write
    - rapid-operator-ux-iteration
    - new-runtime-control-plane
  recommended:
    - changing-read-help-list-show-shapes
    - evolving-runtime-topology-before-stage
    - cross-repo-contract-rehearsal
  optional:
    - single-repo-pure-logic-change
    - no-external-write-path
runtime_lane_decision:
  required_for_new_repos: true
  decisions:
    - no-runtime
    - local-only
    - dev-integration-required
    - stage-direct
  component_inventory_required_repo_classes:
    - governance-runtime
    - shared-operator-service
    - product-runtime
    - runtime-enforcement
  dev_integration_required_repo_classes:
    - governance-runtime
    - shared-operator-service
  waiver_decisions:
    - local-only
    - no-runtime
    - stage-direct
  waivers: []
forbidden_targets:
  - stage-backend-write
  - prod-backend-write
  - shared-governed-secrets
  - governed-stage-or-prod-evidence
live_miss_escalation:
  owner_repo: workspace-governance
  purpose: >
    Decide whether a failure discovered after local dev-integration proof should
    return to the fast lane, route to the platform/backend boundary, or continue
    in governed rehearsal.
  return_to_dev_integration_when:
    - the workflow shape, operator inputs, or backend write semantics are still changing
    - the failure can be reproduced without governed stage or prod state
    - the active profile owns a faithful disposable or persistent local model for the failing path
  route_to_platform_or_backend_boundary_when:
    - the local workflow proof already passed and the remaining failure is identity, networking, persistence, form writability, or platform projection behavior
    - the failure depends on shared runtime state that the profile deliberately does not own
    - continuing inside the workflow repo would only patch around a platform-owned contract
  governed_rehearsal_allowed_when:
    - reviewed commits and promotion or handoff evidence exist
    - the target lane owns the runtime boundary under test
    - blocker, defect, or risk state is recorded before adjacent mutation continues
  required_record_fields:
    - failed_operation
    - lane_where_seen
    - local_profile_evidence
    - live_boundary_evidence
    - selected_route
    - owner_repo
    - follow_up_record
required_actions:
  - up
  - status
  - smoke
  - down
  - reset
  - promote_check
required_handoff_artifacts:
  - session_manifest
  - promotion_report
  - smoke_summary
required_session_fields:
  - session_id
  - profile_id
  - operator
  - namespace
  - created_at
  - workspace_root
  - owner_repo
  - runtime_owner
  - source_repos
