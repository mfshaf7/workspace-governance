schema_version: 1
delivery_art_operator_path:
  owner_repo: workspace-governance
  canonical_entrypoint:
    repo: operator-orchestration-service
    command: npm run art
    primary_operator_surface: operator-orchestration-service/docs/operations/delivery-workflow-operator-surface.md
  governance_surface: docs/delivery-art-operator-path.md
  supporting_platform_surfaces:
    workflow_health: platform-engineering/products/openproject/runbooks/check-delivery-art-workflow-health.md
    quality_gate: platform-engineering/products/openproject/runbooks/check-delivery-art-quality.md
    admin_boundary: platform-engineering/products/openproject/runbooks/openproject-platform-admin-surface.md
  contract_activation:
    state: contract-defined
    runtime_enforcement: pending-owner-implementation-and-dogfood
    target_art_items:
      - openproject://work_packages/809
      - openproject://work_packages/805
      - openproject://work_packages/811
      - openproject://work_packages/810
      - openproject://work_packages/802
      - openproject://work_packages/803
      - openproject://work_packages/804
      - openproject://work_packages/806
    current_runtime_compatibility:
      review_packet_schema_version: 1
      new_work_start_commands_available: false
      rule: >-
        Continue using the currently documented OOS commands until the target
        owner implementations land. This contract defines the next boundary;
        it does not claim that work-start enforcement or Review Packet v2 is
        already active.
    activation_requires:
      - Workspace Governance publishes the corrected custody contract and artifact-reference schemas
      - Security approves evidence custody, access, retention, deletion, backup, restore, and source-provenance controls
      - Platform provides profile-scoped object storage for the WGCF artifact registry
      - WGCF implements content-addressed artifact custody, registry metadata, and immutable custody receipts
      - OOS produces and validates artifacts, persists them through WGCF, and projects only safe references into OpenProject
      - OOS implements Review Packet v2 and rejects weak result strings
      - WGCF evaluates the four readiness levels from structured artifacts
      - Platform removes duplicate ART quality semantics and consumes OOS projections
      - the path is dogfooded on delivery initiative 698
  readiness_model:
    ordered_levels:
      - architecture-ready
      - implementation-ready
      - merge-ready
      - operating-ready
    levels:
      architecture-ready:
        purpose: prove the target design, ownership, sequence, and conformance plan before source implementation
        requires:
          - finalized architecture packet with an explicit operator decision
          - complete descendant and owner map
          - dependency and merge sequence
          - lifecycle, authority, evidence, runtime, and rollback boundaries
          - planned positive and negative conformance cases with fidelity classes
        does_not_require:
          - implementation tests to have already passed
          - a source branch or pull request to exist
      implementation-ready:
        purpose: bind one Landing Unit to fresh ART and owner-repo source truth before implementation
        requires:
          - architecture-ready evidence when architecture preflight applies
          - explicit Landing Unit Decision
          - exact owner repos, base refs, base commits, and planned Review Packet ref
          - fresh scope fingerprint with invalidation inputs
        does_not_require:
          - an open pull request
          - merge or runtime evidence
      merge-ready:
        purpose: prove the exact reviewed source head satisfies the Landing Unit before merge
        requires:
          - implementation-ready work-start record
          - open pull request evidence or approved direct-land authority at exact source head
          - structured changed surfaces and acceptance mapping
          - applicable test and validation results with no failed result
          - durable content-addressed merge-ready Review Packet
          - concrete rollback boundary
        does_not_require:
          - merged source evidence
          - post-merge runtime proof
      operating-ready:
        purpose: prove the merged or explicitly accepted change has the evidence required for ART closeout
        requires:
          - finalized content-addressed Review Packet
          - durable source or non-source evidence
          - applicable live, runtime, security, and restore evidence for the change class
          - append-only custody ref and receipt refs
        does_not_require:
          - runtime proof when the declared change class does not require it
    rules:
      readiness_is_snapshot_bound: true
      later_level_does_not_rewrite_earlier_evidence: true
      failed_required_evidence_blocks_advancement: true
      not_applicable_requires_reason_and_authority_ref: true
      attached_artifact_is_a_reference_not_a_pass_result: true
      architecture_dependency_graph_is_bound_and_acyclic: true
      architecture_parent_map_is_a_rooted_acyclic_forest: true
      architecture_source_snapshot_exactly_covers_owner_repos: true
      architecture_lifecycle_transitions_use_declared_states: true
      architecture_merge_order_respects_dependency_precedence: true
      dependency_relation_precedence:
        depends_on: the target work item and its owner repo precede the source
        blocks: the source work item and its owner repo precede the target
        must_merge_before: the source work item and its owner repo precede the target
  artifact_contracts:
    architecture_packet:
      schema_ref: contracts/schemas/delivery-art-architecture-packet.schema.json
      schema_version: 1
      producer_repo: operator-orchestration-service
      custody_repo: workspace-governance-control-fabric
      durable_when: operator decision is architecture-ready or blocked-pending-architecture-decision
    work_start_record:
      schema_ref: contracts/schemas/delivery-art-work-start-record.schema.json
      schema_version: 1
      producer_repo: operator-orchestration-service
      custody_repo: workspace-governance-control-fabric
      durable_when: implementation readiness is evaluated
    review_packet:
      schema_ref: contracts/schemas/delivery-art-review-packet.schema.json
      schema_version: 2
      producer_repo: operator-orchestration-service
      custody_repo: workspace-governance-control-fabric
      durable_when: packet reaches merge-ready or finalized
      migration_from_runtime_version: 1
    readiness_receipt:
      schema_ref: contracts/schemas/delivery-art-readiness-receipt.schema.json
      schema_version: 1
      producer_repo: workspace-governance-control-fabric
      custody_repo: workspace-governance-control-fabric
      durable_when: readiness evaluation completes
    custody_receipt:
      schema_ref: contracts/schemas/delivery-art-custody-receipt.schema.json
      schema_version: 1
      producer_repo: workspace-governance-control-fabric
      custody_repo: workspace-governance-control-fabric
      durable_when: Platform storage and WGCF registry persistence complete
  proof_obligations:
    governed_claim_roots:
      - readiness_model.rules
      - work_start_gate
      - evidence_integrity
      - initiative_architecture_preflight
    every_true_claim_mapped_once: true
    active_local_requires_positive_and_negative_case: true
    obligations:
      - id: readiness-evidence-semantics
        claim_refs:
          - readiness_model.rules.readiness_is_snapshot_bound
          - readiness_model.rules.failed_required_evidence_blocks_advancement
          - readiness_model.rules.not_applicable_requires_reason_and_authority_ref
          - readiness_model.rules.attached_artifact_is_a_reference_not_a_pass_result
          - evidence_integrity.lifecycle_timestamps_must_be_chronologically_ordered
        enforcement_state: active-local
        owner_repo: workspace-governance
        target_art_refs: []
        positive_case_ids:
          - review-evidence-valid
        negative_case_ids:
          - review-evidence-invalid
        enforcement_layers:
          - json-schema
          - semantic-validator
        rationale: Structured evidence and chronology are enforced by the local schemas and semantic validator.
      - id: architecture-structure
        claim_refs:
          - readiness_model.rules.architecture_dependency_graph_is_bound_and_acyclic
          - readiness_model.rules.architecture_parent_map_is_a_rooted_acyclic_forest
          - readiness_model.rules.architecture_source_snapshot_exactly_covers_owner_repos
          - readiness_model.rules.architecture_lifecycle_transitions_use_declared_states
          - readiness_model.rules.architecture_merge_order_respects_dependency_precedence
        enforcement_state: active-local
        owner_repo: workspace-governance
        target_art_refs: []
        positive_case_ids:
          - architecture-structure-valid
        negative_case_ids:
          - architecture-structure-invalid
        enforcement_layers:
          - json-schema
          - semantic-validator
        rationale: Architecture topology, ownership, lifecycle, and merge precedence are executable local invariants.
      - id: work-start-structure
        claim_refs:
          - work_start_gate.child_isolated_requires_split_reason
          - work_start_gate.exact_base_revision_required
          - work_start_gate.owner_branch_and_snapshot_repo_sets_must_match
          - work_start_gate.branch_base_ref_and_commit_must_match_source_snapshot
          - work_start_gate.planned_review_packet_ref_required_for_source_work
          - work_start_gate.architecture_packet_required_when_preflight_applies
          - work_start_gate.architecture_refs_follow_architecture_readiness
          - work_start_gate.required_architecture_may_record_blocked_state
          - work_start_gate.blocked_architecture_prevents_implementation_ready
          - work_start_gate.complete_invalidation_set_required
          - work_start_gate.scope_fingerprint_is_deterministic_projection
        enforcement_state: active-local
        owner_repo: workspace-governance
        target_art_refs: []
        positive_case_ids:
          - work-start-valid
        negative_case_ids:
          - work-start-invalid
        enforcement_layers:
          - json-schema
          - semantic-validator
          - reference-resolver
        rationale: The local contract proves one exact Landing Unit scope before owner runtime activation.
      - id: runtime-work-start-enforcement
        claim_refs:
          - work_start_gate.required_before_branch_or_source_edit
          - work_start_gate.fresh_target_and_dependency_snapshot_required_before_mutation
        enforcement_state: pending-owner
        owner_repo: operator-orchestration-service
        target_art_refs:
          - openproject://work_packages/802
        positive_case_ids: []
        negative_case_ids: []
        enforcement_layers:
          - owner-runtime
        rationale: OOS must enforce the pre-edit gate and final fresh read; this contract cannot claim those runtime controls are active.
      - id: read-cache-policy
        claim_refs:
          - work_start_gate.read_snapshot_cache_allowed
        enforcement_state: doctrine
        owner_repo: workspace-governance
        target_art_refs: []
        positive_case_ids: []
        negative_case_ids: []
        enforcement_layers:
          - operator-contract
        rationale: This is an allowed optimization boundary, not a claim that a cache runtime already exists.
      - id: review-evidence-integrity
        claim_refs:
          - evidence_integrity.landing_unit_decision_and_evidence_kind_must_match
          - evidence_integrity.non_source_children_prohibit_branch_pr_and_source_landing_evidence
          - evidence_integrity.source_repo_evidence_unique_by_repo
          - evidence_integrity.source_changed_surfaces_resolve_to_declared_changed_files
          - evidence_integrity.source_provenance.exact_base_and_head_commits_required
          - evidence_integrity.source_provenance.passing_evidence_binds_exact_source_heads
          - evidence_integrity.source_provenance.git_causality_applicability_is_explicit
          - evidence_integrity.source_provenance.real_git_required_for_git_causality_claims
          - evidence_integrity.source_provenance.synthetic_resolver_cannot_prove_git_history
          - evidence_integrity.acceptance_mapping.exactly_covers_declared_work_items
          - evidence_integrity.acceptance_mapping.evidence_references_must_resolve
          - evidence_integrity.acceptance_mapping.evidence_ids_globally_unique
          - evidence_integrity.exception_authority.direct_land_exception_must_be_time_bound
          - evidence_integrity.exception_authority.direct_land_exception_must_remain_valid_through_readiness_and_finalization
        enforcement_state: active-local
        owner_repo: workspace-governance
        target_art_refs: []
        positive_case_ids:
          - review-evidence-valid
        negative_case_ids:
          - review-evidence-invalid
        enforcement_layers:
          - json-schema
          - semantic-validator
          - reference-resolver
        rationale: Review evidence, source provenance, acceptance mapping, and exception authority are validated as structured facts.
      - id: canonical-integrity
        claim_refs:
          - evidence_integrity.canonical_input_requires_unicode_scalar_values
          - evidence_integrity.duplicate_json_object_keys_rejected
          - evidence_integrity.floating_point_values_rejected
          - evidence_integrity.custody.content_addressed_reference_required
          - evidence_integrity.custody.supersedes_reference_digest_bound
          - evidence_integrity.custody.durable_persisted_at_required
        enforcement_state: active-local
        owner_repo: workspace-governance
        target_art_refs: []
        positive_case_ids:
          - canonical-integrity-valid
        negative_case_ids:
          - canonical-integrity-invalid
        enforcement_layers:
          - integrity-validator
        rationale: The public artifact validator uses the bounded RFC 8785 domain and verifies content-addressed custody.
      - id: artifact-reference-chain
        claim_refs:
          - readiness_model.rules.later_level_does_not_rewrite_earlier_evidence
          - evidence_integrity.artifact_reference_chain.opaque_refs_cannot_advance_readiness
          - evidence_integrity.artifact_reference_chain.work_start_resolves_architecture_packet
          - evidence_integrity.artifact_reference_chain.review_packet_resolves_work_start_record
          - evidence_integrity.artifact_reference_chain.readiness_receipt_resolves_exact_subject
          - evidence_integrity.artifact_reference_chain.readiness_receipt_subject_coverage_and_chronology_must_match
          - evidence_integrity.artifact_reference_chain.operating_receipt_uses_cycle_safe_readiness_subject
          - evidence_integrity.artifact_reference_chain.finalized_review_packet_resolves_merge_ready_predecessor
          - evidence_integrity.artifact_reference_chain.finalized_review_packet_resolves_readiness_receipts
          - evidence_integrity.artifact_reference_chain.resolved_delivery_coverage_landing_unit_scope_and_source_must_match
          - evidence_integrity.artifact_reference_chain.dependency_must_exist_before_dependent_readiness
          - evidence_integrity.artifact_reference_chain.superseded_artifact_must_resolve_with_same_type_and_delivery
          - evidence_integrity.artifact_reference_chain.local_validator_requires_dependency_artifacts
          - evidence_integrity.custody.append_only_corrections
          - evidence_integrity.custody.correction_requires_supersedes_ref
          - evidence_integrity.custody.supersession_chains_are_acyclic_and_strictly_ordered
          - evidence_integrity.custody.merge_ready_review_packet_is_immutable_predecessor_evidence
        enforcement_state: active-local
        owner_repo: workspace-governance
        target_art_refs: []
        positive_case_ids:
          - reference-chain-valid
        negative_case_ids:
          - reference-chain-invalid
        enforcement_layers:
          - reference-resolver
          - semantic-validator
        rationale: Every readiness dependency must resolve by type, digest, scope, chronology, and immutable predecessor continuity.
      - id: conformance-plan
        claim_refs:
          - evidence_integrity.conformance_case_binding.architecture_cases_declare_applicable_work_items
          - evidence_integrity.conformance_case_binding.architecture_cases_declare_dimension_ids
          - evidence_integrity.conformance_case_binding.case_ids_unique_within_architecture_packet
          - evidence_integrity.conformance_case_binding.required_plan_exactly_covers_architecture_work_items
          - evidence_integrity.conformance_case_binding.required_plan_exactly_covers_declared_dimensions
          - evidence_integrity.conformance_case_binding.required_plan_has_positive_and_negative_case_per_work_item
          - evidence_integrity.conformance_case_binding.required_protocol_dimension_has_merge_ready_positive_and_negative_cases
          - evidence_integrity.conformance_case_binding.required_protocol_work_item_has_merge_ready_positive_and_negative_cases
          - evidence_integrity.conformance_case_binding.required_work_item_dimension_pair_has_merge_ready_positive_and_negative_cases
          - evidence_integrity.conformance_case_binding.later_readiness_requires_all_applicable_cases_to_pass
          - evidence_integrity.conformance_case_binding.evidence_fidelity_must_match_planned_case_fidelity
          - evidence_integrity.conformance_case_binding.cases_outside_packet_work_item_or_readiness_scope_rejected
          - evidence_integrity.conformance_case_binding.work_item_dimension_applicability_is_explicit
          - initiative_architecture_preflight.protocol_conformance_preflight.required_when_cross_repo_protocol_changes
          - initiative_architecture_preflight.protocol_conformance_preflight.applicability_must_be_explicit
          - initiative_architecture_preflight.protocol_conformance_preflight.all_required_dimensions_must_be_present_when_applicable
          - initiative_architecture_preflight.protocol_conformance_preflight.all_required_dimensions_must_have_executable_cases
          - initiative_architecture_preflight.protocol_conformance_preflight.architecture_ready_requires_conformance_plan
          - initiative_architecture_preflight.protocol_conformance_preflight.merge_ready_requires_applicable_cases_pass
          - initiative_architecture_preflight.protocol_conformance_preflight.fidelity_class_required
        enforcement_state: active-local
        owner_repo: workspace-governance
        target_art_refs: []
        positive_case_ids:
          - architecture-conformance-valid
        negative_case_ids:
          - architecture-conformance-invalid
        enforcement_layers:
          - json-schema
          - semantic-validator
          - reference-resolver
        rationale: Applicability is explicit per work-item and dimension, with positive and negative merge-ready cases at the declared fidelity.
      - id: architecture-decision-doctrine
        claim_refs:
          - initiative_architecture_preflight.required_before_source_implementation
          - initiative_architecture_preflight.decision_gate.operator_discussion_required
          - initiative_architecture_preflight.decision_gate.execution_sequence_locked_before_child_work
          - initiative_architecture_preflight.decision_gate.reopen_when_owner_boundary_or_protocol_changes
        enforcement_state: doctrine
        owner_repo: workspace-governance
        target_art_refs: []
        positive_case_ids: []
        negative_case_ids: []
        enforcement_layers:
          - operator-contract
        rationale: These are operator governance obligations; the source contract defines them without pretending to prove the human decision itself.
      - id: wgcf-artifact-custody-boundary
        claim_refs:
          - evidence_integrity.custody.wgcf_custodies_artifacts_metadata_and_receipts_without_artifact_authorship
        enforcement_state: pending-owner
        owner_repo: workspace-governance-control-fabric
        target_art_refs:
          - openproject://work_packages/810
        positive_case_ids: []
        negative_case_ids: []
        enforcement_layers:
          - owner-runtime
        rationale: The schemas define an opaque WGCF registry and custody-receipt reference, but WGCF work item 810 must implement custody without taking artifact authorship or workspace policy authority.
      - id: openproject-evidence-reference-boundary
        claim_refs:
          - evidence_integrity.custody.openproject_stores_safe_references_only
        enforcement_state: pending-owner
        owner_repo: operator-orchestration-service
        target_art_refs:
          - openproject://work_packages/802
        positive_case_ids: []
        negative_case_ids: []
        enforcement_layers:
          - owner-runtime
        rationale: OOS must project only the artifact ref, digest, and custody receipt ref into OpenProject after WGCF persistence succeeds.
      - id: artifact-retention-boundary
        claim_refs:
          - evidence_integrity.custody.automatic_workflow_deletion_prohibited
        enforcement_state: doctrine
        owner_repo: workspace-governance
        target_art_refs: []
        positive_case_ids: []
        negative_case_ids: []
        enforcement_layers:
          - operator-contract
        rationale: A failed ART projection leaves the immutable artifact in custody; retention or deletion is a separate explicit lifecycle decision, not workflow compensation.
  work_start_gate:
    required_before_branch_or_source_edit: true
    landing_unit_decisions:
      - feature_single_landing_unit
      - child_isolated_landing_unit
      - non_source_child
      - defer_decision_blocked
    child_isolated_requires_split_reason: true
    exact_base_revision_required: true
    owner_branch_and_snapshot_repo_sets_must_match: true
    branch_base_ref_and_commit_must_match_source_snapshot: true
    planned_review_packet_ref_required_for_source_work: true
    architecture_packet_required_when_preflight_applies: true
    architecture_refs_follow_architecture_readiness: true
    required_architecture_may_record_blocked_state: true
    blocked_architecture_prevents_implementation_ready: true
    read_snapshot_cache_allowed: true
    fresh_target_and_dependency_snapshot_required_before_mutation: true
    complete_invalidation_set_required: true
    scope_fingerprint_is_deterministic_projection: true
    invalidation_inputs:
      - art-descendant-or-dependency-change
      - owner-or-rollback-boundary-change
      - base-ref-or-commit-change
      - architecture-decision-or-digest-change
      - validation-or-security-obligation-change
  evidence_integrity:
    landing_unit_decision_and_evidence_kind_must_match: true
    non_source_children_prohibit_branch_pr_and_source_landing_evidence: true
    source_repo_evidence_unique_by_repo: true
    source_changed_surfaces_resolve_to_declared_changed_files: true
    canonicalization: RFC8785
    canonical_input_requires_unicode_scalar_values: true
    duplicate_json_object_keys_rejected: true
    floating_point_values_rejected: true
    digest_algorithm: sha256
    digest_scope: artifact content excluding the digest field and self-referential custody values while retaining every non-null custody.supersedes reference
    review_packet_readiness_subject:
      purpose: bind final semantic content before receipt issuance without committing terminal timing or self-referential evidence
      excluded_top_level_fields:
        - custody
        - integrity
        - finalized_at
      excluded_readiness_fields:
        - evaluated_at
        - receipt_refs
        - subject_digest
      finalization_order:
        - readiness-subject-computed
        - readiness-receipt-evaluated
        - readiness-receipt-persisted
        - review-packet-finalized
        - review-packet-persisted
    lifecycle_timestamps_must_be_chronologically_ordered: true
    artifact_reference_chain:
      opaque_refs_cannot_advance_readiness: true
      work_start_resolves_architecture_packet: true
      review_packet_resolves_work_start_record: true
      readiness_receipt_resolves_exact_subject: true
      readiness_receipt_subject_coverage_and_chronology_must_match: true
      operating_receipt_uses_cycle_safe_readiness_subject: true
      finalized_review_packet_resolves_merge_ready_predecessor: true
      finalized_review_packet_resolves_readiness_receipts: true
      resolved_delivery_coverage_landing_unit_scope_and_source_must_match: true
      dependency_must_exist_before_dependent_readiness: true
      superseded_artifact_must_resolve_with_same_type_and_delivery: true
      local_validator_requires_dependency_artifacts: true
      runtime_resolver_owner: operator-orchestration-service
    evidence_results:
      allowed:
        - pass
        - fail
        - not_applicable
      merge_ready_allows:
        - pass
        - not_applicable
      string_prefixes_are_not_results:
        - "PASS:"
        - "FAIL:"
        - "CHECK:"
        - "Attached artifact:"
    test_fidelity_classes:
      - pure-unit
      - filesystem
      - real-git
      - process-crash
      - sandbox-runtime
      - live-backend
    conformance_case_binding:
      architecture_cases_declare_applicable_work_items: true
      architecture_cases_declare_dimension_ids: true
      case_ids_unique_within_architecture_packet: true
      required_plan_exactly_covers_architecture_work_items: true
      required_plan_exactly_covers_declared_dimensions: true
      required_plan_has_positive_and_negative_case_per_work_item: true
      required_protocol_dimension_has_merge_ready_positive_and_negative_cases: true
      required_protocol_work_item_has_merge_ready_positive_and_negative_cases: true
      required_work_item_dimension_pair_has_merge_ready_positive_and_negative_cases: true
      later_readiness_requires_all_applicable_cases_to_pass: true
      evidence_fidelity_must_match_planned_case_fidelity: true
      cases_outside_packet_work_item_or_readiness_scope_rejected: true
      work_item_dimension_applicability_is_explicit: true
    source_provenance:
      exact_base_and_head_commits_required: true
      passing_evidence_binds_exact_source_heads: true
      git_causality_applicability_is_explicit: true
      real_git_required_for_git_causality_claims: true
      synthetic_resolver_cannot_prove_git_history: true
    acceptance_mapping:
      exactly_covers_declared_work_items: true
      evidence_references_must_resolve: true
      evidence_ids_globally_unique: true
    exception_authority:
      direct_land_exception_must_be_time_bound: true
      direct_land_exception_must_remain_valid_through_readiness_and_finalization: true
    custody:
      draft_backend: local-filesystem
      durable_backend: wgcf-artifact-registry
      durable_owner: workspace-governance-control-fabric
      logical_scope: delivery-art
      physical_storage_owner: platform-engineering
      projection_record_system: openproject
      content_addressed_reference_required: true
      supersedes_reference_digest_bound: true
      append_only_corrections: true
      correction_requires_supersedes_ref: true
      supersession_chains_are_acyclic_and_strictly_ordered: true
      merge_ready_review_packet_is_immutable_predecessor_evidence: true
      durable_persisted_at_required: true
      wgcf_custodies_artifacts_metadata_and_receipts_without_artifact_authorship: true
      openproject_stores_safe_references_only: true
      automatic_workflow_deletion_prohibited: true
      write_sequence:
        - OOS validates the artifact and computes its canonical digest
        - WGCF persists the content-addressed artifact through Platform object storage
        - WGCF records registry metadata and returns the artifact ref plus custody receipt ref
        - OOS writes safe evidence references to OpenProject and performs the guarded ART transition
      failure_semantics:
        registry_unavailable: fail-before-art-mutation
        art_projection_write_failure: preserve-durable-artifact-and-retry-reference-projection
        duplicate_digest_retry: reuse-existing-artifact-and-custody-receipt
        retention_or_deletion: explicit-lifecycle-control-only
      runtime_maturity:
        contract: contract-defined
        dev_integration: pending-security-platform-and-wgcf-owner-work
        stage_and_prod: denied-until-identity-encryption-retention-deletion-backup-restore-and-security-approval
  authority_boundaries:
    workspace_governance:
      - policy and schema authority
      - readiness meaning and evidence obligations
    operator_orchestration_service:
      - ART adapter and mutation authority
      - scoped snapshot, artifact production, and semantic validation authority
      - Review Packet and atomic closeout implementation
    workspace_governance_control_fabric:
      - readiness composition and receipt authority
      - governance artifact registry, custody receipt, and ledger metadata authority
      - no artifact authorship or workspace policy authority
      - no ART mutation authority
    platform_engineering:
      - profile-scoped object storage runtime authority
      - OpenProject runtime and projection authority
      - no duplicate ART semantic evaluator
    context_governance_gateway:
      - operational context admission and context artifact custody only
      - no Delivery ART evidence custody authority
    security_architecture:
      - trust-boundary and evidence-custody review authority
  performance_budgets:
    status: target-until-dogfood-proves-operating-control
    work_start_cold_seconds_max: 5
    work_start_warm_seconds_max: 2
    local_schema_validation_milliseconds_max: 250
    prohibited_read_pattern: one full initiative graph rebuild or one relation call per work item for every bounded work-start read
    final_write_rule: cached reads may inform preparation but final mutations must refresh the target and dependency subset
  initiative_architecture_preflight:
    applies_when:
      - an accepted initiative is architecture-shaping
      - a source change spans multiple owner repos or protocol boundaries
      - child implementation depends on an unproven cross-repo execution sequence
    required_before_source_implementation: true
    authoritative_inputs:
      - complete initiative descendant tree from Workspace Delivery ART
      - merged implementation and contract truth from every affected owner repo
      - active workspace, platform, orchestration, and security authority contracts
    packet_schema_ref: contracts/schemas/delivery-art-architecture-packet.schema.json
    packet_required_sections:
      - descendant-and-owner-map
      - dependency-and-merge-sequence
      - lifecycle-and-state-model
      - authorization-session-and-execution-model
      - evidence-and-receipt-handoffs
      - runtime-boundaries-and-prohibited-actions
      - rollback-cleanup-and-terminal-conditions
      - contradictions-and-open-decisions
      - conformance-plan
    decision_gate:
      operator_discussion_required: true
      execution_sequence_locked_before_child_work: true
      reopen_when_owner_boundary_or_protocol_changes: true
      allowed_results:
        - architecture-ready
        - blocked-pending-architecture-decision
    protocol_conformance_preflight:
      required_when_cross_repo_protocol_changes: true
      applicability_must_be_explicit: true
      all_required_dimensions_must_be_present_when_applicable: true
      all_required_dimensions_must_have_executable_cases: true
      required_dimensions:
        - command-and-acknowledgement-semantics
        - deterministic-identities-and-idempotency
        - state-mutation-ordering
        - retry-cancel-replay-and-recovery-semantics
        - bounded-failure-mapping
        - authorization-integrity-and-replay-resistance
        - session-scenario-and-execution-binding
        - result-and-owner-receipt-completeness
        - immutable-baseline-and-restore-evidence
        - lifecycle-state-matrix
        - cross-artifact-timeline-ordering
        - shared-validator-compatibility
      executable_cases_required:
        - positive-contract-cases
        - negative-contract-cases
      architecture_ready_requires_conformance_plan: true
      merge_ready_requires_applicable_cases_pass: true
      fidelity_class_required: true
  canonical_read_hierarchy:
    - id: session-bootstrap
      cli: npm run art -- bootstrap
      route: GET /v1/delivery-session/bootstrap
      purpose: resume one ART session from the active devint lane
    - id: workflow-health
      cli: npm run art -- workflow-health
      route: GET /v1/delivery-session/workflow-health
      purpose: confirm roadmap and PM² projection health before deeper repair
    - id: initiative-active-session
      cli: npm run art -- initiative active-session <delivery-id>
      route: GET /v1/delivery-initiatives/{delivery_id}/active-session-packet
      purpose: resume a known active initiative with bounded front state, quality drift, stale-open candidates, closeout readiness, and full-output refs
    - id: initiative-evidence-packet
      cli: npm run art -- initiative evidence-packet <delivery-id>
      route: GET /v1/delivery-initiatives/{delivery_id}/evidence-packet
      purpose: inspect initiative-level evidence posture without rereading raw descriptions, PRs, and validation logs
    - id: item-evidence-packet
      cli: npm run art -- item evidence-packet <work-item-id>
      route: GET /v1/delivery-work-items/{work_item_id}/evidence-packet
      purpose: inspect one work item's evidence posture without rereading raw descriptions or the full initiative tree
    - id: initiative-review-pack
      cli: npm run art -- initiative review-pack <delivery-id>
      route: GET /v1/delivery-initiatives/{delivery_id}/review-pack
      purpose: decide whether one initiative is clean, stale-open, or review-ready
    - id: initiative-planning
      cli: npm run art -- initiative planning <delivery-id>
      route: GET /v1/delivery-initiatives/{delivery_id}/planning
      purpose: identify the active committed front when the next item is not already known
    - id: item-continuation
      cli: npm run art -- item continuation <work-item-id>
      route: GET /v1/delivery-work-items/{work_item_id}/continuation-context
      purpose: resume one concrete work item before repo implementation work
    - id: review-packet-evidence-packet
      cli: npm run art -- review-packet evidence-packet <packet.json>
      route: local helper
      purpose: inspect one Review Packet's coverage and evidence posture before using it for closeout
  optimized_path:
    availability: active_for_oos_broker_surfaces_after_art_650_dogfood
    rule: >
      These surfaces are the accepted 90 percent optimization target. OOS
      broker packet, evidence, Review Packet, and landing-unit closeout
      surfaces are active after #650 dogfood. WGCF validation-plan receipts and
      broader CGG packet projection remain residual optimization work.
    active_surfaces:
      - id: compact-session-packet
        purpose: replace repeated bootstrap, workflow-health, planning, and review reads with one bounded session packet and full-output refs
        owner_repo: operator-orchestration-service
      - id: evidence-packet
        purpose: summarize work-item, initiative, and Review Packet evidence without rereading raw descriptions, PRs, and validation logs
        owner_repo: operator-orchestration-service
      - id: landing-unit-status-and-close
        purpose: compute covered children, parent closeout candidates, WGCF readiness, and projection checkpoints from one landing-unit packet
        owner_repo: operator-orchestration-service
      - id: review-packet-command-family
        purpose: provide draft, validate, readiness, evidence-packet, and finalize commands for source-backed completion evidence
        owner_repo: operator-orchestration-service
      - id: cgg-context-packet-ref-optional
        purpose: add packet refs and digests for oversized ART CLI output when ART_CGG_PACKETING=enabled while keeping local output artifacts reviewable
        owner_repo: context-governance-gateway
    residual_surfaces:
      - id: wgcf-validation-plan-receipt
        purpose: request one validation plan receipt per landing unit instead of rediscovering direct validators repeatedly
        owner_repo: workspace-governance-control-fabric
      - id: cgg-context-packet-ref-default
        purpose: make CGG packet refs the normal path for oversized ART, CI, terminal, and runtime output instead of an opt-in CLI mode
        owner_repo: context-governance-gateway
    dogfood_measurement:
      delivery_ref: openproject://work_packages/650
      completed_work_item_ref: openproject://work_packages/668
      older_active_front_read:
        command: npm run art -- initiative execution-summary 650 --json
        output_bytes: 65648
      optimized_active_front_read:
        command: npm run art -- initiative active-session 650 --json
        output_bytes: 9162
      measured_reduction_percent: 86
      completion_receipt: art-readiness-receipt:f5ae7cd83f2b73fa7b995370
    activation_gates:
      - OOS API and CLI contracts document the implemented surfaces.
      - WGCF and CGG seams are explicit and do not change authority ownership.
      - Dev-integration smoke proves the optimized path.
      - The first source-backed landing unit is dogfooded through the optimized path.
      - Scoped ART quality and projection health are clean after the cutover.
  guided_write_intents:
    - id: item-blocker
      cli: npm run art -- item blocker <work-item-id> <payload.json>
      route: POST /v1/delivery-work-items/{work_item_id}/blocker
      purpose: record or clear the exact blocker on one active work item through the bounded blocker workflow
    - id: planning-repair
      cli: npm run art -- initiative planning-repair <delivery-id> <payload.json>
      route: POST /v1/delivery-initiatives/{delivery_id}/plan/repair
      purpose: retarget, decommit, or correct execution posture through one guided repair path
    - id: review-packet-draft
      cli: npm run art -- review-packet draft <delivery-id> <output.json> <work-item-id...> [--repo-root <path>...]
      route: local helper
      purpose: generate an editable Review Packet draft from repo state before source-backed completion evidence is finalized
    - id: review-packet-validate
      cli: npm run art -- review-packet validate <packet.json>
      route: POST /v1/delivery-art/review-packets/validate
      purpose: validate Review Packet schema, item coverage, changed surfaces, validation evidence, and rollback boundary
    - id: review-packet-readiness
      cli: npm run art -- review-packet readiness <packet.json>
      route: POST /v1/delivery-art/review-packets/readiness
      purpose: prove a source-backed Landing Unit is ready to merge before completion evidence is used
    - id: review-packet-finalize
      cli: npm run art -- review-packet finalize <packet.json>
      route: POST /v1/delivery-art/review-packets/finalize
      purpose: finalize merged or accepted Review Packet evidence and produce the digest used for ART completion
    - id: landing-unit-status
      cli: npm run art -- landing-unit status <packet.json>
      route: local helper
      purpose: compute covered child status, parent closeout candidates, generated payload preflight, WGCF readiness, and projection checkpoint posture
    - id: landing-unit-dry-run
      cli: npm run art -- landing-unit dry-run <packet.json>
      route: local helper
      purpose: prove landing-unit child completion and parent closeout actions without mutating ART
    - id: landing-unit-submit
      cli: npm run art -- landing-unit submit <packet.json>
      route: local helper plus OOS completion routes
      purpose: submit finalized Review Packet evidence, complete covered children, close eligible stale-open parents, and report projection checkpoint state
    - id: item-complete
      cli: npm run art -- item complete <work-item-id> <payload.json>
      route: POST /v1/delivery-work-items/{work_item_id}/complete
      purpose: close one item through evidence-backed completion
    - id: item-stale-open-close
      cli: npm run art -- item stale-open-close <work-item-id> <payload.json>
      route: POST /v1/delivery-work-items/{work_item_id}/stale-open-close
      purpose: close a stale-open item after continuation truth proves the scope is already satisfied
    - id: initiative-close
      cli: npm run art -- initiative close <delivery-id> <payload.json>
      route: POST /v1/delivery-initiatives/{delivery_id}/close
      purpose: guided initiative closeout that records system demo, enters Closing, records inspect-and-adapt, and finishes the initiative
    - id: item-scaffold
      cli: npm run art -- scaffold item-complete <work-item-id> <output.json> [repo-root...]
      route: local helper
      purpose: generate an editable completion-evidence scaffold from repo state
    - id: initiative-scaffold
      cli: npm run art -- scaffold initiative-close <delivery-id> <output.json> [repo-root...]
      route: local helper
      purpose: generate an editable initiative-close scaffold from repo state
  fallback_model:
    normal_rule:
      - normal ART sessions must use broker CLI or broker HTTP routes
      - direct Rails query is forbidden for normal ART work
      - raw kubectl exec plus ad hoc node one-liners are fallback-only, not the default operator path
    when_broker_runtime_is_unavailable:
      - use platform runtime or access runbooks to restore the OpenProject and broker lane first
      - use platform-admin OpenProject controls only for runtime, board, or projection repair
      - do not mutate ART work-state through Rails-admin or OpenProject-local scripts
    when_projection_or_board_drift_is_suspected:
      - start from broker workflow-health
      - use the scoped ART quality gate next
      - use platform-admin view repair only when roadmap or PM² projection drift is the real problem
    projection_reconciliation_after_mutation:
      - after any ART mutation that returns roadmap_version_projection.status=external_reconciler_required, treat projection reconciliation as a broker-visible checkpoint
      - inspect npm run art -- projection status before deciding whether to continue related same-burst closeouts
      - batch only related dirty events; do not defer dirty projection sync until the whole Epic is finished
      - run npm run art -- projection sync --pi-names "<known-pis>" --target-epic-id <epic-id> --quality before treating roadmap projection health or scoped quality as final
  compatibility_boundary:
    broker_owned_normal_art_surfaces:
      - session bootstrap and workflow health
      - initiative reads, planning, and review readiness
      - initiative writes, planning repair, and closeout
      - work-item reads, writes, and closeout
      - closeout scaffolding helpers
    platform_admin_only_surfaces:
      - OpenProject bootstrap and schema provisioning
      - board and roadmap projection repair
      - one-time normalization after contract changes
      - service identity provisioning
      - clean-start, backup, restore, and uninstall controls
  success_metrics:
    - id: one-command-bootstrap
      outcome: operator can resume the ART lane with one bootstrap command
    - id: one-command-workflow-health
      outcome: operator can see roadmap and PM² projection health with one command
    - id: one-command-active-session
      outcome: operator can resume an active initiative with one bounded active-session packet instead of rereading the full execution summary
    - id: bounded-evidence-packets
      outcome: operator can inspect work-item, initiative, and Review Packet evidence posture through bounded packets
    - id: one-command-quality-and-review
      outcome: operator can inspect initiative quality and review readiness without Rails-admin access
    - id: one-command-planning-repair
      outcome: PI retarget and decommit work no longer require ad hoc multi-write repair
    - id: one-command-blocker
      outcome: active blockers can be recorded and cleared through one bounded operator path instead of chat memory or generic status edits
    - id: one-command-item-close
      outcome: item completion and stale-open closeout each have one bounded operator path
    - id: one-command-landing-unit-closeout
      outcome: landing-unit child completion, parent closeout candidates, generated payload preflight, WGCF receipts, and projection checkpoint handling are one command family
    - id: one-command-initiative-close
      outcome: initiative closeout no longer requires reconstructing separate system-demo, Closing, inspect-and-adapt, and done writes
    - id: zero-normal-session-rails
      outcome: normal ART sessions no longer depend on direct Rails query
    - id: zero-normal-session-raw-pod-exec
      outcome: normal ART sessions no longer require raw kubectl exec plus node one-liners
