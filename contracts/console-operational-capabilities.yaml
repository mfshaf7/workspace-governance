    One operator can move a real idea through proposal, prototype, delivery,
    architecture, repository custody, source, human review and merge, intake,
    runtime, and portfolio operation from the Governance Operations Console
    without routine CLI or Codex intervention.
  activation_ref: openproject://work_packages/1278
