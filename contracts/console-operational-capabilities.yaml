    contract_state:
      - missing
      - defined
    implementation_state:
      - absent
      - planned
      - implemented
    runtime_state:
      - unavailable
      - degraded
      - available
    evidence_state:
      - unproven
      - validated
    demonstration_source:
      - none
      - fixture
      - disconnected-preview
      - live-authority
  status_profiles:
    planned:
      contract_state: defined
      implementation_state: planned
      runtime_state: unavailable
      evidence_state: unproven
      demonstration_source: none
    implemented-uncommissioned:
      contract_state: defined
      implementation_state: implemented
      runtime_state: unavailable
      evidence_state: validated
      demonstration_source: none
    fixture-demonstration:
      contract_state: defined
      implementation_state: implemented
      runtime_state: unavailable
      evidence_state: validated
      demonstration_source: fixture
    disconnected-preview:
      contract_state: defined
      implementation_state: implemented
      runtime_state: unavailable
      evidence_state: validated
      demonstration_source: disconnected-preview
    degraded-live:
      contract_state: defined
      implementation_state: implemented
      runtime_state: degraded
      evidence_state: validated
      demonstration_source: live-authority
    operational-live:
      contract_state: defined
      implementation_state: implemented
      runtime_state: available
      evidence_state: validated
      demonstration_source: live-authority
  operating_truth:
    observed_at: '2026-10-24T01:51:43.133012Z'
    observation_scope: local-dev-integration
    source_ref: openproject://work_packages/1298
    reuse_requires_profile: operational-live
    fresh_evidence_required: true
    stale_or_missing_behavior: not-reusable
  fixture_boundary:
    allowed_modes:
      - unit-test
      - storybook
      - disconnected-preview
    live_mode_source: live-authority
    live_owner_unavailable_behavior: fail-closed-visible
    fixture_completion_evidence_allowed: false
    fixture_live_fallback_allowed: false
  plan_completeness:
