schema_version: 1
governed_intake_assist:
  owner_repo: workspace-governance
  primary_operator_surface: docs/governed-intake-assist.md
  platform_contract_refs:
    profile_registry:
      repo: platform-engineering
      path: security/governed-ai-model-profiles.yaml
    access_plane:
      repo: platform-engineering
      path: security/governed-ai-access-plane.yaml
    runtime_assist_contract:
      repo: platform-engineering
      path: security/governed-ai-runtime-assist-contract.yaml
    security_review:
      repo: security-architecture
      path: docs/reviews/platform/2026-08-20-intake-classifier-v1-local-ollama-binding.md
  consumer:
    caller_id: workspace-governance/intake-assist
    caller_repo: workspace-governance
    caller_workflow: governed-intake-assist
    purpose: workspace-intake-assist
    profile_id: intake-classifier-v1
    invocation_path: governed-ai-gateway
    endpoint_path: /v1/governed-ai/invoke
    devint_loopback_origin: http://127.0.0.1:18290
    provider_output_schema_ref:
      repo: platform-engineering
      path: security/schemas/intake-classification-result.schema.json
    suggestion_candidate_schema_ref:
      repo: workspace-governance
      path: contracts/schemas/intake-ai-suggestion-candidate.schema.json
    accepted_record_schema_ref:
      repo: workspace-governance
      path: contracts/schemas/intake-ai-suggestion.schema.json
    allowed_data_scope:
      - repo metadata
      - top-level manifests
      - README excerpts
      - AGENTS excerpts
      - operator-supplied intake notes
  activation_state:
    source_contract_status: active
    live_consumption_allowed: true
    reason: >
      The local dev-integration binding, governed access plane, caller and
      operator identity boundary, audit ledger, provider-bypass denial, and
      current security review are proven. Workspace consumption remains
      suggestion-only and still requires explicit operator acceptance.
    required_live_gates:
      - profile-active
      - access-plane-live
      - identity-boundary-live
      - audit-retention-live
      - provider-egress-blocked
      - security-delta-review-current
    gate_evidence:
      profile-active:
        - repo://platform-engineering/security/governed-ai-model-profiles.yaml
        - github://mfshaf7/platform-engineering/pull/214
      access-plane-live:
        - repo://platform-engineering/security/governed-ai-access-plane.yaml
        - openproject://work_packages/866
      identity-boundary-live:
        - repo://platform-engineering/dev-integration/profiles/governed-ai-gateway/scripts/smoke.sh
      audit-retention-live:
        - repo://platform-engineering/dev-integration/profiles/governed-ai-gateway/profile.yaml
      provider-egress-blocked:
        - repo://platform-engineering/security/governed-ai-devint-egress-policy.yaml
      security-delta-review-current:
        - repo://security-architecture/docs/reviews/platform/2026-08-20-intake-classifier-v1-local-ollama-binding.md
        - openproject://work_packages/854
  suggestion_contract:
    authority: suggestion-only
    autonomous_mutation_allowed: false
    provider_output_schema_ref:
      repo: platform-engineering
      path: security/schemas/intake-classification-result.schema.json
    suggestion_candidate_schema_ref:
      repo: workspace-governance
      path: contracts/schemas/intake-ai-suggestion-candidate.schema.json
    accepted_record_schema_ref:
      repo: workspace-governance
      path: contracts/schemas/intake-ai-suggestion.schema.json
    allowed_decisions:
      - out-of-scope
      - proposed
      - admitted
    denied_actions:
      - model-output-direct-mutation
      - direct-provider-client
      - repo-local-provider-secret
      - unaudited-operator-acceptance
      - rejected-suggestion-register-write
  operator_acceptance:
    human_approval_required: true
    acceptance_required_before_workspace_truth_update: true
    allowed_acceptance_states_for_truth_update:
      - accepted
      - overridden
    override_requires_reason: true
    required_fields:
      - accepted_by
      - accepted_at
      - decision_id
      - suggested_decision
      - operator_decision
      - acceptance_state
      - audit_ref
  workspace_truth_updates:
    allowed_targets:
      - contracts/intake-register.yaml
    allowed_decision_sources:
      - operator
      - ai-suggested
    ai_suggested_requires_active_profile: true
    ai_suggested_requires_operator_acceptance: true
    write_authority: governed workflow after operator approval
    forbidden_actions:
      - direct model write to canonical contracts
      - provider credentials in workspace-governance
      - unaccepted AI suggestion in intake-register.yaml
      - bypassing intake-policy.yaml status semantics
  audit_contract:
    required_fields:
      - event_time
      - correlation_id
      - caller_identity
      - operator_identity
      - approved_profile_id
      - invocation_path
      - upstream_provider
      - provider_route
      - upstream_model
      - upstream_model_digest
      - provider_runtime_version
      - prompt_version
      - provider_schema_valid
      - provider_latency_ms
      - provider_usage
      - purpose
      - output_schema_ref
      - policy_decision
      - outcome
      - operator_acceptance_state
      - override_reason
