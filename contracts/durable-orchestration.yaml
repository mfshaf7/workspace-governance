schema_version: 2
durable_orchestration:
  owner_repo: workspace-governance
  defining_art_ref: openproject://work_packages/700
  parent_initiative_ref: openproject://work_packages/698
  primary_operator_surface: docs/durable-orchestration-governance.md
  contract_status: runtime-admission-review
  recommendation:
    workspace_contract: new
    aggregate_orchestrator: extend
    governance_activity_boundary: replace
    durable_runtime: new
    rationale: >-
      Existing Console design contracts define the intended behavior, OOS
      already owns shared operator workflows, WGCF already owns governance
      execution, and Platform Engineering already owns runtime adoption. The
      missing layer is one workspace authority contract plus an admitted
      durable runtime adapter behind OOS.
  authority:
    contract_owner: workspace-governance
    aggregate_orchestrator: operator-orchestration-service
    durable_runtime_owner: platform-engineering
    durable_runtime_adapter: temporal
    security_acceptance_owner: security-architecture
    operator_cockpit_owner: governance-operations-console
    direct_console_runtime_access_allowed: false
    domain_business_authority_preserved: true
    aggregate_orchestrator_owns:
      - workflow definition catalog
      - orchestration request acceptance
      - run-control API
      - correlation and causation
      - aggregate run projection
      - final orchestration receipts
    runtime_adapter_owns:
      - durable scheduling
      - deterministic workflow replay
      - timers and wait persistence
      - activity retry dispatch
    operator_cockpit_owns:
      - intent preparation
      - approval collection
      - definition and run projection
      - allowed-control presentation
    activity_owners:
      workspace-governance-control-fabric:
        - governance validation activities
        - readiness evaluation activities
        - governance receipts and ledger correlation
      context-governance-gateway:
        - context admission activities
        - packet and redaction receipts
      platform-engineering:
        - runtime lifecycle activities
        - deployment and promotion activities
      security-architecture:
        - trust-boundary decisions
        - security acceptance evidence
  qualification:
    default: synchronous
    classifications:
      - synchronous
      - conditional
      - durable-candidate
      - admitted-durable
    durable_triggers:
      - restart survival
      - multiple non-atomic side effects
      - external or human wait beyond one request
      - controlled retry or timeout
      - reconciliation or compensation
      - durable cancel, pause, resume, or signal
      - correlated history across multiple execution owners
    explicit_non_candidates:
      - draft editing and autosave
      - user interface navigation
      - review forms and packet preparation
      - ordinary CRUD
      - single-record status updates
      - read projections and dashboards
      - direct start, stop, restart, or health check for one runtime
      - controls against an already running orchestration
  definition_contract:
    lifecycle:
      - candidate
      - qualified
      - definition-ready
      - implementation-requested
      - admission-review
      - active
      - suspended
      - retired
    immutable_version_states:
      - active
      - suspended
      - retired
    required_fields:
      - definition_id
      - definition_version
      - title
      - purpose
      - source_domain
      - source_record_type
      - business_owner
      - implementation_repo
      - execution_owner
      - execution_node_owners
      - trigger
      - approval_requirements
      - source_version_refs
      - idempotency_strategy
      - lock_strategy
      - execution_graph
      - wait_and_signal_contract
      - retry_and_timeout_contract
      - compensation_strategy
      - cancellation_boundary
      - completion_condition
      - expected_receipt
      - return_projection
      - evidence_and_retention
      - security_requirements
      - rollout_and_rollback
    executable_source_rules:
      reviewed_git_source_required: true
      arbitrary_operator_code_allowed: false
      runtime_node_upload_allowed: false
      secret_values_in_definition_allowed: false
  run_contract:
    lifecycle:
      - queued
      - running
      - waiting
      - blocked
      - failed
      - completed
      - cancelled
    controls:
      - retry
      - resume
      - signal
      - cancel
      - defer
    wait_kinds:
      - authority-decision
      - external-event
      - dependency
      - timer
    effect_postures:
      - none
      - possible
      - partial
      - verified
    blocker_dispositions:
      - remove
      - workaround
      - accept-risk
      - defer
    required_projection_fields:
      - request_id
      - run_id
      - definition_id
      - definition_version
      - source_domain
      - source_record_ref
      - correlation_ref
      - causation_ref
      - state
      - current_node
      - progress
      - wait
      - blocker
      - failure
      - retry_status
      - effect_posture
      - control_availability
      - artifact_refs
      - log_refs
      - receipt_refs
      - event_refs
      - source_projection_ref
      - source_projection_version
      - created_at
      - last_projected_at
      - completed_at
  admission:
    active_definition_requires_all_gates: true
    gates:
      - contract-valid
      - implementation-reviewed
      - deterministic-replay-tested
      - activity-idempotency-tested
      - failure-and-control-tested
      - dev-integration-profile-active
      - platform-runtime-accepted
      - security-review-accepted
      - source-projection-verified
      - rollback-and-suspension-proven
    controlled_proof:
      policy_ref: contracts/developer-integration-policy.yaml#controlled_proof
      proof_classification: component-commissioning-proof
      permit_schema_ref: contracts/schemas/controlled-runtime-proof-authorization.schema.json
      result_schema_ref: contracts/schemas/controlled-runtime-proof-result.schema.json
      permit_issuer:
        owner_repo: platform-engineering
        source_review_work_item_ref: openproject://work_packages/792
        merged_source_required_before_security_authorization: true
      executor:
        owner_repo: platform-engineering
        source_review_work_item_ref: openproject://work_packages/792
        merged_source_required_before_security_authorization: true
      target:
        profile_id: temporal
        profile_lifecycle: build-admitted
        environment: dev-integration
      lifecycle_transition_allowed_during_proof: false
      self_serve_launch_allowed: false
      definition_allowlist:
        - definition_id: validation-readiness-run
          definition_version: 1
      required_scenarios:
        - nominal-completion
        - workflow-worker-restart
        - temporal-runtime-restart
        - deterministic-replay
        - duplicate-suppression
        - cancellation
        - unavailable-dependency
        - identity-denial
        - payload-boundary
        - backup-restore
        - exact-baseline-restore
      commissioning_session:
        authorization_consumption: atomic-single-use
        one_session_per_authorization: true
        exact_scenario_execution_set_required: true
        scenario_execution_ids_unique: true
        required_receipt_owners_declared_per_execution: true
        retries_cancels_replays_and_dedup_bound_to_session_and_execution: true
      receipt_owners:
        - platform-engineering
        - operator-orchestration-service
        - workspace-governance-control-fabric
      permitted_action_allowlist:
        - install-scoped-runtime
        - start-validation-readiness-run
        - restart-oos-workflow-worker
        - restart-wgcf-activity-worker
        - restart-temporal-runtime
        - cancel-validation-readiness-run
        - simulate-unavailable-dependency
        - verify-identity-denial
        - capture-backup
        - restore-exact-baseline
        - remove-scoped-runtime
      required_stop_conditions:
        - authorization-expired
        - source-or-artifact-digest-mismatch
        - target-scope-mismatch
        - identity-or-queue-denial-failure
        - baseline-snapshot-unavailable
        - unexpected-side-effect
        - evidence-custody-failure
        - restore-failure
      terminal_cleanup_authority:
        mode: exact-baseline-restore-only
        applies_to: already-started-commissioning-session
        trigger_scope: any-triggered-stop-condition
        scope_binding: exact-captured-restore-scope
        new_proof_actions_denied: true
        scope_expansion_denied: true
        runtime_retention_denied: true
        permitted_actions:
          - remove-scoped-runtime
          - restore-exact-baseline
          - record-restore-evidence
          - record-governed-exception
        termination_conditions:
          - exact-baseline-restored
          - governed-exception-recorded
      evidence_phases:
        pre_run_authorization:
          artifact_type: controlled-runtime-proof-authorization
          grants_profile_activation: false
          grants_definition_activation: false
          reusable_as_post_run_activation_evidence: false
        post_run_activation_review:
          artifact_type: controlled-runtime-proof-result
          schema_ref: contracts/schemas/controlled-runtime-proof-result.schema.json
          authorization_artifact_digest_must_match_consumed_permit: true
          passed_receipt_pairs_must_match_authorization: true
          owner_receipts_bind_authorization_session_execution_and_result: true
          permit_timeline_must_validate: true
          exact_baseline_restore_required: true
          baseline_snapshot_must_match_authorization: true
          security_acceptance_required: true
          profile_activation_allowed_before_acceptance: false
          definition_activation_allowed_before_acceptance: false
      denied_outcomes:
        - business workflow execution
        - normal self-serve profile launch
        - active profile projection during proof
        - active definition projection during proof
        - governed stage or production evidence claim
        - retained runtime state without governed reclassification
    current_runtime:
      adapter: temporal
      lifecycle: build-admitted
      dev_integration_profile: temporal
      shared_runtime_allowed: false
      governed_stage_allowed: false
      production_allowed: false
  initial_definitions:
    - definition_id: validation-readiness-run
      definition_version: 1
      definition_state: qualified
      qualification: durable-candidate
      role: safe-runtime-proof
      source_domain: workspace-governance-control-fabric
      implementation_repo: operator-orchestration-service
      execution_owner: operator-orchestration-service
      activity_owners:
        - workspace-governance-control-fabric
      expected_receipt: orchestration-validation-readiness-receipt
      admitted: false
    - definition_id: delivery.refinement.apply
      definition_version: 1
      definition_state: definition-ready
      qualification: durable-candidate
      role: first-business-workflow
      source_domain: delivery-refinement
      implementation_repo: operator-orchestration-service
      execution_owner: operator-orchestration-service
      activity_owners:
        - operator-orchestration-service
        - workspace-governance-control-fabric
      expected_receipt: delivery-refinement-apply-receipt
      admitted: false
  implementation_order:
    safe_runtime_proof:
      - validation-readiness-run
    business_definitions:
      - delivery.refinement.apply
      - delivery.work-design.apply
      - delivery.review-packet-closeout
      - prototype.landing
      - model-profile.fulfillment-and-activation
  denied_authority_claims:
    - WGCF owns aggregate orchestration
    - OOS is only an activity adapter
    - Governance Operations Console calls Temporal directly
    - Temporal owns business workflow policy
    - a definition is active without admission evidence
    - a local dev-integration run is governed stage or production evidence
