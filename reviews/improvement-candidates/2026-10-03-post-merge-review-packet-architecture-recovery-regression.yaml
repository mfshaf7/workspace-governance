signals:
- id: conformance-applicability-and-evidence-ownership-conflated
  title: Architecture approval conflated outcome applicability with evidence ownership
  trigger: closed-lesson-regression
  failure_classes:
  - learning-closure-regression
  - workflow-doctrine-gap
  - rollout-evidence-gap
  finding: >-
    The schema-v4 architecture contract models only
    applies_to_work_item_ids. Workspace validation and OOS runtime projection
    both interpret that same list as the acceptance scope and as the set of
    work items required to provide evidence. WGCF readiness selection repeats
    the same interpretation. Those are different concepts for
    composed Feature outcomes: a Feature may depend on an operating case while
    one or more explicitly assigned activation work items produce the proof.
    The overloaded field allowed live-backend obligations to be projected onto
    supporting source, Console, or Security children and still pass
    architecture validation. The canonical project-delivery-operator skill
    compounded the risk by still calling v3 the normal shape after v4 was
    activated. The error was found only when work item 1228
    attempted finalization, repeating the closed topology and evidence-
    authoring lesson. The durable fix must model outcome applicability and
    evidence ownership separately at Landing Unit granularity, validate causal
    closure from the evidence owner to each external applicable outcome, and
    make OOS and WGCF select evidence by the declared owner and readiness phase.
  source_refs:
  - openproject://work_packages/1203
  - openproject://work_packages/1228
  - wgcf://artifacts/delivery-art/sha256/d58f27720c4a8a67758a5241a11786e3f92fc38ead4b5ac4ae821c82e0a5d400
  - wgcf://artifacts/delivery-art/sha256/215b8363f7bf0be55e26b73c8b76eb805cf631d00187f85725e7b4cbb60b0eb4
  - workspace-governance/reviews/improvement-candidates/2026-09-30-delivery-art-historical-artifact-compatibility-gap.yaml
  - workspace-governance/skills-src/project-delivery-operator/SKILL.md
  - 'conversation:2026-10-03 operator stated that the planning mistake keeps recurring and must be fixed now'
- id: post-merge-evidence-recovery-gap
  title: Architecture supersession left a merged evidence-bearing session without a legal recovery transition
  trigger: closed-lesson-regression
  failure_classes:
  - learning-closure-regression
  - rollout-evidence-gap
  - workflow-doctrine-gap
  finding: >-
    OOS correctly rejected finalization when the earlier architecture assigned
    operating-ready cases to supporting source child 1228. After the corrected
    architecture became current, work status correctly projected
    architecture-superseded, but work recover rejected the session solely
    because its already-merged source had a merge-ready Review Packet. The
    documented recovery contract handles merged sessions only when no Review
    Packet exists, so the two fail-closed controls form a dead end. The
    strongest bounded repair is a distinct recovery mode that accepts only an
    exact merged PR plus an existing non-finalized merge-ready packet, archives
    both without rewriting them, emits a digest-bound recovery receipt, and
    still requires a new Landing Unit identity and full recovery-supersession
    chain under the current architecture.
  source_refs:
  - openproject://work_packages/1228
  - https://github.com/mfshaf7/operator-orchestration-service/pull/265
  - wgcf://artifacts/delivery-art/sha256/d58f27720c4a8a67758a5241a11786e3f92fc38ead4b5ac4ae821c82e0a5d400
  - wgcf://artifacts/delivery-art/sha256/215b8363f7bf0be55e26b73c8b76eb805cf631d00187f85725e7b4cbb60b0eb4
- id: v5-causal-closure-cycle-termination-gap
  title: V5 causal closure could loop after detecting cyclic parent links
  trigger: late-root-cause-discovery
  failure_classes:
  - workflow-doctrine-gap
  - rollout-evidence-gap
  finding: >-
    The staged v5 semantic validator detected cyclic descendant parent links
    but then continued into causal parent closure without a visited-node guard.
    A malformed packet could therefore hang validation instead of returning
    the already-established cycle error. Cross-repo inspection found the same
    algorithm in Workspace Governance, OOS, and WGCF before v5 activation.
    The closing control must make the closure traversal terminating in all
    three consumers and add a cyclic-parent regression case before activation.
  source_refs:
  - workspace-governance/scripts/validate_contracts.py
  - operator-orchestration-service/src/delivery-art/contracts.js
  - workspace-governance-control-fabric/packages/control_fabric_core/src/control_fabric_core/delivery_art_contracts.py
- id: delivery-art-initiative-read-scope-was-unbounded
  title: Initiative evidence reads enumerated the full Delivery ART before scoping
  trigger: machine-visible-workflow-drift
  failure_classes:
  - workflow-doctrine-gap
  - rollout-evidence-gap
  finding: >-
    The first live v5 smoke timed out because OOS retrieved more than 1,100
    Delivery ART work packages through sequential project-wide pages before it
    projected one requested initiative. Limiting relation processing alone did
    not remove that initial enumeration. OOS PR 271 now uses native OpenProject
    id and ancestor filters, hydrates only required external relation endpoints
    and ancestor chains, and resolves work-item evidence through the same
    bounded path. The merged-main read-only smoke completed in 17.56 seconds
    and covered active-session, initiative-evidence, and work-item closeout
    reads. The durable lesson is that initiative-scoped operator reads must be
    bounded at the backend query, not only after retrieval.
  source_refs:
  - https://github.com/mfshaf7/operator-orchestration-service/pull/271
  - operator-orchestration-service/docs/records/change-records/2026-10-03-delivery-art-initiative-relation-read-scope.md
  - /home/mfshaf7/projects/.dev-integration/sessions/accepted-idea-delivery-mfshaf7-20261003T095658Z/accepted-idea-delivery-mfshaf7-20261003T095658Z-smoke-20261003T100420691011Z-f0cfb8c4.result.yaml
- id: dev-integration-composition-preflight-gap
  title: Composition mutation began before source and restart prerequisites were proven
  trigger: late-host-drift-discovery
  failure_classes:
  - workflow-doctrine-gap
  - host-drift-undetected
  finding: >-
    A branch-bound rehearsal started an OOS host service from a worktree that
    lacked installed Node dependencies, so the executor failed on the ajv
    import and the full composition suspended itself. After a later host crash,
    the runner again began reconciling multiple profiles before discovering
    that the operator runtime directory was root-owned, the user systemd
    manager was absent, and the interrupted Temporal Helm release was still
    pending. Fail-closed cleanup preserved persistent state, but the late checks
    caused repeated full composition cycles. The proposed durable control is a
    non-mutating composition preflight that proves source dependency readiness,
    operator runtime-directory ownership, the user systemd/auto-resume path,
    and absence of pending Helm operations before the first profile mutation.
    This Platform control remains unimplemented pending operator approval.
  source_refs:
  - platform-engineering/scripts/dev_integration.py
  - platform-engineering/scripts/dev_integration_auto_resume.py
  - operator-orchestration-service/src/delivery-art/review-evidence-acquisition.js
  - /home/mfshaf7/projects/.dev-integration/accepted-idea-delivery/mfshaf7/host-services/delivery-source-executor/service.log
- id: profile-smoke-lost-composition-context
  title: Profile smoke omitted active composition bindings and skipped their checks
  trigger: machine-visible-workflow-drift
  failure_classes:
  - rollout-evidence-gap
  - workflow-doctrine-gap
  finding: >-
    The accepted-idea-delivery smoke passed its bounded ART reads while printing
    the Refinement and Catalog composition and Workspace Intake and Inventory
    composition as inactive, even though the surrounding refinement-catalog
    composition status proved those dependencies active. The standalone smoke
    action does not carry the current composition identifier, so it cannot prove
    the composed dependencies it appears to report. The proposed durable
    control is for smoke to derive or receive the active composition binding and
    fail when expected composed dependencies are not checked. This Platform
    control remains unimplemented pending operator approval.
  source_refs:
  - platform-engineering/scripts/dev_integration.py
  - /home/mfshaf7/projects/.dev-integration/sessions/accepted-idea-delivery-mfshaf7-20261003T095658Z/accepted-idea-delivery-mfshaf7-20261003T095658Z-smoke-20261003T100420691011Z-f0cfb8c4.result.yaml
