schema_version: 1
id: 2026-10-03-post-merge-review-packet-architecture-recovery-regression
title: Prevent invalid operating-readiness allocation and preserve merged recovery evidence
recorded_on: '2026-10-03'
owner_repo: workspace-governance
summary: >-
  Delivery 1203 architecture validation checked topology, conformance coverage,
  polarity, and fidelity but used one applicability field for two different
  meanings: which work-item outcomes depend on a case and which Landing Unit
  must produce its evidence. Invalid live-backend obligations were
  therefore projected onto supporting children and discovered only after work
  item 1228 had merged. Superseding the architecture then exposed a second gap:
  the normal work-session recovery command could not preserve the already-
  merged source and durable merge-ready Review Packet while moving work to the
  corrected architecture.
regression_of: workspace-governance/reviews/improvement-candidates/2026-08-24-art-architecture-topology-capture-regression.yaml
status: closed
source_type: machine-audit
