  finding: The source-intent lock predates the replacement API pod by 98 seconds and
    names PID 1. The new container also runs Node as PID 1, so process.kill(pid,0)
    mistakes the new process for the dead holder. Project Evidence twice returned
    state_busy despite the original PR being published and approved. The first containment
    safely archived that exact orphan after all shared-state writers terminated. Codex
    then resumed primary evidence before activating the merged durable repair. Pausing
    the refresh timer through the longer review window also exceeded its five-minute
    record freshness bound; restoring it performed a legitimate pending credential
    rollout during another old-code source effect, reproducing the same PID-reuse
    orphan. This was an avoidable sequencing mistake. Activate the repaired source
    before continuing primary effects, and bound quiescence to the actual migration
    window rather than weakening freshness or suppressing normal credential consumption.
