    real parent rules and actual review. Trace live metadata through canonical
    values, per-type writability, accepted per-target fields and native writer
    readback before landing; do not force future actual business value at
    planning, use placeholder records, expand Work Design kinds or weaken ready
    contracts. Existing acceptance1298 owns this maintenance.
