    are missing live bindings, not a reason to re-enable fixtures or weaken
    denial. A whole remaining-path check also found the commissioned OOS
    source-realization API family but no corresponding Console API client,
    routes or implementation/digest-acceptance interaction. Existing work-session
    controls only start, continue, merge and close; they cannot perform the
    backend's separate source-realization transitions. Live OOS also reports
    OOS_SOURCE_REALIZATION_ENABLED false. The existing bounded-source-realization
    Security review explicitly approves source merge only and requires later
    model-profile, Platform and operating acceptance. That is an uncompleted
    commissioning prerequisite, not a broken flag to override or a regression.
    Include that existing gate chain in the same remaining-path repair plan.
    Cold-read regression tests in the coherent repair caught another shared
    cause: the live Maturity projector invoked fixture transition helpers,
    which appended prototype-local evidence to a valid owner promotion. Remove
    those helpers from live projection rather than weakening the test. Preserve
    independently observed preview/evidence, project only merged owner lifecycle
    and receipts, and guard against simulated effects crossing the live boundary.
    This is part of the same approved maintenance batch, not another ART item.
    Actual gateway contract inspection before commissioning found that the
    realization caller_workflow did not match its caller_id suffix and its
    provider schema reference pointed to OOS rather than the Platform-owned
    strict provider schema. Correct both source bindings; retain the stricter
    OOS acceptance schema and add matching positive/negative gateway proof.
    The same inspection found no complete-runtime configuration for the existing
    Studio Preview owner adapter. Its fixed control revision must remain reviewed
    while its served canonical record revision follows the approved Platform
    checkpoint; no new source runner or preview authority is needed. The real
    committed Studio collection was read-only projected through the actual
    Console mapper successfully, with all four current records and no browser
    overlay. That is engineering fidelity evidence, not final operating proof.
    Accepted case1298-positive
    requires a real Console-created app; hidden Codex/CLI source work is forbidden.
    Preserve all completed custody/capture history and the successful credential
    repair. Keep1298 blocked, map the remaining primary-read and realization
    links together, and extend the existing Studio/OOS/Console owner boundaries
    rather than create ART children, an architecture-version loop, a generic
    gateway, or another implementation mechanism. Existing Portfolio/Registry
    and source execution must be checked for current supported handoffs, not
    inferred defective from a placeholder elsewhere.
    Whole-path contract inspection also found that WGCF intentionally reads a
    deployment-refreshed origin/main ref and performs no fetch or checkout; its
    profile requires local HEAD equal that ref, while complete-runtime acceptance
    pins reviewed owner HEADs. OOS source adapters likewise depend on local trusted
    Git history for provider revisions. Treat fresh canonical records versus
    fixed reviewed execution code as an architecture decision, not a reason to
    weaken guards or declare WGCF defective for following its contract. A future
    post-merge failure has not been fabricated as observed live evidence.
    Proposed posture is extend existing owners: Platform maintains approved data
    freshness, OOS/WGCF consume authoritative snapshots, execution code stays
    review-pinned and Console never gets Git authority. The architecture
    discussion gate paused new implementation until that source/data boundary
    was agreed. On 2026-10-16 the operator approved the required coherent fixes,
    including this boundary, while requiring non-narrow implementation. The
    pause is resolved; existing source review and operating acceptance gates
    remain mandatory. Local remaining-path plan records the coherent batch;
    no new service, identity expansion or ART child is authorized by this repair.
    The same whole-path inspection found an interruption recovery gap in the
    uncommissioned realization backend: generation persisted accepted before
    invoking the model, but only draft-ready could be cancelled and retry
    rejected any nonterminal predecessor. A retained accepted record therefore
    had no normal operator exit after process loss. This is a source/state
    recovery finding, not an invented observed live crash. Repair under the
    existing OOS generation lock permits reason-bound cancellation only before
    source acceptance; applying and apply-unknown still require exact-action
    recovery. Keep it within the same approved owner maintenance unit and prove
    interruption, no source mutation and linked retry before commissioning.
    Console remaining-path inspection also confirmed that Candidate/Baseline
    callbacks did not await or expose owner progress/review/failure, and that
    Landing projected the source-code URI into the record-identity field later
    compared with a canonical Delivery packet's record URI. Fix the existing
    dialogs and owner-backed projections within the same Console Landing Unit.
    Cold reconstruction must preserve verified owner promotion receipts without
    re-running browser-local historical preview eligibility, must not fabricate
    preview proof, and must not let an older workflow result downgrade a newer
    canonical Studio lifecycle. Source UI defaults remain unaccepted defaults.
    The operator's later Delivery question confirms this is still a visible
    acceptance blocker, not a newly invented defect. Existing lifecycle and
    realization contracts require the preserved incubation idea to hand off
    into Delivery for Work Design and governed source execution. Prototype
