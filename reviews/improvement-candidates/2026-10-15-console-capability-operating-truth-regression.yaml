  finding: >-
    October23 full normal activation and current source acceptance passed,
    but the actual same-target Delivery1306 Context Session assist returned503
    context_projection_failed, Work Design upstream is not configured. Native
    broker metadata-only environment inspection proves its Work Design context
    URL and caller ID empty and its dedicated credential absent, while
    Refinement, Agent Console and the gateway are present. The workspace
    refinement-catalog composition omits the already registered Work Design
    endpoint/caller/credential. Both OOS and CGG deliberately restrict that
    boundary to work-design-advice, so a live secret patch or copied Refinement
    credential would contradict the contract. Existing complete-runtime proof
    did not exercise this primary plan-authoring route. Extend the existing
    composition admission and both native guards/status producers together,
    retaining dedicated Work Design authentication/replay and unrelated denies.
    Prove both registered shapes, standalone/unregistered denial, missing/mixed
    bindings and full producer-to-consumer configuration before exact composed
    Security acceptance and actual Console context advice/apply. No new service,
    model, caller, ART repair child or lifecycle engine is justified. No app
    source import or canonical ART plan apply occurred; model inference failed
    before CGG admission. Lookahead also confirms the live Refinement packet
    projects only a metadata subset: no Acceptance Criteria/Definition of
    Ready/Definition of Done values, and text-backed Target PI/Iteration are
    represented as selects without allowed values. The existing editor already
    supports per-target values and real enum choices; extend its real producer,
    not a new editor or invented enumeration. Native read-only client/form
    inspection of1306 proves actual writable fields and both String versus
    CustomOption representations; no mutations. The current Work Design schema
    intentionally lacks PI Objective. The existing change API already admits
    PI Objective under Epic, but the visible Execution add menu omits it and
    incorrectly offers Feature under PI Objective contrary to canonical parent
