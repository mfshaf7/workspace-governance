owner_repo: workspace-governance
summary: >-
  Epic 1275 treated several pre-existing Console capabilities as reusable
  operating truth because contracts and source existed, even though the live
  Console still exposed prototype-local Repository, Delivery, and Prototype
  surfaces, repository custody remained contract-only, and Registry and
  Portfolio continuity were unavailable. The capability inventory defined the
  five status dimensions but did not record or validate an observed status for
  each capability before planning marked it reusable.
