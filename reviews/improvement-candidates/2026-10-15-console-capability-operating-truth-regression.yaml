- id: private-client-custody-not-qualified-end-to-end
  title: Public demo workaround and shared Studio custody missed the private-client requirement
  trigger: late-root-cause-discovery
  failure_classes:
  - unsafe-assumption
  - owner-boundary-miss
  - diagnostic-ordering-miss
  finding: >-
    The operator rejected making the to-do repository public because the
    system must also build private client applications. This supersedes the
    earlier visibility question; retain the existing private repository and
    do not treat continue as permission to expose it or waive provider
    enforcement. Fresh GitHub readback proves workspace-prototype-studio is
    public while repository1421451929 remains private. Current Landing would
    create app source and design records in that public Studio; the registry
    private-internal label is not provider access control. No to-do app source
    has been generated. The contract already admits reference-only dedicated
    owner custody, but Landing still requires public Studio documentation and
    Preview currently resolves only Studio-local prototype paths. Reusing
    those pieces does not yet prove confidential end-to-end custody. Extend
    existing source-custody, owner-record and runtime boundaries together;
    keep client source, detailed design, model context, evidence and build
    output out of public paths, and expose only explicitly approved metadata.
    Separately, GitHub refuses protection and ruleset reads for the current
    private target under its plan. Executor checks and simulated provider
    denial are not equivalent to actual GitHub branch enforcement. A supported
    provider plan or an explicit, bounded test-only security decision is
    needed before protected source execution can be claimed. No paid plan,
    visibility change, org source token, policy waiver or new ART child was
    performed at discovery. The operator subsequently explicitly approved
    making only the synthetic to-do demo public to prove actual system
    operation first. Provider readback proves repository1421451929 public,
    with unchanged README-only main. Native rulesets25266184 and25266185 now
    restrict main updates to the exact human via PR, require fresh review,
    and deny force/deletion. This removes the private-plan restriction, not
    the remaining source admission, actual trusted CI or authoring gaps.
    Private-client custody remains unqualified and outside this public-demo
    source batch; no confidential data, paid plan, policy waiver or public
    runtime exposure was authorized. Keep the complete private journey
    unproven until actual owner and runtime evidence qualifies it; simulation
    cannot certify production client security.
