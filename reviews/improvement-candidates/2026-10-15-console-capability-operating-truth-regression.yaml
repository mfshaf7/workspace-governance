signals:
- id: promoted-owner-proof-omitted-required-workspace-registration-surfaces
  title: Pair-of-record promotion proof did not cover full owner registration
  trigger: late-root-cause-discovery
  failure_classes:
  - contract-drift
  - rollout-evidence-gap
  finding: >-
    October19 inspection before proposed-owner bootstrap confirmed that the
    native Inventory command and OOS promotion adapter prepare only Intake
    and the selected Inventory file. The full Workspace Governance contract
    validator additionally requires one matching repo-rule per active owner.
    The workspace layout audit also inferred every origin under mfshaf7,
    contradicting the already-selected organization custody/provider binding.
    Schema-valid promotion and credential proof therefore do not yet prove
    complete new-owner registration. Keep the normal-business admission and
    activation hold. Extend the existing owner workflow and validator rather
    than treating App installation, relaxed validation or manual hidden
    operator repair as completion. Preserve exact review, atomic preparation,
    replay, lineage, lifecycle and rollback behavior. Provider-aware origin
    validation is staged with positive and fail-closed tests; complete
    registration integration now also includes conservative context/raw-output
    declarations and the existing generated metadata, guarded as exact typed
    companion data rather than broad instruction/policy permission. Native
    full-model add/suspend/retire/restore and actual Git record-refresh proof
    pass in disposable engineering scope; changed instructions, raw grants,
    extra policy, stale metadata and missing companions are denied. The native
    owner transaction, OOS finite publication/readback and early WGCF findings
    are staged, not accepted or activated. Source/consumer pin refresh,
    proposed-owner bootstrap and full Console operating proof remain unfinished
    in the approved maintenance units. No new ART child,
    closing control or completion claim is created by this capture.
  source_refs:
  - repo://workspace-governance/scripts/validate_contracts.py
  - repo://workspace-governance/scripts/audit_workspace_layout.py
  - repo://workspace-governance/scripts/workspace_inventory.py
  - repo://operator-orchestration-service/src/workspace-inventory/source-client.js
- id: source-admission-consumers-required-an-intake-record-after-atomic-promotion
  title: Staged credential consumers contradicted the actual Inventory promotion transition
  trigger: late-root-cause-discovery
  failure_classes:
  - contract-drift
  - unsafe-assumption
  - rollout-evidence-gap
  finding: >-
    October19 native-source inspection found that Workspace Inventory
    apply_promotion atomically removes the admitted Intake entry and records
    its id, version and digest as active Inventory lineage. The new Platform
    credential reader and uncommitted OOS consumer instead required admitted
    Intake and active Inventory to coexist. Synthetic positive fixtures
    accidentally supplied that impossible steady state. Platform10e8d6e is
    published in held PR320 but has not been merged, accepted or activated;
    no live ordinary source credential was issued to the new product owner.
    Fix the existing consumers against actual owner transition semantics:
    current active Inventory plus canonical promotion lineage and exact
    provider identity are authority after promotion, not a second retained
    Intake entry. Reuse immutable pre-promotion Git evidence when verifying
    the consumed admitted classification; do not resurrect Intake, loosen
    active-state checks, add another record/writer, or fabricate receipts.
    Require the native owner promotion output to feed both actual consumers,
    including absence of Intake after promotion, before publishing revised
    heads. Preserve legacy behavior, suspension/retirement denials, provider
    identity uniqueness and immutable credential bindings. This is an
    implementation/contract-reading miss in the existing approved maintenance
    units, not a new live Defect, ART child or closing-control proposal.
  source_refs:
  - repo://workspace-governance/scripts/workspace_inventory.py
  - https://github.com/mfshaf7/platform-engineering/pull/320
  - repo://platform-engineering/scripts/agent_source_identity.py
  - repo://operator-orchestration-service/scripts/workspace_inventory_source.py
- id: image-smoke-proof-did-not-replay-ci-startup-wait
  title: Eventual local health proof omitted the exact fixed CI startup predicate
  trigger: repeated-operator-friction
  failure_classes:
  - rollout-evidence-gap
  - unsafe-assumption
  finding: >-
    PR350 passed tests and image builds but failed its fixed-two-second API
    smoke wait. Local paired image checks observed accepted-source health at
    1.79 seconds and staged-source health at 2.15 seconds with the expected
    body. Earlier eventual-health probing therefore did not reproduce that
    exact CI timing predicate. Repair the existing CI wait with bounded live
    readiness retry and bounded failure diagnostics, not a new story, startup
    success claim before readiness or product rewrite. The actual retry is
    locally verified, including Docker proxy connection reset handling. Its
    workflow-file publication requires the separately excluded App Workflows
    permission; keep that external gate explicit and do not use ambient human
    source publication as a fallback. This does not diagnose the prior host
    SIGSEGVs or imply completed Console operation.
  source_refs:
  - https://github.com/mfshaf7/operator-orchestration-service/actions/runs/39170949545
  - repo://operator-orchestration-service/.github/workflows/validate-governance-docs.yaml
- id: bounded-diagnostic-blocker-stopped-independent-approved-work
  title: Narrow crash diagnostics incorrectly stopped the whole approved journey
  trigger: repeated-operator-friction
  failure_classes:
  - workflow-doctrine-gap
  - unsafe-assumption
  finding: >-
    During October19 recovery, unavailable administrator-only kernel logs were
    treated as a blocker for all Epic1275 work even though the accepted runtime
    had recovered and independent Console/owner preparation could proceed.
    After acknowledging the mistake, the agent ended another turn instead of
    executing the promised next step, and the operator called out the repeat.
    Kernel logs remain relevant to the unproven native Node SIGSEGV cause;
    they neither prove a product defect nor block every independent source
    change. Preserve failed full validation as unresolved and withhold merge
    readiness while continuing independent approved work. This is an execution
    correction, not a new story, validator, approval gate or crash diagnosis.
  source_refs:
  - 'conversation: operator asked why work stopped and then called out another stop on October19'
  - openproject://work_packages/1298
- id: normal-source-credential-delivery-remains-engineering-only
  title: Fresh Console source sessions cannot obtain their exact Platform credential
  trigger: repeated-operator-friction
  failure_classes:
  - rollout-evidence-gap
  - unsafe-assumption
  finding: >-
    Whole-path source inspection on October18 proves that the existing Delivery
    configured-path preflight returns agent-source-credential-required and asks
    Platform to deliver the exact binding before work start. The configured
    agent adapter only reads a preprojected credential file; prepare configures
    the Git author and publish consumes that file. The Console-facing Platform
    provider admits only six dev-integration actions, not source-identity issue,
    renewal or revocation. The primary Delivery operator surface explicitly
    routes missing/expired bindings back to the Platform identity operator
    surface. Manual maintenance delivery is appropriate for engineering work,
    but is not a self-contained normal Console source path. No live app session
    was fabricated or started to manufacture this finding. Existing fail-closed
    identity behavior is correct; this is an unimplemented Console-only seam,
    not proof that working source publication regressed. It affects existing
    Delivery as well as Prototype and the later new-owner path. Include one
    bounded credential lifecycle action in the already-planned OOS/Platform
    owner work: real approved subject/source-start intent or session, exact admitted repository/id,
    installation, branch/base, caller/operator and expiry; Platform alone keeps
    the key and token, returns only secret-free evidence, renews on approved
    source actions and revokes on close. Preserve separate trusted bootstrap
    scope. Delivery needs a credential before session creation: reuse its real
    canonical subject and approved prospective work-start input, never require
    or fabricate an already-active session just to obtain that credential.
    Recheck exact intent/base/branch at work start and deny cancelled or changed
    intent reuse. Preserve any later permission gate;
    do not broaden App/install selection,
    expose a general shell/mint endpoint or borrow human/provisioning credentials.
    The operator approved this bounded extension on October18 by answering
    continue to the explicit scope question. This is prospective implementation
    authority, not runtime activation or a provider permission grant. Extend
    the existing eight-owner conformance plan before issuer source starts;
    include pre-session Delivery authorization, actual Prototype identity,
    immutable intent replay, renewal, terminal revocation and negative scope
    tests. Keep the existing Studio/WG merge hold and exact final Security
    acceptance. No new ART child, provider grant or source-purpose activation
    is authorized by this approval.
    Platform source is now staged in draftPR320 at exact Gary
    5a8fb9134b8e0835a7b04c877743677911c0bbc2 with native33suites/468run,
    463passed/5existing opt-in native skips, all21new credential cases executed
    through the admitted runtime suite, provider CI and exact-head mfshaf7
    approval. It is held, not merged or commissioned; publication credential
    revoked and clean open-PR source retained. Tests distinguish known pre-mint
    retry from uncertain issuance and preserve normal same-LU recovery with
    explicit revoked predecessor, new approved start digest and rotated branch;
    old revoke cannot mutate a successor. OOS canonical intent authorization,
    strict new receipt/failure consumers and Console actions remain required.
    No actual app source or credential automation has been operated.
    Subsequent consumer inspection caught an unnecessary producer restriction
    before deployment: after expiry and exact predecessor revocation, fresh
    explicit operator approval of unchanged canonical work would still require
    a different source-start digest. That would force unrelated source-session
    or branch churn merely to renew authorization. The existing manual issuer
    does not require changed source for fresh authorization, and the approved
    bounded extension requires fresh approval, not invented new work. Correct
    this within the existing unmerged Platform/OOS units: preserve revoked
    predecessor, exact subject/caller/provider/session bindings and historical
    isolation; permit explicitly approved reauthorization of the same valid
    canonical session; never auto-create successor approval after expiry. Add
    producer/consumer and session-adoption negative/positive cases before
    publishing the revised heads. This is a pre-activation implementation miss,
    not another live product Defect or authority to create a new mechanism.
    The same consumer contract inspection found a producer grammar mismatch:
    Studio registry and OOS/Platform admit canonical one-character Prototype
    slugs, while the new CGG subject regex requires two characters and admits
    trailing/doubled hyphens rejected by Studio. Align the new CGG producer
    with the existing canonical slug grammar and add native positive/negative
    cases; do not narrow the upstream contract to fit the consumer. This is
    pre-activation source compatibility work in the existing owner plan, not
    another business defect, ART child or runtime mechanism.
    During the same uncommitted consumer work, the agent added an independent
    OOS Prototype activation manifest/flag before rereading the existing
    Landing Unit decision, which explicitly retained the existing composed
    Platform/Security commissioning boundary without a second activation gate.
    The new model purpose needs its native suspended profile and exact composed
    acceptance, not a parallel OOS approval mechanism. This was caught before
    publication or deployment. Remove the uncommitted duplicate manifest/gate,
    reuse existing source-realization composition/configuration, and preserve
    the native inactive Prototype model-purpose boundary. Record the affected
    source checkpoint truthfully and prove HTTP/runtime denial through existing
    owner controls; do not rewrite the accepted plan to justify the duplicate.
    No new ART item or closing-control proposal is created by this correction.
  source_refs:
