  - rollout-evidence-gap
  finding: >-
    After accepted activation, original Closure65387 passed all9 readiness
    checks through Console, explicit approval, native StudioPR40/full93tests/
    actualCI/exactMFattestation and merge d830cac. Same Console continuation
    reached canonical succeeded with completed receipt5af8c2f and exact merged
    graduating/incubation-repo readback. Yet the browser retained pending-readback
    and reports Closure review head missing or invalid. The server validates
    raw review.head_commit and delegated_approval, then drops both fields in
    its result projection; the browser invokes the same validator again and
    rejects that projected response. This is a second-pass contract failure,
    not an incomplete owner merge or a reason to reopen the completed request.
    Preserve the bounded validated head and delegation proof across JSON, derive
    human_reviewed from that proof rather than trusting a supplied boolean,
    and prove native OOS response to server projection to browser validation
    across review, pending-readback and terminal states with tamper denials.
    The prior native HTTP proof stopped at the server reader and missed this
