schema_version: 1
id: 2026-08-15-security-index-landing-unit-custody-regression
title: Security index dependency reached work-start custody without its own ART child
recorded_on: '2026-08-15'
owner_repo: workspace-governance
summary: >-
  Proposal contract parity correctly identified the generated security index as
  a separate Landing Unit, but the sequence was initially reversed and the
  second Landing Unit reused ART child #851 until WGCF rejected duplicate
  work-start custody with a 409 conflict.
regression_of: workspace-governance/reviews/improvement-candidates/2026-04-29-security-change-record-index-sequencing-regression.yaml
status: closed
source_type: conversation
scope:
  related_repos:
    - operator-orchestration-service
    - security-architecture
    - workspace-governance
  related_products:
    - governance-operations-console
  related_components:
    - operator-orchestration-service
  change_classes:
    - platform-contract
    - architecture-shaping
signals:
  - id: proposal-security-index-sequence-regression
    title: Generated dependency sequencing contradicted its source authority
    trigger: closed-lesson-regression
    failure_classes:
      - learning-closure-regression
      - routing-miss
      - workflow-doctrine-gap
    finding: >-
      Security PR #116 was first planned to merge before OOS PR #132, although
      security CI deterministically regenerates the index from OOS remote main.
      CI proved the security index can become reproducible only after the OOS
      change record lands.
    source_refs:
      - github://operator-orchestration-service/pulls/132
      - github://security-architecture/pulls/116
      - openproject://work_packages/851
  - id: duplicate-work-start-custody-conflict
    title: A second owner-repo Landing Unit reused one ART child
    trigger: closed-lesson-regression
    failure_classes:
      - workflow-doctrine-gap
      - rollout-evidence-gap
    finding: >-
      The second lifecycle plan reused ART child #851 and reached WGCF before
      failing with wgcf_artifact_registry_conflict (409). Review Packet v2
      work-start identity is bound to the ART child, so the security Landing
      Unit required its own source-backed child #855 before implementation.
    source_refs:
      - openproject://work_packages/851
      - openproject://work_packages/855
      - github://security-architecture/pulls/116
  - id: initiative-closeout-preceded-final-security-index-refresh
    title: Initiative closeout ran before the final generated Security dependency
    trigger: closed-lesson-regression
    failure_classes:
      - learning-closure-regression
      - rollout-evidence-gap
      - workflow-doctrine-gap
    finding: >-
      Delivery Epic #886 reached guided closeout after all ART descendants were
      terminal, but OOS security-evidenced records from the final change-control
      and closeout Landing Units had landed after Security work item #1036
      refreshed the generated index. The missing dependency was detected only
      after the Epic was marked done. Security PR #135 then reconciled the three
      missing OOS records. Guided closeout therefore still lacks a deterministic
      current-index precondition over remote owner-repo truth.
    source_refs:
      - openproject://work_packages/886
      - openproject://work_packages/1036
      - openproject://work_packages/1037
      - github://operator-orchestration-service/pulls/179
      - github://operator-orchestration-service/pulls/180
      - github://security-architecture/pulls/135
resolution:
  after_action_ref: null
  control_refs:
    - type: workflow
      path: operator-orchestration-service/src/delivery-art/contracts.js
      owner_repo: operator-orchestration-service
      note: >-
        Architecture v3 requires unique Landing Units, assigns every work item
        exactly once, validates owner alignment, and enforces an acyclic source
        landing graph with explicit Security-owned human gates.
    - type: validator
      path: workspace-governance/scripts/validate_structured_record.py
      owner_repo: workspace-governance
      note: >-
        Any owner change record declaring security evidence now proves the
        generated Security change-record index is current before normal
        continuation.
    - type: contract
      path: workspace-governance/contracts/delivery-art-operator-path.yaml
      owner_repo: workspace-governance
      note: >-
        Source-landing topology and validation or Security-obligation changes
        are material architecture changes that require a fresh decision rather
        than reusing prior custody.
  note: >-
    Closed after architecture v3 made the original accidental child reuse
    invalid, made generated Security work an explicit ordered Landing Unit,
    and structured-record preflight made stale generated Security indexes a
    fail-closed condition. The broad custody regression no longer owns an
    unresolved control.
follow_up:
  owner_repo: null
  due_on: null
  note: null
