    finding: >-
      The second lifecycle plan reused ART child #851 and reached WGCF before
      failing with wgcf_artifact_registry_conflict (409). Review Packet v2
      work-start identity is bound to the ART child, so the security Landing
      Unit required its own source-backed child #855 before implementation.
    source_refs:
      - openproject://work_packages/851
      - openproject://work_packages/855
      - github://security-architecture/pulls/116
