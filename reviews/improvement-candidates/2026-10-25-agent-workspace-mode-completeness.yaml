  finding: The live Console disables Workspace on Command Center because it only supplies page scope,
    which matches the current contract and is not itself a defect. Opening a full workspace enables
    the value in source but its native modal intercepts clicks on the floating Agent expander outside
    that dialog. A fresh browser reproduced the blocked click in Dev Integration. Registered Workspace
    Registry reaches the generic workspace factory fallback and receives Governed Releases context;
    this was reproduced by the actual constructor and observed in the browser. Every current workspace
    factory returns synthetic summaries. The browser policy permits focused interaction with the workspace
    candidate, while the actual same-origin server denies that combination422; a source-derived route
    probe confirmed the exact denial. Existing OOS and CGG contracts already support workspace scope.
    These are pre-existing gaps, not a regression of the separately completed reference-count repair.
    Whole-Console versus current-workspace meaning is being clarified with the operator before implementation;
    missing whole-Console capability must not be represented as a violation of the narrower existing
    contract.
