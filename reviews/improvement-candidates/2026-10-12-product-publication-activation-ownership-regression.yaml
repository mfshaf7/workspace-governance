  - type: change-record
    path: operator-orchestration-service/docs/records/change-records/2026-10-13-operating-evidence-failure-precedence.md
    owner_repo: operator-orchestration-service
    note: Makes recorded conformance failure take precedence over missing evidence and repairs the recovery route to the active retry-required lifecycle state.
  note: >-
    Epic 894 and Feature 924 are now complete. The existing Workspace Registry
    lifecycle and Product Publication paths were repaired without adding another
    ART child, backend, authority, or parallel workflow. Work item 1273 closed
    with merged Platform PR 302, finalized operating-ready evidence, successful
    operating and process-loss verification, and complete source-resource cleanup.
    The candidate remains accepted because the durable planning control must still
    prevent the combined owner-gate, verifier-fidelity, dependency-pin propagation,
    rollout-ordering, and recovery-state gaps before a future implementation starts.
