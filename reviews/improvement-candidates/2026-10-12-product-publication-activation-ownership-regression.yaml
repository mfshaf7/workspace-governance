  - type: contract
    path: governance-operations-console/product-publication/manifest.json
    owner_repo: governance-operations-console
    note: Supplies the exact product-owner source snapshot and current unlisted local-preview lifecycle evidence required by WGCF.
  note: >-
    Immediate containment keeps lifecycle maintenance inactive. The operator
    approved reusing the existing Workspace Registry lifecycle and Product
    Publication paths: correct existing child 1270 so archive and restore require
    the proper inventory state, publication posture, and fresh schema-v2 owner
    evidence; replace isolated component acceptance with a complete operator
    sequence proof; then resume Security 1271, OOS activation 1272, and Platform
    commissioning 1273. No new ART child, backend, authority, or parallel workflow
    is needed.
follow_up:
  owner_repo: workspace-governance
  due_on: '2026-10-16'
  note: >-
    Land the operator-approved extension of the existing delivery-plan activation
    validation so a plan cannot pass when an owner-controlled source gate, required
    owner evidence, prerequisite owner transition, independent acceptance verifier,
    accepted target-scope binding, or complete operator-sequence conformance case is
