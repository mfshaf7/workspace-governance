signals:
- id: operator-repeated-mistake-callout
  title: Product Publication repeated a previously closed activation-planning miss
  trigger: closed-lesson-regression
  failure_classes:
  - learning-closure-regression
  - workflow-doctrine-gap
  - unsafe-assumption
  finding: The Epic 894 architecture packet ordered OOS implementation, Console
    implementation, Security review, and Platform commissioning but omitted the
    OOS-owned and WGCF-owned source activations required after Security approval.
    It also omitted the committed product-owner manifest that WGCF must verify from
    merged owner-repository truth. Security review then found that OOS compared only
    the shape of the submitted Security reference, not the URI, digest, and revision
    of an independently configured accepted decision, and allowed broader target
    postures under the internal decision example. OOS pull requests 312 and 313
    repaired the exact decision and internal-only scope; Console pull request 64
    added the missing owner manifest. Both source activation gates must remain
    separate and inactive until Security 1257 decides.
  source_refs:
  - openproject://work_packages/894
  - openproject://work_packages/1255
  - openproject://work_packages/1257
  - openproject://work_packages/1258
  - https://github.com/mfshaf7/operator-orchestration-service/pull/312
  - https://github.com/mfshaf7/operator-orchestration-service/pull/313
  - https://github.com/mfshaf7/governance-operations-console/pull/64
- id: product-maintenance-sequence-acceptance-gap
  title: Lifecycle maintenance reused stale publication evidence and skipped owner prerequisites
  trigger: repeated-operator-friction
  failure_classes:
  - workflow-doctrine-gap
  - rollout-evidence-gap
  - missing-deterministic-test-seam
  - unsafe-assumption
  finding: The merged Console lifecycle-maintenance implementation offered archive
    for an active product and restore for a retired product, then copied the prior
    publication command's manifest source. The Workspace Governance operator guide
    also ordered retirement before unpublish even though its own validator permits
    a listed posture only while the product is active. The valid archive sequence
    is fresh current-state owner evidence, unpublish if listed, inventory retirement,
    then a fresh schema-v2 retired/unlisted owner manifest and archive. Restore
    similarly requires inventory restore and fresh owner evidence. Component tests
    did not exercise that complete sequence. Security 1271 detected the contradiction
    before source activation, so the invalid maintenance actions remain inactive.
  source_refs:
  - openproject://work_packages/924
  - openproject://work_packages/1270
  - openproject://work_packages/1271
  - https://github.com/mfshaf7/governance-operations-console/pull/67
  - workspace-governance/docs/product-publication.md
  - workspace-governance/docs/workspace-active-inventory.md
- id: product-publication-runtime-preflight-regression
  title: Runtime execution retried from remembered fields instead of the exact contract
  trigger: repeated-operator-friction
  failure_classes:
  - learning-closure-regression
  - diagnostic-ordering-miss
  - rollout-evidence-gap
  - unsafe-assumption
  finding: >-
    During the repaired Feature 924 operating sequence, execution first attempted
    Product Publication activation before the documented dev-integration source
    session had reconciled the newly merged exact OOS revision. After activation
    succeeded, the archive request was then assembled from remembered field names
    and used target_publication.publication_posture even though the live Console
    contract requires target_publication.posture. The API rejected the request
    before mutation, but both failures repeated the same control gap: the exact
    rollout step and machine-readable request contract were not proven immediately
    before the live action. Runtime execution must preflight the current source
    session, exact dependency pins, current state, and exact accepted projection
    before each lifecycle mutation instead of relying on prior-session memory.
  source_refs:
  - openproject://work_packages/1273
  - governance-operations-console/src/domain-workspaces/portfolio/live-runtime/product-publication-live-contract.ts
  - platform-engineering/docs/dev-integration.md
  - platform-engineering/products/product-publication/README.md
- id: product-publication-verifier-and-closeout-recovery-gap
  title: Commissioning fixtures, rollout ordering, and ART recovery diverged from the live contract
  trigger: repeated-operator-friction
  failure_classes:
  - learning-closure-regression
  - rollout-evidence-gap
  - missing-deterministic-test-seam
  - workflow-doctrine-gap
  finding: >-
    Final commissioning exposed four late gaps that the earlier plan and tests
    should have caught together. Platform verifier fixtures modeled an obsolete
    lifecycle result and post-state envelope; the process-loss probe crossed a
    private OOS path instead of the public Console intent boundary; runtime
    reconciliation opened loopback tunnels before replacement workloads had
    completed rollout; and OOS recovery both preferred missing evidence over a
    recorded failure and referenced an obsolete recovery state name. After those
    repairs landed, the post-merge evidence profile still invoked Product
    Publication verification without propagating the Security-approved OOS and
    Security source pins, so the governed verifier rejected a newer maintenance
    checkout until the approved dependency revisions were aligned explicitly.
    Each symptom was individually bounded, but their combination turned normal
    closeout into repeated manual recovery even though the product behavior was
    already correct.
  source_refs:
  - openproject://work_packages/1273
  - https://github.com/mfshaf7/platform-engineering/pull/298
  - https://github.com/mfshaf7/platform-engineering/pull/299
  - https://github.com/mfshaf7/platform-engineering/pull/300
  - https://github.com/mfshaf7/platform-engineering/pull/301
  - https://github.com/mfshaf7/operator-orchestration-service/pull/322
  - https://github.com/mfshaf7/operator-orchestration-service/pull/323
  - https://github.com/mfshaf7/platform-engineering/pull/302
