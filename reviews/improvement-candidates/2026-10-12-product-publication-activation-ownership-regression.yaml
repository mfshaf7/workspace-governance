schema_version: 1
id: 2026-10-12-product-publication-activation-ownership-regression
title: Catch Product Publication activation ownership and acceptance binding before implementation
recorded_on: '2026-10-12'
owner_repo: workspace-governance
summary: Epic 894 repeated the closed activation-ownership planning failure by
  placing Platform commissioning directly after Security review even though OOS
  and WGCF each retained an inactive source gate and no product-owner manifest
  existed. The completed OOS implementation also accepted a syntactically valid
  Security reference without independently binding the exact accepted decision
  and did not constrain the decision to the intended internal-only posture. A
  later lifecycle-maintenance slice repeated the same planning class by wiring
  archive and restore directly to a prior publication result without proving the
  required Workspace Inventory transition or a fresh schema-v2 owner manifest.
regression_of: workspace-governance/reviews/improvement-candidates/2026-10-08-delivery-plan-activation-ownership-regression.yaml
