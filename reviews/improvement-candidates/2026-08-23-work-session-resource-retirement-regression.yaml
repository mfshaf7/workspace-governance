signals:
- id: operator-repeated-mistake-callout
  title: The operator explicitly said the miss is a repeated mistake and expects the
    system to learn from it.
  trigger: closed-lesson-regression
  failure_classes:
  - learning-closure-regression
  - workflow-doctrine-gap
  finding: Epic 958 proved resumable work sessions, but its final closeout left resource
    retirement outside the normal command path. The operator again had to request
    manual Git and temporary-file cleanup, and the workspace clean-state gate continued
    to report unrelated historical residue. The normal lifecycle needs a scoped ownership
    manifest, conservative cleanup plan, idempotent retry, and retained cleanup receipt
    that never deletes unowned resources or durable evidence.
  source_refs:
  - conversation:2026-08-23 operator asked why Git and temporary-file cleanup is not
    automated after Epic 958 closeout
  - openproject://work_packages/958
- id: architecture-contract-projection-regression
  title: The completed activation did not propagate architecture packet v2 custody.
  trigger: closed-lesson-regression
  failure_classes:
  - contract-drift
  - learning-closure-regression
  finding: Workspace Governance accepts architecture packet v2 with work-item-level
    Landing Unit ordering, while the active OOS and WGCF contract copies still accept
    only v1. The stale consumers cannot represent separate contract and activation
    Landing Units in one owner repo, so the correction needs a bounded v1 bootstrap
    packet followed by a v2 superseding packet before activation closes.
  source_refs:
  - openproject://work_packages/966
  - openproject://work_packages/967
  - openproject://work_packages/971
  - workspace-governance/contracts/schemas/delivery-art-architecture-packet.schema.json
  - operator-orchestration-service/contracts/delivery-art/delivery-art-architecture-packet.schema.json
  - workspace-governance-control-fabric/contracts/delivery-art/delivery-art-architecture-packet.schema.json
- id: architecture-topology-semantic-preflight-regression
  title: Packet approval did not prove the next real ART transition.
  trigger: closed-lesson-regression
  failure_classes:
  - contract-drift
  - learning-closure-regression
  - workflow-doctrine-gap
  finding: Starting work item 968 exposed that OOS treats ART dependency relations
    and source Landing Unit ordering as one undifferentiated precedence graph, while
    the live OpenProject projection exposes only ART follows relations. Initial packet
    persistence did not compare those semantics when the captured snapshot digest
    matched, and work item 967 closed without rehearsing the next real work-start
    transition. The packet therefore passed local structure and custody checks but
    failed only after the legitimate ART state change caused by closing 967. The
    durable control must distinguish work readiness from source landing order and
    execute the next governed transition against fresh authoritative topology before
    the preceding child can close.
  source_refs:
  - 'conversation:2026-08-23 operator asked why flaws continue appearing after narrow checks'
  - openproject://work_packages/967
  - openproject://work_packages/968
  - operator-orchestration-service:.art/review-packets/delivery-958-resource-retirement-architecture.json
  - operator-orchestration-service/src/delivery-art/service.js
