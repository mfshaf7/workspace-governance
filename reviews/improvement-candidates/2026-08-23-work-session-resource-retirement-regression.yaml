title: Close the Delivery ART work-session resource-retirement regression
recorded_on: '2026-08-23'
owner_repo: operator-orchestration-service
summary: Delivery ART work closeout retires reconstructable session state but does
  not own or safely retire the Git worktree, local branch, remote branch, and managed
  temporary resources created for that session. The earlier branch-lifecycle lesson
  closed on detection rather than lifecycle ownership, so completed Landing Units
  still require manual cleanup.
