follow_up:
  owner_repo: operator-orchestration-service
  due_on: '2026-08-30'
  note: Extend the existing Delivery ART work-session lifecycle with scoped resource
    ownership, safe terminal cleanup, idempotent recovery, cleanup receipts, and exact
    architecture-contract projection across its active custodians. Keep Docker cleanup
    outside the first implementation and require a separate adapter decision later.
    Before work item 968 resumes, agree and land one semantic topology model that keeps
    ART readiness relations separate from source Landing Unit order, plus an executable
    next-transition preflight that would have rejected the packet before work item 967
    closed.
