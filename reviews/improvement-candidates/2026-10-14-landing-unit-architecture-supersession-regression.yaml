    02840790fc36f5f8311d2d66cadec0d5e9ad98184aff3d88c6ff106a2d0afef4
    changed only the reopened Security authority Landing Unit identity for work
    item 1303, while preserving the Platform gate, accepted artifact, authority
    work item, owner, and exact-tree evidence requirement. The active-Landing-
    Unit compatibility fingerprint nevertheless treated the producer Landing
    Unit attempt identifier in handoff 1303-1291 as a semantic change to active
    Platform session 1291. OOS then reported architecture-recovery-required for
    an open pull request with a local Review Packet, a state that neither
    pristine reconstruction nor the bounded recovery modes can safely archive.
    Recovery-attempt identity must not invalidate a consumer whose authority,
    evidence contract, gate, and source boundary are unchanged.
