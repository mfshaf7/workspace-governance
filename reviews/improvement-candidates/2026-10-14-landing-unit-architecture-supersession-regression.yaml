  - rollout-evidence-gap
  finding: >-
    The first active-Landing-Unit fix correctly stopped classifying item 1285 as
    architecture-superseded, but returned no replacement binding to the active
    session. Its lifecycle plan therefore continued reading the immutable
    predecessor Architecture Packet and old work-start artifact, and the live
    validator still projected architecture-invalid. Compatible detection must
    lead to one bounded, crash-resumable normal-continuation refresh that
    serially binds the exact current packet and a new durable work-start,
    invalidates only stale Review Packet/readiness projections, preserves
    source work, and continues to require reconstruction or recovery when the
    local Landing Unit changes.
