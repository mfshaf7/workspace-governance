- id: superseded-architecture-revalidated-as-current-dependency
  title: A current validator rejected immutable superseded architecture history
  trigger: repeated-operator-friction
  failure_classes:
  - learning-closure-regression
  - workflow-doctrine-gap
  - rollout-evidence-gap
  finding: >-
    After the active-Landing-Unit comparison was commissioned, current
    architecture lookup still failed because OOS recursively applied today's
    architecture semantic validator to the corrected packet's immutable
    superseded predecessor. That predecessor was invalid under the newly landed
    cross-topology cycle rule, which is exactly why it was superseded. Current
    architecture and Review Packet reads must verify historical dependency
    structure, content digest, custody, reference bindings, and original
    evidence semantics without retroactively requiring old immutable packets to
    satisfy every later architecture rule. New work-start transitions must
    separately require the exact current Architecture Packet reference so the
    compatibility rule cannot admit superseded design for new work.
