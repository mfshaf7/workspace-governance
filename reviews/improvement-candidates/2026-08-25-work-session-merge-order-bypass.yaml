signals:
- id: merge-before-review-packet
  title: Source merge bypassed the active work-session readiness order.
  trigger: machine-visible-workflow-drift
  failure_classes:
  - workflow-doctrine-gap
  finding: The operator path allowed a direct GitHub merge command while the OOS
    session still required evidence authoring and merge-ready Review Packet custody.
    The work-session guard detected the ordering defect only after merge.
  source_refs:
  - openproject://work_packages/1000
  - https://github.com/mfshaf7/platform-engineering/pull/221
- id: merge-before-review-packet-recurred
  title: A later Landing Unit again merged before Review Packet readiness.
  trigger: repeated-operator-friction
  failure_classes:
  - workflow-doctrine-gap
  finding: Console PR 24 merged before the active work-session path authored a
    merge-ready schema-v2 Review Packet. The source correction was valid, but
    closeout again required post-merge compatibility recovery for ART work item
    1115, proving that documentation and status projection did not mechanically
    enforce the required order.
  source_refs:
  - openproject://work_packages/1115
  - https://github.com/mfshaf7/governance-operations-console/pull/24
resolution:
  after_action_ref: null
  control_refs:
