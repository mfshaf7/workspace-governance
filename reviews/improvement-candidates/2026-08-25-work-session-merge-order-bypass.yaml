id: 2026-08-25-work-session-merge-order-bypass
title: Prevent source merge before work-session Review Packet readiness
recorded_on: '2026-08-25'
owner_repo: operator-orchestration-service
summary: Platform PR 221 was merged after deterministic CI passed but before the
  active OOS work session authored and persisted its merge-ready Review Packet,
  forcing the documented post-merge recovery path for ART work item 1000.
regression_of: null
status: closed
source_type: manual
scope:
  related_repos:
  - operator-orchestration-service
  - platform-engineering
