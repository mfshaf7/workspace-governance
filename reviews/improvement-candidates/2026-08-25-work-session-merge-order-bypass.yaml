  - type: test
    path: operator-orchestration-service/test/delivery-art-work-session.test.js
    owner_repo: operator-orchestration-service
    note: Proves ordered merge approval, replay, projection, and finalization behavior.
  - type: test
    path: operator-orchestration-service/test/delivery-art-work-session-cli-adapters.test.js
    owner_repo: operator-orchestration-service
    note: Proves exact PR matching, merge readback, and uncertain-result handling.
  - type: contract
    path: operator-orchestration-service/docs/contracts/delivery-workflow-api-v1.md
    owner_repo: operator-orchestration-service
    note: Defines the explicit work merge API and keeps direct GitHub merge as recovery.
  - type: change-record
