signals:
- id: scoped-lineage-reference-false-negative
  title: Valid external initiative lineage references failed at closeout
  trigger: closed-lesson-regression
  failure_classes:
  - learning-closure-regression
  - missing-deterministic-test-seam
  - unsafe-assumption
  finding: >-
    Epic 1203 carries Architecture Anchor Ref openproject://work_packages/880
    and Required Upstream Ref openproject://work_packages/886. A direct broker
    read proved work package 880 is an existing top-level Epic, but the final
    closeout mutation raised initiative-anchor-ref-must-point-to-top-level-epic.
    updateDeliveryInitiative constructed buildDeliveryProjectState with
    initiativeRecordId 1203, which intentionally contains only that root and
    its descendants; validateDeliveryInitiativeLineageRefs then searched that
    scoped map for external portfolio references. Tests covered local lineage
    shapes but not a real cross-initiative anchor during a write.
  source_refs:
  - openproject://work_packages/1203
  - openproject://work_packages/880
  - openproject://work_packages/886
  - operator-orchestration-service/src/openproject-client.js
