id: 2026-10-12-initiative-lineage-reference-scope-regression
title: Validate initiative lineage references against portfolio scope
recorded_on: '2026-10-12'
owner_repo: operator-orchestration-service
summary: >-
  Guided Epic 1203 closeout rejected the valid external Architecture Anchor Ref
  to top-level Epic 880 because the OOS lineage validator searched only the
  target initiative and its descendants. Cross-initiative anchor and upstream
  references therefore became impossible to validate during governance writes.
