  trigger: closed-lesson-regression
  failure_classes:
  - learning-closure-regression
  - contract-drift
  finding: >-
    The live #1246 operating proof reached CGG and received a current, safe
    projection, but OOS returned agent_console_context_projection_invalid because
    CGG's whole-second projected_at value was fractionally earlier than the
    request's microsecond timestamp. CGG already admits this bounded one-second
    precision difference, so the consumer and provider disagreed on the same
    timeline contract.
