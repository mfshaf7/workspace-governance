schema_version: 1
id: 2026-08-01-temporal-protocol-completeness-review-loop
title: Require initiative-wide architecture preflight before protocol implementation
recorded_on: '2026-08-01'
owner_repo: workspace-governance
summary: >-
  Temporal generation retirement and controlled-proof commissioning entered repeated
  implementation-review-fix cycles because delivery began from individual child items
  before the complete #698 initiative architecture, dependency order, evidence
  boundaries, and terminal state were reconstructed. The narrower cross-repo protocol
  checklist also failed to require command semantics, authorization integrity, result
  completeness, immutable restore evidence, and executable schema cases before code
  review.
regression_of: null
status: closed
source_type: conversation
scope:
  related_repos:
  - operator-orchestration-service
  - platform-engineering
  - security-architecture
  - workspace-governance
  related_products: []
  related_components:
  - operator-orchestration-service
  change_classes:
  - architecture-shaping
signals:
- id: operator-repeated-mistake-callout
  title: The operator explicitly said the miss is a repeated mistake and expects the
    system to learn from it.
  trigger: repeated-operator-friction
  failure_classes:
  - contract-drift
  - missing-deterministic-test-seam
  - workflow-doctrine-gap
  finding: The operator explicitly identified a never-ending correction loop. Exact-head
    reviews successively discovered missing seal acknowledgement, handler-time authorization
    semantics, capacity error mapping, and machine-pinned status after implementation
    had already been treated as nearly complete.
  source_refs:
  - 'conversation: operator said the work kept looping instead of fixing the root
    problem'
  - 'github: platform-engineering#196 and operator-orchestration-service#117 exact-head
    review history'
- id: controlled-proof-contract-completeness-recurrence
  title: Exact-head review again discovered protocol architecture after the controlled-proof
    contract was treated as nearly complete.
  trigger: repeated-operator-friction
  failure_classes:
  - contract-drift
  - missing-deterministic-test-seam
  - workflow-doctrine-gap
  finding: >-
    Workspace Governance PR #134 required successive exact-head fixes for
    owner-surface linkage, semantic source uniqueness, single-use authorization,
    immutable restore binding, approval-to-claims binding, exact scenario coverage,
    non-passing restore exceptions, and executable positive and negative schema cases.
    A later exact-head pass also found non-exact source revision lengths, missing
    result-to-permit baseline equality, a UTC-only checker leaking into shared RFC
    3339 validation, and an unadmitted retired-definition lifecycle hole.
    The next exact-head pass then exposed missing complete-authorization digest
    equality and incomplete, non-unique proof-owner receipt coverage.
    A subsequent pass found that valid individual timestamps still lacked
    cross-artifact ordering against the permit window.
    The follow-up timeline review then found that run start itself was not yet
    bounded by expiry for stopped results.
    The next pass found that exact owner coverage still allowed historical
    receipts from another authorization or run.
    The existing improvement candidate covered only command-protocol completeness and
    therefore did not yet capture the broader authorization and evidence-contract
    recurrence.
  source_refs:
  - 'github: workspace-governance#134 exact-head review history'
  - 'art: Workspace Delivery ART #789 controlled Temporal commissioning proof contract'
- id: initiative-architecture-preflight-bypassed
  title: Child implementation started before the complete initiative was inspected and
    sequenced.
  trigger: repeated-operator-friction
  failure_classes:
  - missing-discussion-gate
  - unsafe-assumption
  - workflow-doctrine-gap
  finding: >-
    The operator identified that the long #789 run repeatedly added, removed, and
    reworked contract lines because execution was driven from the immediate child and
    each successive review finding rather than a complete read of #698 and every
    descendant. The initiative's owner boundaries, dependency order, proof phases,
    evidence handoffs, runtime prohibition, and completion state were therefore
    discovered incrementally after implementation had already begun.
  source_refs:
  - 'conversation: operator said the #789 run was wasteful because #698 was not fully
    studied and required circular line-by-line correction'
  - 'art: Workspace Delivery ART #698 and its complete descendant structure'
- id: platform-executor-preflight-recurrence
  title: Platform executor implementation repeated the review-driven architecture loop.
  trigger: repeated-operator-friction
  failure_classes:
  - unsafe-assumption
  - diagnostic-ordering-miss
  - missing-deterministic-test-seam
  - workflow-doctrine-gap
  finding: >-
    Platform work item #792 entered implementation before its acceptance model proved
    crash-safe exclusive artifact publication, execution from immutable byte-attested
    source instead of the mutable checkout, and real Bubblewrap user-namespace
    capability under the CI host's AppArmor posture. Exact-head review and CI exposed
    those requirements sequentially, causing repeated implementation, review, and
    correction cycles. The elapsed run was therefore driven primarily by late
    architecture and environment discovery rather than by the final source volume.
  source_refs:
  - 'conversation: operator said the #792 completion run was excessively long and
    asked whether insufficient planning caused it'
  - 'github: platform-engineering#198 review and exact-head CI history'
  - 'art: Workspace Delivery ART #792 controlled Temporal permit issuer and proof
    executor'
- id: security-approval-containing-commit-cycle
  title: The controlled-proof tests did not prove that a per-run Security approval can exist in real Git history.
  trigger: repeated-operator-friction
  failure_classes:
  - contract-drift
  - missing-deterministic-test-seam
  - unsafe-assumption
  - workflow-doctrine-gap
  finding: >-
    The #792 implementation binds the current security-architecture revision into the
    immutable pre-approval baseline and canonical claims, then requires the per-run
    Security approval for that claims digest to already exist at that same revision.
    In real Git, committing the approval changes the Security revision and therefore
    changes the claims digest, so no revision can satisfy both conditions. Unit tests
    hid the cycle by inserting approval bytes into a fake resolver at an already fixed
    revision instead of proving the claims-to-approval sequence in a real repository.
  source_refs:
  - 'art: Workspace Delivery ART #799 immutable baseline and canonical claims preflight'
  - 'source: platform-engineering controlled_proof/authority.py and test_controlled_proof.py at merge commit 7968a92c8c70a0662158957238adc78f6e307d32'
  - 'source: platform-engineering Temporal operations require claims before the merged per-run Security approval'
- id: commissioning-runtime-semantics-and-cleanup-gap
  title: Source validation did not prove mounted execution or recoverable terminal cleanup.
  trigger: late-root-cause-discovery
  failure_classes:
  - diagnostic-ordering-miss
  - missing-deterministic-test-seam
  - unsafe-assumption
  - workflow-doctrine-gap
  finding: >-
    The first permit-bound Temporal commissioning session passed source and contract
    validation but failed before scenario execution because the PostgreSQL init
    ConfigMap used root-owned mode 0550, which the PostgreSQL container could not
    execute. The validator checked only the script content and unit tests replaced
    the real runtime adapter, so mounted execution semantics were never proved before
    permit consumption. The same run exposed two lifecycle defects: snapshot recovery
    deleted preauthorization artifacts stored below the canonical run directory, and
    the documented status command created local operator state despite being treated
    as read-only. Automated exact-baseline cleanup then failed and emitted a stopped
    draft without a supported operator command for retrying the exact authorized
    cleanup, leaving the scoped namespace and local state present.
  source_refs:
  - 'art: Workspace Delivery ART #751 first permit-bound Temporal commissioning session'
  - 'art: Workspace Delivery ART #829 and #830 commissioning preflight and runtime-semantic defects'
  - 'artifact: platform-controlled-proof://stopped-drafts/delivery-698-799-temporal-commissioning-20260813-v2'
  - 'source: platform-engineering dev-integration/profiles/temporal/runtime/postgresql.yaml.tpl at 9085c7a76616979713a9120635233030a55f7dc2'
  - 'conversation: operator asked whether the late permission discovery represented a broader miss'
- id: review-packet-premerge-sequencing-bypass
  title: Source merged before the governed Review Packet reached merge-ready state.
  trigger: repeated-operator-friction
  failure_classes:
  - diagnostic-ordering-miss
  - unsafe-assumption
  - workflow-doctrine-gap
  finding: >-
    Platform PR #205 passed its source checks and was merged before a schema-v2
    Review Packet for ART #829 and #830 was authored and made merge-ready. The source
    evidence is durable and truthful, but the normal lifecycle controller can no
    longer create its required pre-merge source binding. This requires bounded
    schema-v1 compatibility recovery and proves that documented sequencing alone did
    not prevent a manual GitHub merge from bypassing the ART completion gate.
  source_refs:
  - 'github: platform-engineering#205 merged source correction'
  - 'art: Workspace Delivery ART #829 and #830 Landing Unit completion evidence'
  - 'source: operator-orchestration-service Review Packet lifecycle requires merge-ready custody before source merge'
  - 'conversation: correction work discovered the missing pre-merge packet after PR #205 merged'
resolution:
  after_action_ref: null
  control_refs:
  - type: contract
    path: workspace-governance/contracts/delivery-art-operator-path.yaml
    owner_repo: workspace-governance
    note: Requires a complete initiative architecture packet, operator decision,
      locked execution sequence, and executable cross-repo protocol conformance
      plan before child implementation begins.
  - type: validator
    path: workspace-governance/scripts/validate_cross_repo_truth.py
    owner_repo: workspace-governance
    note: Validates the workspace contract, artifact schema refs, readiness
      vocabulary, and explicit pending-runtime activation boundary. It does not
      claim that OOS work-start enforcement is already active.
  - type: validator
    path: workspace-governance/scripts/validate_contracts.py
    owner_repo: workspace-governance
    note: Validates architecture, work-start, and Review Packet schemas plus
      negative cases for stale decisions, inexact Git refs, failed merge evidence,
      prose result strings, missing acceptance mapping, and non-durable finalization.
  - type: doc
    path: workspace-governance/docs/delivery-art-operator-path.md
    owner_repo: workspace-governance
    note: Defines the operator-facing initiative-wide architecture preflight.
  - type: skill
    path: workspace-governance/skills-src/project-delivery-operator/SKILL.md
    owner_repo: workspace-governance
    note: Forces future ART implementation sessions through the same preflight.
  - type: contract
    path: workspace-governance/contracts/developer-integration-policy.yaml
    owner_repo: workspace-governance
    note: Defines controlled proof as one commissioning session with exact
      scenario executions and owner-bound receipts.
  - type: validator
    path: workspace-governance/scripts/validate_developer_integration.py
    owner_repo: workspace-governance
    note: Proves positive and negative authorization, session, execution,
      receipt, timeline, and restore bindings.
  - type: workflow
    path: operator-orchestration-service/src/delivery-art/work-session-controller.js
    owner_repo: operator-orchestration-service
    note: >-
      The normal work-session path now requires durable architecture readiness,
      exact source scope, human gates, merge-ready evidence, and transition
      rehearsal before source progression.
  - type: doc
    path: workspace-governance/docs/durable-orchestration-governance.md
    owner_repo: workspace-governance
    note: >-
      Records the completed controlled-commissioning boundary and the current
      active Temporal dev-integration posture without treating that historical
      proof as the normal launch path.
  note: >-
    Closed after the original prose-only preflight was replaced by executable
    schema-v3 architecture, work-start, evidence-profile, Review Packet,
    transition-rehearsal, and cleanup controls. Real-Git fidelity is required
    for Git-causality claims, the historical controlled Temporal commissioning
    proof completed its activation role, and normal source progression now
    fail-closes before implementation or merge when the durable chain is not
    ready. The broad review-loop record no longer owns an unresolved control.
