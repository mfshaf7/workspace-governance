follow_up:
  owner_repo: workspace-governance
  due_on: '2026-08-08'
  note: Propose one protocol-completeness contract and conformance preflight that
    proves command acknowledgement, deterministic IDs, state-mutation ordering,
    retry/recovery semantics, bounded failure mapping, authorization replay resistance,
    semantic source uniqueness and exact revision widths, approval-to-claims binding,
    immutable restore state, cross-artifact result equality, exact result coverage,
    complete authorization artifact binding, exact owner-keyed receipt coverage,
    shared-validator compatibility, complete lifecycle-state matrices, and executable
    positive and negative schema cases before implementation is declared review-ready;
    obtain operator approval before landing the control.
