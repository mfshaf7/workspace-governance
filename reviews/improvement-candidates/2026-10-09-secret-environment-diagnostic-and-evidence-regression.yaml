schema_version: 1
id: 2026-10-09-secret-environment-diagnostic-and-evidence-regression
title: Isolate secret-bearing process environments from diagnostics and owner evidence
recorded_on: '2026-10-09'
owner_repo: workspace-governance
summary: >-
  While diagnosing Delivery item 1244, an attempted reproduction passed a live
  source-executor environment as command arguments and the command parser echoed
  composition credentials. The same inspection then proved that owner evidence
  commands inherit the source executor's active composition environment, changing
  isolated CGG test semantics and blocking review evidence.
regression_of: workspace-governance/reviews/improvement-candidates/2026-05-06-context-admission-env-dump-diagnostic-gap.yaml
status: closed
source_type: manual
scope:
  related_repos:
  - context-governance-gateway
  - operator-orchestration-service
  - workspace-governance
  related_products: []
  related_components: []
  change_classes:
  - source-behavior
signals:
- id: process-environment-argument-leak
  title: A process environment was passed as command arguments and echoed credentials
  trigger: closed-lesson-regression
  failure_classes:
  - learning-closure-regression
  - unsafe-assumption
  finding: >-
    A diagnostic intended to reproduce the source executor environment used xargs
    with env in the wrong argument order. Environment entries became application
    arguments, and argparse echoed them in its bounded error output. The existing
    context-admission guidance prohibited broad environment dumps but did not state
    the argv-specific failure mode or the safe environment-inheritance pattern.
  source_refs:
  - live:2026-10-09 Delivery item 1244 evidence diagnosis
  - workspace-governance/reviews/improvement-candidates/2026-05-06-context-admission-env-dump-diagnostic-gap.yaml
- id: owner-evidence-inherited-composition-environment
  title: Owner evidence inherited unrelated active-composition variables
  trigger: late-root-cause-discovery
  failure_classes:
  - learning-closure-regression
  - workflow-doctrine-gap
  finding: >-
    The host source executor passed its full refinement-catalog process environment
    to repository evidence commands. CGG tests that deliberately construct isolated
    profile environments therefore observed the executor's DEVINT_PROFILE_JSON and
    DEVINT_NAMESPACE, failed three isolation assertions, and produced a blocked
    acquisition even though the same exact revision passed in a clean shell. Owner
    evidence needs an explicit minimal execution environment; the existing
    purpose-bound evidence marker is not an isolation boundary.
  source_refs:
  - openproject://work_packages/1244
  - operator-orchestration-service/src/delivery-art/source-executor.js
  - operator-orchestration-service/src/delivery-art/review-evidence-acquisition.js
  - context-governance-gateway/tests/test_dev_integration_profile.py
  - workspace-governance/reviews/improvement-candidates/2026-10-04-work-session-merge-order-recurrence.yaml
resolution:
  after_action_ref: null
  control_refs:
  - type: workflow
    path: operator-orchestration-service/src/delivery-art/lifecycle-cli-adapters.js
    owner_repo: operator-orchestration-service
    note: >-
      Merged PR 296 isolates non-runtime owner-evidence commands from the active
      composition environment while retaining the explicit verification-only
      environment for runtime-and-live evidence.
  - type: test
    path: operator-orchestration-service/test/delivery-art-lifecycle-cli-adapters.test.js
    owner_repo: operator-orchestration-service
    note: Proves non-runtime evidence receives the minimal allowlisted environment.
  - type: contract
    path: workspace-governance/contracts/context-behavior.yaml
    owner_repo: workspace-governance
    note: Forbids expanding process environment values into command arguments or parser errors.
  - type: skill
    path: workspace-governance/skills-src/context-admission-operator/SKILL.md
    owner_repo: workspace-governance
    note: Requires names-first inspection and safe child-environment reproduction.
  - type: doc
    path: workspace-governance/docs/context-admission-governance.md
    owner_repo: workspace-governance
    note: Defines process environments as credential-bearing context and requires rotation after exposure.
  note: >-
    Containment rotated the source-executor credential and every composition-lifetime
    credential, then reconciled the registered refinement-catalog composition. OOS PR
    296 merged the executor isolation repair at
    91c807cb0b2451fdde4b1c103d327532a22dbaf3. Workspace Governance PR 249 merged
    the diagnostic controls at 020db070fe9c9050740517242ba92629cdc25d7d, and the
    managed skill install check passed. The corrected executor then acquired owner
    evidence for Delivery item 1244, CGG PR 23 merged at
    7f9ca084cc1e41f360d3d27eb780ddebf11d2772, Review Packet
    sha256:40cad61097ca8006f434df05c198cc9827bc5ab6b5d333e15ca8e653c9ba4e9b
    finalized, and work close completed with all session-created source resources
    retired.
