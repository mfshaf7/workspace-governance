  title: Review evidence was authored without exact architecture and PR projections
  trigger: repeated-operator-friction
  failure_classes:
  - workflow-doctrine-gap
  - learning-closure-regression
  finding: >-
    ART #979 required two avoidable correction loops because the editable
    evidence template accepted directory-level changed-surface paths and manually
    assigned conformance cases without projecting the architecture-required fidelity
    and source-provenance cases. The canonical gates correctly rejected both drafts,
