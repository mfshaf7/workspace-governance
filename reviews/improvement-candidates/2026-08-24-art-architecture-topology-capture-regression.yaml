- id: feature-outcome-composition-omitted
  title: Component-complete evidence did not prove the composed Feature outcome
  trigger: late-root-cause-discovery
  failure_classes:
  - workflow-doctrine-gap
  - rollout-evidence-gap
  finding: >-
    Work Design Feature #908 reached terminal child state and projected as a
    stale-open closeout candidate after CGG, gateway, OOS, security, activation,
    persistence, and Console children each passed independently. The approved
    architecture packet named composed Feature-level conformance cases but did
    not bind them to an executable child or source Landing Unit. Live #996 proof
    could therefore return bounded 503 advice while apply and receipt behavior
    passed, every child could close, and the parent could still project as stale
    open. Feature completion lacked an owner-bounded path that had to prove its
    stated end-to-end outcome.
  source_refs:
  - openproject://work_packages/908
  - openproject://work_packages/996
  - openproject://work_packages/998
  - wgcf://artifacts/delivery-art/sha256/99d559038d50d6bf7eaa2549c77e7296de52fe8920e0e56bb9a1553134d6db25
  - 'conversation:2026-08-25 pre-closeout inspection found the active accepted-idea-delivery
    profile did not compose CGG and governed-AI runtime dependencies'
