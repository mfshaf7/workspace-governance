    Memory pressure averages/totals remainedzero and swapunused. Windows configuration preserves unrelated settings
    and has an exact original backup. Capacity activation is complete; fresh whole-stack native verification remains
    incomplete.


    Post-boot recovery was interrupted by observed memory-access faults in two Node processes, Python and Go/k3s.
    k3s logged fatal fault/SIGSEGV at14:13:12Z. Its interrupted composition rollback removed/stopped its owning
    startup unit. A single deliberate normal recovery after Docker/k3s readiness reached accepted-idea-delivery
    up but returned139 at14:22:19Z, then rollback again stopped the controller. No further activation retry was
