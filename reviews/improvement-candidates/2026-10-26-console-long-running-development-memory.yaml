    prior deployed revision with data retained. Future containment waits for the owner operation to finish before
    preventing a subsequent retry.


    After the next operator restart, initial fault count waszero, then one repeated pg_isready crash every5seconds
    produced39messages. Grouping proved those39were the same utility, not39independent component failures. The source
    blobs and the two containers'' binary hashes matched each other, but that was insufficient to establish runtime
