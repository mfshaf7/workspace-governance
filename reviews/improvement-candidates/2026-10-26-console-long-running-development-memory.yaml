    recovery registration; Security PR360 accepts that exact correction. Platform PR344 e43abde20b01dfea997c55d3149f1ecb02e0665e
    / Security PR361 a8bf1b81319ab123ac480a395e341bcd11486482 align all six existing Ollama bindings from0.40.8
    to actual0.40.11, preserving the complete model digest and all other authority. Native all-six metadata readiness
