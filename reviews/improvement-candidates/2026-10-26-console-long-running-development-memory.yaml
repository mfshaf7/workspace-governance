    reclaim on two-minute CPU use at or below0.5%; a current120-second sample averaged7.53%, with no eligible interval.
    The earlier inactive-profile shutdown lesson remains valid; this is a distinct needed-service runtime-mode issue.
    Operator approved standalone normal serving, isolated hot-reload development, measured budgets and host reclamation
    verification before returning to capability gaps.
