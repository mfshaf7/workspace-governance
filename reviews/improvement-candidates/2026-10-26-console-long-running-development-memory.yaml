    The current RAM setup is untested per operator; no faulty module or hardware root cause is established.



    Targeted cache recovery then verified all12stored config/layer blob SHA256 values are valid. The independent
    fresh image and cached image have identical linux/amd64 rootfs layer chain. Thus the demonstrated wrong bit
