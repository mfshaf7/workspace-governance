    exhaustion. Python package checksums pass; no WHEA hardware event returned since boot. Windows reports mixed16GB/8GB
    RAM kits, a diagnostic lead only. Physical memory/CPU configuration and WSL/environment causes remain unverified.


    Keep this same candidate accepted and same PR/Landing Unit open until the environment is stable enough for fresh
    native verification. Do not treat source tests or the activated limit as complete operating acceptance. Preserve
    source and evidence; do not create speculative repair stories or change production controls to bypass failed
    live proof. Evidence: local-evidence://governance-operations-console/.art/console-runtime-memory-20261026/standalone-memory-summary.json,
    native-destinations-report.json, post-boot-memory.json and post-boot-faults.json.


