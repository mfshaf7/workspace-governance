    image docker.io/library/postgres@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50 runs
    pg_isready --version successfully. Both cached Kubernetes copies return139 even for --version. Trusted and cached
