schema_version: 1
id: 2026-10-14-cgg-rollout-exec-pod-selection-race
title: Select a current ready CGG pod for post-rollout startup actions
recorded_on: '2026-10-14'
owner_repo: context-governance-gateway
summary: >-
  The active CGG dev-integration profile waited for the current API and worker
  deployments, then used kubectl exec against the Deployment resource while
  terminating historical pods were still present. Kubernetes selected a pod
  that disappeared during connection setup, so two composition starts failed
  and rolled back even though the new rollout was ready.
