signals:
- id: cgg-post-rollout-exec-selected-terminating-pod
  title: Post-rollout initialization raced a disappearing historical pod
  trigger: machine-visible-workflow-drift
  failure_classes:
  - unsafe-assumption
  - workflow-doctrine-gap
  finding: >-
    Two consecutive refinement-catalog starts reached successful CGG Deployment
    rollout and then failed with "unable to upgrade connection: pod does not
    exist" during seed_projection_if_needed. The profile invokes kubectl exec
    on deployment/context-governance-gateway-api instead of resolving a current,
    ready, non-terminating API pod. The namespace contained ready historical pods
    with deletion timestamps, proving the selector could race an obsolete pod.
  source_refs:
  - context-governance-gateway/dev-integration/profiles/context-governance-gateway/scripts/common.sh
  - platform-engineering/docs/runbooks/dev-integration-profiles.md
  - runtime://devint-context-governance-gateway-mfshaf7
resolution:
  after_action_ref: null
  control_refs:
