    path: context-governance-gateway/dev-integration/profiles/context-governance-gateway/scripts/common.sh
    owner_repo: context-governance-gateway
    note: Resolves the newest current ready non-terminating API pod before exec.
  - type: script
    path: context-governance-gateway/dev-integration/profiles/context-governance-gateway/scripts/smoke.sh
    owner_repo: context-governance-gateway
    note: Reuses the same safe pod-resolution path for read-only smoke.
  - type: test
    path: context-governance-gateway/tests/test_dev_integration_profile.py
    owner_repo: context-governance-gateway
    note: Proves terminating and unready pods cannot be selected.
