schema_version: 1
id: 2026-10-15-operating-evidence-profile-self-validation-gap
title: Validate candidate evidence profiles and preserve configuration failures
recorded_on: '2026-10-15'
owner_repo: workspace-governance
summary: >-
  Delivery 1275 Platform source changed its own Delivery ART evidence profile,
  but pre-merge evidence executed the previously admitted base profile and no
  owner check validated the candidate profile against the OOS schema. After
  merge, OOS rejected an out-of-range timeout before it could persist failed
  operating evidence, leaving the governed recovery path unavailable. After
  failure projection and recovery were repaired, the invalid accepted base
  profile also blocked a fresh governed session from starting, with no bounded
  route for the profile to repair itself. The replacement attempt then exposed
  that source tests asserted credential projection but did not prove the
  projected OOS state path was writable or that rollback removed the failing
  binding before waiting for OOS readiness. A later governed successor exposed
  another missing precondition: post-merge operating evidence runs from the PR
  worktree, while the Platform composition runner defaulted its own source to
  the workspace main checkout and rejected the two paths as conflicting. After
  that repair, the live proof exposed a self-hosting conflict: its full
  teardown stopped the source executor supervising the proof, so the restored
  executor could not safely reconcile the still-pending acquisition.
  Evidence-preserving recovery then rejected that outcome-unknown state because
  it admitted explicit evidence failure but not interruption before the first
  result was recorded.
regression_of: null
status: accepted
source_type: machine-audit
scope:
  related_repos:
  - operator-orchestration-service
  - platform-engineering
  - workspace-governance
  related_products:
