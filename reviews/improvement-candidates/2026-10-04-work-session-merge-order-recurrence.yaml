- id: repository-readiness-authority-contract-drift
  title: Repository readiness was never tested against the canonical v2 authority
  trigger: late-root-cause-discovery
  failure_classes:
  - diagnostic-ordering-miss
  - workflow-doctrine-gap
  finding: >-
    WGCF repository-readiness tests generated a simplified schema-v1 repos.yaml
    fixture, while the canonical Workspace Governance authority has used schema
    v2 since 2026-09-06. The live first-use Catalog mutation therefore failed
    closed with authority-contract-invalid only after the full composition was
    commissioned. A preceding OOS fix also had to replace semantic YAML hashing
    with the exact content digest required by WGCF.
  source_refs:
