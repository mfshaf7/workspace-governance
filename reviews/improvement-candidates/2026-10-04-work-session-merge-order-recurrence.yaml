  - unsafe-assumption
  - workflow-doctrine-gap
  finding: >-
    Agent source provider preflight proved the exact repository token, but Git
    push consulted the operator's global credential cache before the configured
    askpass. The cached human credential returned 403 and the bounded command
    hid the provider detail, proving the transport did not enforce its declared
    no-human-fallback boundary.
