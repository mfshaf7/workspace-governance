- id: openproject-catalog-state-serialization-not-proven
  title: Catalog commissioning missed the real OpenProject Setting serializer
  trigger: late-root-cause-discovery
  failure_classes:
  - diagnostic-ordering-miss
  - workflow-doctrine-gap
  finding: >-
    Catalog state shared Ruby object references between the stored registry
    value and receipt result. Rails serialized those references as YAML anchors,
    but OpenProject 17.2 on Ruby 3.4 reloads Setting values with aliases denied,
    raising Psych::AliasesNotEnabled. Unit fixtures did not exercise the real
    Setting serialization and reload boundary. The repair detaches state through
    JSON before both persistence boundaries and the already-written row was
    normalized in place without discarding Catalog data.
  source_refs:
  - platform-engineering/products/openproject/catalog-control/openproject_delivery_catalog_control.rb
  - platform-engineering/products/openproject/catalog-control/test_validate_catalog_control.py
  - runtime://openproject/delivery-catalog-control-v1
- id: repository-catalog-commissioning-not-repeatable
  title: Catalog commissioning encoded first-run assumptions as acceptance truth
  trigger: repeated-operator-friction
  failure_classes:
  - unsafe-assumption
  - workflow-doctrine-gap
  finding: >-
    The full commissioning command initially compared the volatile
    last_projected_at timestamp as persisted state, read Catalog status before
    the restarted Console was ready, reused a stored readiness binding without
    refresh, and reused one idempotency key across later deliberate operator
    acceptances. These assumptions were invisible in the source-only tests and
    surfaced sequentially only when the complete command was rerun against the
    preserved backend. The final proof now excludes only projection time,
    waits for application readiness, refreshes existing bindings, and scopes
    mutation idempotency to one stable operator acceptance.
  source_refs:
  - platform-engineering/products/governance-operations-console/scripts/console_cross_domain_activation.py
  - governance-operations-console/src/domain-workspaces/delivery/server/refinement-catalog-oos-client.ts
  - openproject://work_packages/1231
  - runtime://governance-console/repository-catalog-commissioning
- id: configured-path-evidence-requirements-dropped-in-transport
  title: Source-executor transport bypassed the accepted-base evidence preflight
  trigger: closed-lesson-regression
  failure_classes:
  - learning-closure-regression
  - workflow-doctrine-gap
  finding: >-
    OOS configured-path evaluation correctly derived both merge-ready and
    operating-ready conformance cases and passed them to
    inspectConfiguredPath. The source-executor client and action dispatcher
    forwarded only the session object, discarding conformanceCases and
    requiredEvidenceKinds. The exact accepted Platform base therefore skipped
    the evidence-profile coverage check, even though its profile had no
    runtime_and_live command. The same Landing Unit later merged and only then
    failed operating-evidence acquisition. This regresses the earlier
    evidence-profile-preflight lesson and must be repaired at the transport
    contract, with an end-to-end negative test proving no source resource is
    created when the accepted base lacks an operating-ready fidelity or kind.
  source_refs:
  - operator-orchestration-service/src/delivery-art/source-executor.js
  - operator-orchestration-service/src/delivery-art/work-session-controller.js
  - operator-orchestration-service/src/delivery-art/work-session-cli-adapters.js
  - operator-orchestration-service/docs/records/change-records/2026-10-02-evidence-profile-preflight.md
  - openproject://work_packages/1231
- id: evidence-command-restarted-requesting-controller
  title: In-process evidence execution restarted the controller awaiting its receipt
  trigger: repeated-operator-friction
  failure_classes:
  - workflow-doctrine-gap
  - unsafe-assumption
  finding: >-
    The Platform runtime_and_live evidence command invoked the full
    commissioning sequence, including replacement of the OOS deployment whose
    request was waiting for the source executor. The host source executor
    completed independently, but the requesting controller exited before it
    could durably record the result. The command therefore returned exit 137
    without host memory pressure, and a retry could repeat the expensive work
    because the executor retained no replayable result custody.
  source_refs:
  - operator-orchestration-service/src/delivery-art/lifecycle-cli-adapters.js
  - operator-orchestration-service/src/delivery-art/source-executor.js
  - platform-engineering/contracts/delivery-art-work-session/evidence-profile.json
  - runtime://delivery-art/work-item-1231/controller-replacement
- id: generic-ci-marker-changed-evidence-test-semantics
  title: Generic CI state was mistaken for a live evidence-execution boundary
  trigger: late-root-cause-discovery
  failure_classes:
  - diagnostic-ordering-miss
  - workflow-doctrine-gap
  finding: >-
    The immediate containment routed commissioning to a non-disruptive verifier
    when CI, NO_COLOR, and two OOS mutation variables were present. OOS applies
    those variables to every profile command, so the unit-test process also
    entered the live verifier branch and one otherwise passing test failed.
    Evidence execution needs an explicit purpose-bound environment marker;
    generic CI state is not an execution contract.
  source_refs:
  - operator-orchestration-service/src/delivery-art/lifecycle-cli-adapters.js
  - platform-engineering/products/governance-operations-console/scripts/console_cross_domain_activation.py
  - openproject://work_packages/1231
- id: capability-activation-ref-bound-unmerged-source
  title: Workspace capability activation pointed at a source commit absent from OOS main
  trigger: machine-visible-workflow-drift
  failure_classes:
  - workflow-doctrine-gap
  finding: >-
    OOS PR 278 squash-merged the repaired capability manifest, but the Workspace
    activation contract retained the Agent branch commit. The manifest bytes and
    digest were correct while the declared activation commit was not an ancestor
    of OOS main, so cross-repo truth correctly rejected closure.
  source_refs:
  - operator-orchestration-service://commit/92f0967242f535b46aad9e585c72694c6ff1863b
  - workspace-governance/contracts/delivery-art-operator-path.yaml
