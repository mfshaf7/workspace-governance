  - workflow-doctrine-gap
  finding: >-
    After work continue published PR 49 but returned a later ART mutation
    failure, work status explicitly required the merge-ready transition. The
    source implementation skill still presented direct gh pr merge in a shared
    review section without limiting it to owner-repo maintenance, and the
    operator agent used that command instead of OOS work continue and work
    merge. Valid source therefore merged before durable Review Packet custody.
