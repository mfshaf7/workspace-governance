schema_version: 1
id: 2026-10-04-work-session-merge-order-recurrence
title: Epic 1203 work-session and live-acceptance regressions
recorded_on: '2026-10-04'
owner_repo: operator-orchestration-service
summary: >-
  Epic 1203 repeatedly reached a later delivery phase before the preceding
  control was proven against the live cross-repo path. Governance Operations
  Console PR 49 bypassed its active OOS merge-ready transition; composition
  activation erased required bindings; synthetic evidence omitted the
  operating-ready live-backend cases; OOS and WGCF disagreed on the repository
  authority digest; and WGCF accepted only the obsolete v1 authority fixture
  while the canonical repos.yaml has used schema v2 since 2026-09-06. The
  resumed commissioning path also lacked OpenProject serialization
  compatibility and repeat-run lifecycle/idempotency coverage. Finally, the
  configured-path preflight silently lost its evidence requirements at the
  source-executor transport boundary, so a Platform Landing Unit started and
  merged even though its accepted base lacked the required live-backend
  evidence command. The eventual live evidence command then restarted the OOS
  controller that was awaiting it, and the generic CI marker used to avoid
  that restart leaked into the unit-test process and changed test semantics.
regression_of: workspace-governance/reviews/improvement-candidates/2026-08-25-work-session-merge-order-bypass.yaml
