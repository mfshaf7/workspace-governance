summary: >-
  The active OOS profile correctly moved all allowed callers to distinct
  identity-bound secrets, but Platform's Delivery ART quality checker still
  selected the first allowed id and paired it with the compatibility shared
  secret. Projection quality therefore failed with caller_auth_invalid after
  the earlier caller-binding lesson had been treated as closed.
