  finding: >-
    Epic 1203 projection sync succeeded, but its required quality check returned
    caller_auth_invalid. Live preflight proved every id in CALLER_ALLOWED_IDS
    had an exact CALLER_AUTH_SECRETS_JSON entry, while the Platform checker
    selected the first id and always sent CALLER_AUTH_SHARED_SECRET. OOS
    correctly rejected the mismatched pair. Platform PR 262 now selects an
    exact bound pair, uses the shared secret only for an allowed unbound caller,
    and fails closed when neither pairing exists. Merged-main live proof
    returned a clean checkpoint and zero quality findings for Epic 1203.
