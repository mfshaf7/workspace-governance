    adapter diagnostic reproduced provider output exceeds the task byte limit,
    while the same synthetic chat returned valid JSON. Separate bounded metadata
    reads from bounded model output; retain inventory size, identity, output and
    no-fallback integrity checks. Existing small-inventory tests missed the
    cross-boundary case. Repair as bounded maintenance under existing1321 without
    another ART child or architecture version.
