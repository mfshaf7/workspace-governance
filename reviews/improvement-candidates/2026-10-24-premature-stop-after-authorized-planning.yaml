- id: runtime-image-import-permission-precondition
  title: Commissioning assumed access to the root-only container runtime
  trigger: late-root-cause-discovery
  failure_classes:
  - diagnostic-ordering-miss
  finding: Platform PR336 built and verified its fixed image without proving that
    the admitted user-systemd operator could import it into k3s. The actual accepted
    activation failed at k3s ctr images import because the containerd socket is
    root-only and passwordless sudo is unavailable. The failed supervisor retries
    were stopped. Source validation and image construction did not establish this
    runtime prerequisite. Preserve the accepted source and owner state; resolve
    image delivery through the existing platform boundary before claiming activation.
    Do not grant broad host permissions or create another ART child to hide it.
  source_refs:
  - openproject://work_packages/1320
  - https://github.com/mfshaf7/platform-engineering/pull/336
