    reviewed revisions and strict tree/clean-source acceptance; bind runtime
    catalog and marker to the actual accepted execution revision. Add a real
    Git squash regression and retain changed-tree/dirty-source denial. No
    metadata forgery, post-review Platform pin edit, new mechanism or ART child.
  source_refs:
  - openproject://work_packages/1320
  - https://github.com/mfshaf7/platform-engineering/pull/336
  - https://github.com/mfshaf7/platform-engineering/pull/337
- id: provider-metadata-versus-task-output-budget
  title: Model verification applied task output limits to provider inventory
  trigger: repeated-operator-friction
  failure_classes:
  - unsafe-assumption
  finding: Actual Console model registration rejected qwen3:8b twice before inference
