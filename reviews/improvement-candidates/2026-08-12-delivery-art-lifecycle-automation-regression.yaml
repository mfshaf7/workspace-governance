- id: controlled-commissioning-conformance-discovered-serially
  title: Controlled commissioning exposed missing protocol obligations one boundary
    at a time
  trigger: closed-lesson-regression
  failure_classes:
  - learning-closure-regression
  - workflow-doctrine-gap
  finding: The first governed Temporal commissioning path was used as the effective
    end-to-end integration test. After ART hardening Feature 800 had already added
    22 children, including 16 Defects, commissioning correction work 823 through
    842 added 15 more Defects and five fresh Security authorization items. Source
    provenance, authorization chronology, baseline serialization, preflight state
    preservation, exact cleanup scope, worker readiness, diagnostic retention, and
    lifecycle projection were proven only when the next live gate rejected them.
    Because permits and approval evidence are immutable and source-bound, every
    material correction correctly invalidated the previous authorization but forced
    another Security child. The safety controls worked; the missing control is one
    executable pre-authorization conformance rehearsal covering the complete
    claims-to-cleanup chain across all owner repos.
