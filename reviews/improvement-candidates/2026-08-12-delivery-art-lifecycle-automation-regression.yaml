- id: operator-work-session-manual-reconstruction-regression
  title: Normal ART work still requires manual lifecycle reconstruction across sessions
  trigger: closed-lesson-regression
  failure_classes:
  - learning-closure-regression
  - workflow-doctrine-gap
  finding: The active lifecycle-plan path still makes the operator or agent hand-author
    a plan, rediscover low-level commands, and reconstruct artifact locations after
    restart, context compaction, or disposable-worktree cleanup. Runtime transition
    checks also compare immutable historical architecture evidence with a fresh raw
    ART digest, so ordinary status, progress, work-note, or evidence-reference updates
    can falsely expire an approved architecture decision. Architecture packet v1 adds
    a separate sequencing defect because repo-level merge_order cannot represent one
    owner repo landing a contract before OOS and returning later for activation. The
    approved correction is one persistent, reconstructable work-session command family,
    material-versus-ordinary freshness semantics, and architecture packet v2
    work-item-level Landing Unit ordering. The target must remain inactive until OOS
    implementation, Security review, and Workspace Governance activation land.
    Immediate structured-record preflight also derived record identity from the
    physical worktree folder, which made valid canonical regression links fail from
    the required branch worktree. Skill installation similarly ignored the active
    Workspace Governance repo root and could report false parity against the stale
    main checkout instead of the delivery worktree.
  source_refs:
