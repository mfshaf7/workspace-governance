- id: controlled-commissioning-runtime-artifact-retrievability-gap
  title: Permit issuance accepted an image digest that the target runtime could not
    retrieve
  trigger: closed-lesson-regression
  failure_classes:
  - learning-closure-regression
  - workflow-doctrine-gap
  finding: Controlled commissioning session
    delivery-698-751-temporal-commissioning-20260814-v5 passed claims validation,
    Security authorization, permit issuance, and permit consumption, then failed in
    the Temporal install phase before any workflow scenario ran. Exact baseline
    cleanup passed. The locked Temporal server index digest matched the published
    tag metadata but could not be pulled by exact digest on the amd64 target, while
    the corresponding amd64 manifest digest was retrievable. The pre-authorization
    path validated digest syntax and binding but did not prove target-architecture
    artifact retrievability before consuming the one-shot permit.
  source_refs:
