title: Make ART work-session locks crash-safe
recorded_on: '2026-08-24'
owner_repo: operator-orchestration-service
summary: A power interruption between exclusive lock creation and lock metadata persistence
  left zero-byte transient locks that blocked a valid ART closeout even though the
  durable session and evidence remained intact.
