    before the exact blocker, smallest faithful regression, and one live repair proof
    were locked.
  trigger: machine-visible-workflow-drift
  failure_classes:
  - workflow-doctrine-gap
  finding: The ART work-session lock protocol uses exclusive file creation followed
    by a separate non-durable metadata write; abrupt host loss can therefore leave
    an unparseable lock that the next operator command treats as corrupt instead of
    proving and recovering as stale.
