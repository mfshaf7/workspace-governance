id: 2026-10-25-agent-context-producer-request-boundary-regression
title: Exercise Agent context producers against the request boundary
recorded_on: '2026-10-25'
owner_repo: governance-operations-console
summary: Agent context construction can emit more references than the same Console
  request validator permits; one-reference operating probes missed the producer-to-request
  boundary.
regression_of: workspace-governance/reviews/after-action/2026-10-25-authorized-continuation-and-execution-boundaries.yaml
status: closed
source_type: review
scope:
