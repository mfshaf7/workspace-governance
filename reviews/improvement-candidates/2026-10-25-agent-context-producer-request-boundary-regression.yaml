signals:
- id: machine-visible-workflow-drift
  title: A validator, quality gate, or delivery read model exposed a workflow or doctrine
    miss that should stop normal execution.
  trigger: closed-lesson-regression
  failure_classes:
  - learning-closure-regression
  - workflow-doctrine-gap
  finding: The operator reported context candidate refs must contain at most 8 entries.
    The current live Agent probe reports online, and a nine-reference same-origin
    request reproduces HTTP422 with that exact error. Console request validation runs
    before invokeGovernedAgent and any OOS or provider call. The Focus context builder
    concatenates subject, source, receipt and evidence references without a list bound,
    while parseStringList permits at most eight. The browser announces OOS submission
    before server acceptance. The earlier real-provider Agent qualification supplied
    a synthetic one-reference candidate, so it did not prove actual page-context construction.
    The original browser request was not captured; its exact reference count and selected
    source remain unverified. Repair should align the existing producer and request
    contract, preserve canonical evidence and use producer-to-route coverage rather
    than relax limits or claim a model failure.
  source_refs:
  - governance-operations-console/src/agent-console/server/agent-request-policy.ts
  - governance-operations-console/src/console-shell/context/agent-context-candidates.ts
  - governance-operations-console/src/agent-console/state/use-agent-console-controller.ts
  - governance-operations-console/tests/console-architecture/console-agent-context.test.mjs
  - https://github.com/mfshaf7/governance-operations-console/pull/120
  - https://github.com/mfshaf7/security-architecture/pull/342
