    path: governance-operations-console/src/console-shell/context/agent-context-candidates.ts
    owner_repo: governance-operations-console
    note: Unique stable reference selection shares the unchanged server limit, discloses omissions and retains full owner evidence.
  - type: test
    path: governance-operations-console/tests/console-architecture/console-agent-context.test.mjs
    owner_repo: governance-operations-console
    note: Actual Focus producer output enters the real request validator at the limit, beyond it and with duplicates; independent safety denials remain.
  - type: runbook
    path: governance-operations-console/docs/product/agent-console-live-integration.md
    owner_repo: governance-operations-console
    note: Defines bounded reference projection and distinguishes sending context from acknowledged OOS admission.
  note: Closed on landed Console120 source controls and exact Security342 acceptance. Final accepted-runtime browser proof remains explicit maintenance closeout, not a claim made by this source-learning record.
