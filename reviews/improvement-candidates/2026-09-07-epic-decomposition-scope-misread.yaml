signals:
  - id: epic-decomposition-scope-misread
    title: Partial Feature elaboration was reported as complete Epic decomposition
    trigger: repeated-operator-friction
    failure_classes:
      - workflow-doctrine-gap
      - rollout-evidence-gap
    finding: >-
      The operator asked to break down the entire #892 Epic. Only Feature #919
      was decomposed, while #920 and #921 remained shells, yet the result was
      reported as complete. Full Epic backlog structure and current-PI execution
      commitment are independent planning decisions and must be reported
      separately.
    source_refs:
