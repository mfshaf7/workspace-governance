title: Prevent false completion of Intake and Inventory runtime activation
recorded_on: '2026-10-02'
owner_repo: platform-engineering
summary: >-
  ART 1217 closed after generic Console cross-domain activity checks even
  though the live OOS pod lacked the enable flags, authority and state roots,
  and WGCF bindings required for Workspace Intake and Inventory operation. The
  later repair then multiplied that one completion failure into peer Defects by
  confusing repository-specific Landing Units with defect identities.
