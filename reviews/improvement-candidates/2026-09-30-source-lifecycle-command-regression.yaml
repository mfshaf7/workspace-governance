owner_repo: workspace-governance
summary: >-
  The source implementation skill still required command discovery for merge,
  credential revocation, and strict cleanup, and it did not state that
  base-aware HEAD validation must run after commit. The cross-repo sequencer
  also required a generated Security index before the owner record used to
  generate that index had merged.
