signals:
- id: exact-post-publication-command-gap
  title: Normal source closeout still depended on command discovery
  trigger: closed-lesson-regression
  failure_classes:
  - workflow-doctrine-gap
  - diagnostic-ordering-miss
  finding: >-
    During the delivery-completion maintenance Landing Units, the agent tried a
    normal merge and unsupported auto-merge before the known admin merge, used
    command help to recover the credential-revocation syntax, and initially
    passed the wrong strict-audit repository argument.
  source_refs:
  - conversation:2026-09-30 operator identified repeated merge, revoke, and audit command misses
- id: head-validation-order-gap
  title: Base-aware validation ran before pending source reached HEAD
  trigger: machine-visible-workflow-drift
  failure_classes:
  - workflow-doctrine-gap
  - rollout-evidence-gap
  finding: >-
    The OOS base-aware change-record validator compares origin/main to HEAD. It
    was run while the relevant files were still uncommitted, so local proof
    reported no matched changes while CI correctly required the change record.
  source_refs:
  - https://github.com/mfshaf7/operator-orchestration-service/pull/251
- id: generated-index-order-contradiction
  title: Security index guidance required an impossible dependency order
  trigger: machine-visible-workflow-drift
  failure_classes:
  - workflow-doctrine-gap
  - rollout-evidence-gap
  finding: >-
    The Security index generator reads owner-repo main, but the sequencer said
    to merge that generated index before the owner change record. Security PR
    165 could pass only after OOS PR 251 merged and the job was rerun.
  source_refs:
  - https://github.com/mfshaf7/operator-orchestration-service/pull/251
  - https://github.com/mfshaf7/security-architecture/pull/165
