  trigger: machine-visible-workflow-drift
  failure_classes:
  - rollout-evidence-gap
  - workflow-doctrine-gap
  finding: The Security owner-evidence profile was syntactically valid and active but
    contained validation commands only. Source-backed Review Packet progression also
    required test evidence, so child 1188 could not complete through the normal path
    until the profile was repaired and the workflow was recovered.
  source_refs:
