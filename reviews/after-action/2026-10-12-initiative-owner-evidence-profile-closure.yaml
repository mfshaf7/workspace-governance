schema_version: 1
id: 2026-10-12-initiative-owner-evidence-profile-closure
title: Initiative planning now proves every owner evidence profile before source start
recorded_on: '2026-10-12'
owner_repo: workspace-governance
summary: >-
  Epic 894 exposed that exact work-start preflight correctly checked the selected
  Landing Unit but initiative planning had not checked all later owner profiles.
  Existing profiles were repaired in their owner repos, and the Delivery operator
  control now requires one recorded whole-initiative compatibility result before the
  first source Landing Unit starts.
scope:
  related_repos:
  - workspace-governance
  - workspace-governance-control-fabric
  - operator-orchestration-service
  - governance-operations-console
  - platform-engineering
  - security-architecture
  related_products:
  - governance-operations-console
  related_components:
  - operator-orchestration-service
  change_classes:
  - source-behavior
source_refs:
- openproject://work_packages/894
- openproject://work_packages/1254
- https://github.com/mfshaf7/workspace-governance-control-fabric/pull/99
- https://github.com/mfshaf7/operator-orchestration-service/pull/310
- https://github.com/mfshaf7/governance-operations-console/pull/62
- https://github.com/mfshaf7/platform-engineering/pull/284
