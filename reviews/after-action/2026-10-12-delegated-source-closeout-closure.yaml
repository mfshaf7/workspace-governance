title: Delegated source closeout now executes the recorded human boundary
recorded_on: '2026-10-12'
owner_repo: workspace-governance
summary: >-
  The source workflow already separated Agent Gary authorship from accountable
  human review, but Codex still treated the recorded human delegation as a
  reason to ask the operator again, and OOS invoked a normal merge that the
  single-human-reviewer ruleset could not accept. The repaired path makes the
  standing delegation explicit, preserves Agent Gary's publication-only
  boundary, and uses the existing human ruleset bypass only after exact-head,
  approval, check, and durable Review Packet gates pass.
