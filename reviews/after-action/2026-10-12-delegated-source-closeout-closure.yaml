  failure_class: learning-closure-regression
  trigger: closed-lesson-regression
  finding: >-
    Codex asked the operator to perform approval and merge despite the installed
    source workflow assigning those steps to the delegated mfshaf7 identity.
    After approval was recorded on the exact Agent Gary head, OOS still used a
    normal squash merge even though the repository's approved ruleset requires
    the configured human bypass actor to use administrator merge mode.
  impact: >-
    Story 1253 remained open after its implementation and evidence were ready,
    the operator had to repeat an already delegated instruction, and primary
    delivery paused for an avoidable control-plane repair.
