- id: remaining-work-classification-precedes-source-recovery
  title: No source delta means no source recovery resources
  failure_class: learning-closure-regression
  trigger: repeated-operator-friction
  finding: Fresh current proof had passed and only ART completion remained, but an unnecessary successor source session was started.
  impact: The session created avoidable branch, credential, cleanup, and operator churn.
  status: closed
