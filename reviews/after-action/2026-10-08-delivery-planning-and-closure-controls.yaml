- id: evidence-profile-coverage-respects-lifecycle-phase
  title: Accepted-base preflight cannot require a verifier implemented by the planned change
  failure_class: learning-closure-regression
  trigger: closed-lesson-regression
  finding: OOS checked operating-ready live-backend cases against the old base even though the lifecycle reads those cases from the reviewed merged head.
  impact: Work item 1237 was blocked before source creation and initially appeared to require a false preparatory Studio profile change.
  status: closed
  expected_control_types:
  - workflow
  - test
  - runbook
  control_refs:
  - type: workflow
    path: operator-orchestration-service/src/delivery-art/work-session-controller.js
    owner_repo: operator-orchestration-service
    note: Checks only merge-ready cases during accepted-base configured-path preflight.
  - type: test
