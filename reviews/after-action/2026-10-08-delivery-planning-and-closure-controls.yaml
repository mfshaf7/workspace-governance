    due_on: null
    note: null
- id: human-authorization-and-machine-attribution-are-distinct
  title: Console authorization must not overwrite OOS machine attribution
  failure_class: workflow-doctrine-gap
  trigger: machine-visible-workflow-drift
  finding: The Proposal adapter serialized the human Console principal where OOS requires the authenticated machine caller.
  impact: Live Proposal Target commissioning failed at the caller/operator binding.
  status: closed
  expected_control_types:
  - workflow
  - test
  control_refs:
  - type: workflow
    path: governance-operations-console/src/domain-workspaces/proposal/server/proposal-oos-client.ts
    owner_repo: governance-operations-console
    note: Separates human authorization from OOS command attribution.
  - type: test
    path: governance-operations-console/tests/operation-runtime/proposal-live-adapter.test.mjs
    owner_repo: governance-operations-console
    note: Locks the machine caller into Proposal commands.
  follow_up:
    owner_repo: null
    due_on: null
    note: null
