lessons:
- id: owner-evidence-readiness-precedes-work-start
  title: Every admitted source owner needs an active evidence profile before work starts
  failure_class: learning-closure-regression
  trigger: closed-lesson-regression
  finding: Admitted owners reached work preflight before complete profile activation and recovery attempts were mistaken for architecture changes.
  impact: Work item 1232 encountered avoidable preflight and recovery churn.
  status: closed
  expected_control_types:
  - contract
  - validator
  control_refs:
  - type: validator
    path: workspace-governance/scripts/validate_cross_repo_truth.py
    owner_repo: workspace-governance
    note: Proves complete profile-or-nonactivation coverage.
  - type: contract
    path: workspace-prototype-studio/contracts/delivery-art-work-session/evidence-profile.json
    owner_repo: workspace-prototype-studio
    note: Supplies the Studio owner evidence profile.
  - type: contract
    path: context-governance-gateway/contracts/delivery-art-work-session/evidence-profile.json
    owner_repo: context-governance-gateway
    note: Supplies the CGG owner evidence profile.
  follow_up:
    owner_repo: null
    due_on: null
    note: null
- id: human-authorization-and-machine-attribution-are-distinct
  title: Console authorization must not overwrite OOS machine attribution
  failure_class: workflow-doctrine-gap
  trigger: machine-visible-workflow-drift
  finding: The Proposal adapter serialized the human Console principal where OOS requires the authenticated machine caller.
  impact: Live Proposal Target commissioning failed at the caller/operator binding.
  status: closed
  expected_control_types:
  - workflow
  - test
  control_refs:
  - type: workflow
    path: governance-operations-console/src/domain-workspaces/proposal/server/proposal-oos-client.ts
    owner_repo: governance-operations-console
    note: Separates human authorization from OOS command attribution.
  - type: test
    path: governance-operations-console/tests/operation-runtime/proposal-live-adapter.test.mjs
    owner_repo: governance-operations-console
    note: Locks the machine caller into Proposal commands.
  follow_up:
    owner_repo: null
    due_on: null
    note: null
- id: evidence-commands-bind-exact-capability-cases
  title: Same-fidelity evidence must still be scoped to requested cases
  failure_class: learning-closure-regression
  trigger: closed-lesson-regression
  finding: OOS ran an unrelated Repository and Catalog live command while proving Proposal Target because both used live-backend fidelity.
  impact: Work item 1236 blocked without relevant state progress.
  status: closed
  expected_control_types:
  - contract
  - workflow
  - test
  control_refs:
  - type: contract
    path: operator-orchestration-service/contracts/delivery-art-work-session/evidence-profile.schema.json
    owner_repo: operator-orchestration-service
    note: Defines exact conformance-case selectors.
  - type: workflow
    path: operator-orchestration-service/src/delivery-art/review-evidence-acquisition.js
    owner_repo: operator-orchestration-service
    note: Omits unmatched commands.
  - type: contract
    path: platform-engineering/contracts/delivery-art-work-session/evidence-profile.json
    owner_repo: platform-engineering
    note: Binds each live command to its capability cases.
  follow_up:
