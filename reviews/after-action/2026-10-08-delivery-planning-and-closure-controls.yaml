    due_on: null
    note: null
- id: source-activation-owner-precedes-commissioning
  title: A downstream commissioner cannot satisfy an owner source gate
  failure_class: workflow-doctrine-gap
  trigger: closed-lesson-regression
  finding: The plan initially jumped from Security to Platform while the OOS-owned source gate remained inactive.
  impact: Commissioning could not begin until OOS landed the reviewed activation change.
