schema_version: 1
id: 2026-10-04-epic-1203-work-session-and-live-acceptance-closure
title: Epic 1203 work-session and live-acceptance controls now fail at their owning boundaries
recorded_on: '2026-10-04'
owner_repo: workspace-governance
summary: >-
  Epic 1203 exposed a connected control failure rather than one product defect:
  active ART source was merged through a maintenance path, accepted-base
  evidence requirements were dropped at a transport seam, source-only checks
  missed current authority and persistence behavior, evidence execution could
  restart its waiting controller, and direct profile activation could erase an
  active composition's bindings. The repaired system now separates ART and
  maintenance merge paths, preserves evidence requirements end to end, validates
  canonical runtime boundaries, makes evidence completion replay-safe, and
  routes composition-owned mutation through the composition. Item 1231 and
  Feature 1211 closed with governed evidence; the merged-source
  `refinement-catalog` composition is active and healthy.
