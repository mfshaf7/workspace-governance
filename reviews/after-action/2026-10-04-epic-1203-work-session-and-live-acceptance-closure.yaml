lessons:
- id: art-and-maintenance-source-paths-must-not-share-a-merge-command
  title: ART state, not Git state alone, owns accepted-work merge order
  failure_class: learning-closure-regression
  trigger: closed-lesson-regression
  finding: >-
    A valid Agent-authored PR with passing checks was merged through the
    maintenance command while its active OOS session still required a
    merge-ready transition. The workflow also lacked a complete local-draft
    merged-session recovery path and initially allowed an ambient human Git
    credential helper to precede the bounded Agent credential. After the
    recovery squash-merged, the Workspace capability contract also retained
    the unmerged Agent source commit instead of the durable OOS main commit.
  impact: >-
    Source landed before durable Review Packet custody, recovery work expanded,
    and operator identity boundaries had to be repaired during active delivery.
  status: closed
  expected_control_types:
  - skill
  - workflow
  control_refs:
  - type: skill
    path: workspace-governance/skills-src/source-implementation-operator/SKILL.md
    owner_repo: workspace-governance
    note: Separates accepted ART merge through OOS from owner-maintenance GitHub merge.
  - type: workflow
    path: operator-orchestration-service/src/delivery-art/work-session-controller.js
    owner_repo: operator-orchestration-service
    note: Preserves broker-owned transition and recovery ordering.
  - type: change-record
    path: operator-orchestration-service/docs/records/change-records/2026-10-04-local-draft-merged-session-recovery.md
    owner_repo: operator-orchestration-service
    note: Records the bounded merged-session recovery and exact source-identity correction.
  - type: contract
    path: workspace-governance/contracts/delivery-art-operator-path.yaml
    owner_repo: workspace-governance
    note: Binds capability activation to the durable OOS squash-merge commit whose manifest digest is validated cross-repo.
  follow_up:
    owner_repo: null
    due_on: null
    note: null
- id: accepted-base-evidence-must-survive-every-transport-seam
  title: Configured-path preflight is only real when the executor receives the same requirements
  failure_class: learning-closure-regression
  trigger: closed-lesson-regression
  finding: >-
    OOS derived operating-ready cases before source work, but the source-executor
    client dropped their conformance and evidence-kind requirements. A Platform
    base without the live evidence command therefore started and merged before
    the missing contract was detected.
  impact: >-
    The strongest early gate became a local illusion, causing another recovery
    Landing Unit and delaying item 1231 until after merge.
  status: closed
  expected_control_types:
  - workflow
  - test
  control_refs:
  - type: workflow
    path: operator-orchestration-service/src/delivery-art/source-executor.js
    owner_repo: operator-orchestration-service
    note: Transports the complete configured-path inspection request across the executor boundary.
  - type: test
