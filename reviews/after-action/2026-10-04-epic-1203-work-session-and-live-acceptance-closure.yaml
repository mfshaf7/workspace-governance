- id: live-acceptance-must-use-current-authority-and-real-persistence
  title: Source-only agreement cannot substitute for the canonical live boundary
  failure_class: unsafe-assumption
  trigger: repeated-operator-friction
  finding: >-
    Synthetic fixtures used obsolete repository-authority schema v1, omitted the
    real OpenProject Setting serializer, and assumed commissioning ran only once.
    The full live path exposed the schema-v2 mismatch, YAML-alias incompatibility,
    readiness windows, stale bindings, and reused acceptance identity in series.
  impact: >-
    Each narrow proof passed while the next real boundary failed, creating the
    appearance of repeated regressions and extending one child over two days.
  status: closed
  expected_control_types:
  - test
  - validator
  - doc
  control_refs:
  - type: test
    path: workspace-governance-control-fabric/tests/test_repository_readiness.py
    owner_repo: workspace-governance-control-fabric
    note: Exercises repository readiness against canonical schema-v2 authority.
  - type: test
    path: platform-engineering/products/openproject/catalog-control/test_validate_catalog_control.py
    owner_repo: platform-engineering
    note: Covers the real serializer-compatible detached Catalog state shape.
  - type: test
    path: platform-engineering/products/governance-operations-console/scripts/test_console_cross_domain_activation.py
    owner_repo: platform-engineering
    note: Covers repeat commissioning, bounded retry, availability waits, denial, rollback, and readback.
  - type: change-record
    path: platform-engineering/docs/records/change-records/2026-10-04-repository-catalog-devint-commissioning.md
    owner_repo: platform-engineering
    note: Records the complete live commissioning and exact completion evidence.
  follow_up:
    owner_repo: null
    due_on: null
    note: null
- id: evidence-execution-must-be-verification-only-and-replay-safe
  title: A verifier cannot restart its requester or rely on generic CI identity
  failure_class: workflow-doctrine-gap
  trigger: repeated-operator-friction
  finding: >-
    The runtime evidence command invoked disruptive commissioning and restarted
    the OOS controller waiting for its response. The first containment used
    generic CI state as a behavior switch, which leaked into unit tests. The
    host executor also lacked durable completed-result custody.
  impact: >-
    The request died with exit 137 despite healthy memory, and retry could repeat
    expensive live actions while tests behaved differently under evidence runs.
  status: closed
  expected_control_types:
  - workflow
  - doc
  - runbook
  control_refs:
  - type: workflow
    path: operator-orchestration-service/src/delivery-art/source-action-result-store.js
    owner_repo: operator-orchestration-service
    note: Stores a private digest-bound completed result before replying and replays exact retries.
  - type: workflow
    path: operator-orchestration-service/src/delivery-art/lifecycle-cli-adapters.js
    owner_repo: operator-orchestration-service
    note: Projects explicit verification-only context only to runtime evidence commands.
  - type: test
    path: operator-orchestration-service/test/delivery-art-source-executor.test.js
    owner_repo: operator-orchestration-service
    note: Proves replay after executor restart with one underlying execution.
  - type: change-record
    path: operator-orchestration-service/docs/records/change-records/2026-10-04-evidence-execution-boundary.md
    owner_repo: operator-orchestration-service
    note: Defines the corrected execution and trust boundary.
  - type: runbook
    path: operator-orchestration-service/docs/operations/delivery-workflow-operator-surface.md
    owner_repo: operator-orchestration-service
    note: Defines verification-only evidence commands and durable replay behavior for operators.
  follow_up:
    owner_repo: null
    due_on: null
    note: null
- id: composition-ownership-must-be-enforced-before-profile-mutation
  title: Recorded composition ownership must route mutating lifecycle commands
  failure_class: unsafe-assumption
  trigger: repeated-operator-friction
  finding: >-
    The shared runner recorded composition ownership but trusted the operator to
    remember it. A direct profile `up` silently omitted Catalog and identity
    bindings and replaced the active runtime shape.
  impact: >-
    Later acceptance exercised a different system than the reviewed composition
    and required another full reconciliation cycle.
  status: closed
  expected_control_types:
  - test
  - runbook
  control_refs:
  - type: workflow
    path: platform-engineering/scripts/dev_integration.py
    owner_repo: platform-engineering
    note: Refuses direct active-composition mutation before owner command dispatch.
  - type: test
    path: platform-engineering/scripts/test_dev_integration.py
