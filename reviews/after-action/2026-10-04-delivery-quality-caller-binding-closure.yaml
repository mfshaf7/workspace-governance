schema_version: 1
id: 2026-10-04-delivery-quality-caller-binding-closure
title: Platform quality checks now preserve broker caller-secret identity
recorded_on: '2026-10-04'
owner_repo: platform-engineering
summary: >-
  Platform's Delivery ART quality adapter no longer assumes the first allowed
  broker caller can authenticate with the compatibility shared secret. It now
  uses an exact caller-specific secret whenever the caller is identity-bound,
  reserves the shared secret for allowed unbound callers, and fails closed when
  no valid pair exists. Merged-main Epic 1203 projection quality is clean.
scope:
  related_repos:
  - operator-orchestration-service
  - platform-engineering
