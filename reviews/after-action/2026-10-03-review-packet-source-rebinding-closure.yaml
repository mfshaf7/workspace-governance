schema_version: 1
id: 2026-10-03-review-packet-source-rebinding-closure
title: Recovered Landing Units can no longer rebind completion evidence
recorded_on: '2026-10-03'
owner_repo: operator-orchestration-service
summary: >-
  Delivery 1206 was implemented by Workspace Governance PR 215, but recovery
  allowed the same Landing Unit identity to finalize against unrelated PR 217.
  OOS now makes recovered identities terminal, requires an exact durable
  recovery-supersession chain for later source intent, and rechecks that chain
  before finalization and closeout. The canonical 1206 completion narrative
  now attributes the real implementation and quarantines the immutable wrong
  packet as audit history.
