lessons:
- id: recovered-landing-unit-identity-must-be-terminal
  title: Recovery must terminate source identity instead of reopening attribution
  failure_class: learning-closure-regression
  trigger: closed-lesson-regression
  finding: >-
    The earlier evidence-fidelity control validated evidence content but did
    not prevent a recovered work session from reusing its Landing Unit identity
    for a different pull request. A structurally valid finalized packet could
    therefore carry truthful evidence for the wrong source change.
  impact: >-
    Work item 1206 and its already-closed parent attributed activation-authority
    implementation to an unrelated improvement-record pull request. The real
    implementation remained present and validated, but delivery provenance and
    rollback evidence could not be trusted until corrected.
  status: closed
  expected_control_types:
  - workflow
  - contract
  - test
  control_refs:
  - type: workflow
    path: operator-orchestration-service/src/delivery-art/work-session-controller.js
    owner_repo: operator-orchestration-service
    note: Makes recovered Landing Unit identities and branches terminal and requires exact unsuperseded recovery bindings for later source intent.
  - type: contract
    path: operator-orchestration-service/docs/contracts/delivery-workflow-api-v1.md
    owner_repo: operator-orchestration-service
    note: Defines the recovery terminality and durable supersession requirements enforced before finalization and closeout.
  - type: test
    path: operator-orchestration-service/test/delivery-art-work-session.test.js
    owner_repo: operator-orchestration-service
    note: Covers missing, partial, stale, and valid recovery-supersession chains plus pre-existing rebound-session rejection.
