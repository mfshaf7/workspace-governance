  - id: bounded-startup-before-normal-liveness
    title: Give admitted dependency startup its bounded startup probe
    failure_class: rollout-evidence-gap
    trigger: machine-visible-workflow-drift
    finding: >-
      CGG liveness killed its API while startup dependency installation was
      still running. Actual Kubernetes events identified the liveness cause;
      exit137 alone was not evidence of OOM. Readiness and steady-state
      liveness were correct controls applied before startup had completed.
    impact: >-
      CGG PR31 mergede29c59a4ed56048f6aa47bb924899566a5e68bae with identical
      reviewed tree842a8722ed1a0e85b905b7410ee1843047fddf09. Security PR372
      accepted the exact source. The existing manifest now bounds startup to
      300seconds before normal readiness/liveness take over. Actual native
      PostgreSQL, MinIO, API and worker rollouts succeeded; read-only API exec
      with and without stdin succeeded. Later complete-runtime activation and
      current owner observations independently confirmed the accepted CGG
      source. No alternate image, authority, ART child or monitor was added.
    status: closed
    expected_control_types:
    - workflow
    - runbook
