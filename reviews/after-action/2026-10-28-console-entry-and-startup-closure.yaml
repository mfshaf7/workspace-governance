  - id: query-shaped-representations-have-distinct-bindings
    title: Preserve canonical concurrency while separating read representations
    failure_class: learning-closure-regression
    trigger: closed-lesson-regression
    finding: >-
      OOS gave a plain Proposal projection and its record-plus-history snapshot
      the same source binding, revision and event cursor despite different
      payload shapes. The Console correctly rejected the conflicting envelope.
      The earlier read-performance change had not accounted for representation
      identity; weakening consumer ordering or recreating the Proposal would
      have hidden the producer defect.
    impact: >-
      OOS PR385 merged8519ff0537ae6cd00ae7f45d835e41723985ee18 and Security
      PR363 mergedcc1ac4b92a19b0c4a9897fd8ef646fa8954096ed. Native repaired
      reads prove distinct stable views. Recovery reused original command
      proposal-command:idea-1331:handoff:a77421c9 and applied exactly one target
      delivery1332 through the real Console. Two prior events were preserved;
      the final four unique events contain one prepare and one applied event.
      The related query-shaped producer audit, owner tests, source acceptance,
      normal activation and owner cleanup are retained in the actual proof.
    status: closed
    expected_control_types:
    - workflow
    - doc
    - test
    control_refs:
    - type: workflow
      path: operator-orchestration-service/src/console-source-authority.js
