    explicitly discloses bounded selection and preserves canonical owner
    evidence. The server shares the same unchanged list limit and retains
    independent rejection. Initial status text now describes validation.
    Producer/request tests reproduce the old422 and cover the limit, larger
    lists, duplicates, unchanged input and safety denials. All708 product tests,
    architecture guards, typecheck, production build, repository validation and
    dependency audit passed; exact source CI40133194994 passed. Security342
