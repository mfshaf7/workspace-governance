    owner_repo: context-governance-gateway
    note: Missing, wrong-boundary, wrong-caller, malformed, ephemeral and missing/mismatched readiness cases passed with all98 owner tests.
  - type: workflow
    path: operator-orchestration-service/src/refinement/service.js
    owner_repo: operator-orchestration-service
    note: The existing full projection envelope and separate assist-context digest are checked without removing caller, source, packet, task, redaction or authority binding.
  - type: test
    path: operator-orchestration-service/test/refinement-service.test.js
    owner_repo: operator-orchestration-service
    note: The actual owner formula fails against the old consumer; recomputed tampered envelopes still fail separate binding checks before invocation. All1619 passing tests plus2 documented skips and built API/worker smoke passed.
  - type: doc
    path: security-architecture/docs/reviews/components/2026-10-24-configurable-ai-routing.md
    owner_repo: security-architecture
