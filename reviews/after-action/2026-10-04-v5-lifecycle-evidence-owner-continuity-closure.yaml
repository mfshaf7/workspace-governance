lessons:
- id: serialized-workflow-handoffs-must-preserve-selection-identity
  title: Serializer, schema, and selector must share one exact identity contract
  failure_class: learning-closure-regression
  trigger: closed-lesson-regression
  finding: >-
    Earlier v5 controls correctly separated outcome applicability from evidence
    ownership, but the persistent work-session path was tested only at its
    endpoints. The session retained the selected Landing Unit and the lifecycle
    selector required it, while the compatibility-plan serializer omitted the
    field and its schema rejected it. The correct plan therefore became invalid
    only at live continuation.
  impact: >-
    Work item 1229 created its bounded source worktree and then stopped before
    source work, forcing another control-plane repair cycle and delaying the
    primary Epic despite a valid operator decision.
  status: closed
  expected_control_types:
  - workflow
  - contract
  - validator
  - test
  control_refs:
  - type: workflow
    path: operator-orchestration-service/src/delivery-art/work-session.js
    owner_repo: operator-orchestration-service
    note: Serializes the persisted Landing Unit id into the lifecycle plan.
  - type: contract
    path: operator-orchestration-service/contracts/delivery-art-lifecycle/lifecycle-plan.schema.json
    owner_repo: operator-orchestration-service
    note: Preserves historical compatibility while admitting the identity used by current plans.
  - type: validator
    path: operator-orchestration-service/src/delivery-art/lifecycle-controller.js
    owner_repo: operator-orchestration-service
    note: Requires one exact current v5 owner identity and rejects missing, stale, or ambiguous matches.
  - type: test
    path: operator-orchestration-service/test/delivery-art-work-session.test.js
    owner_repo: operator-orchestration-service
    note: Exercises identity continuity across the real session-to-plan continuation seam.
  - type: test
    path: operator-orchestration-service/test/delivery-art-lifecycle-controller.test.js
    owner_repo: operator-orchestration-service
    note: Covers missing, stale, and ambiguous v5 identity rejection.
