  title: Prove context selection, scope and native presentation as one operator path
  failure_class: learning-closure-regression
  trigger: closed-lesson-regression
  finding: Existing native workspace dialogs blocked the floating Agent outside their top layer. Registry
    fell through to Governed Releases; Focus received workspace scope although the server required
    page scope. The synthetic workspace factory did not provide current whole-Console information.
    Home disabling Workspace followed its old narrower contract and was not itself a defect. The operator
    accepted Focus for the selected visible page/record and Workspace for the whole Console. Interaction
    proof also exposed a prompt racing the asynchronous old-session close.
  impact: Console PR121 merged reviewed Gary head e6b7366a66858bda993dd8f443e60a641f0c43b5 as equal-tree
    b98956a0ab10c11c933c1b9ec7d3ad781967509d. All713 semantic tests, guards, types, production build,
    repository validation, dependency audit and CI40140638181 passed. Eight explicit synthetic browser
    cases passed. Independent current-owner reads qualified all8 sources and the produced candidate
    passed the real request parser. These close the source-learning control; exact-source Security
    acceptance, final full activation, real browser model/receipt proof and source cleanup remain
    separately required before overall maintenance completion.
