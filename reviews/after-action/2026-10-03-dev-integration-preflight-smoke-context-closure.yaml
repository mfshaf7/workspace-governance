schema_version: 1
id: 2026-10-03-dev-integration-preflight-smoke-context-closure
title: Composition preflight and context-aware smoke now fail before costly reconciliation
recorded_on: '2026-10-03'
owner_repo: workspace-governance
summary: >-
  The Delivery 1203 recovery work exposed a chain of distinct control gaps:
  architecture v4 conflated outcome applicability with evidence ownership,
  work recovery could not preserve merged evidence after supersession, broad
  initiative reads and pre-decision owner selection made normal work fragile,
  and dev-integration composition checks occurred too late or outside their
  active context. The architecture and work-session controls were repaired
  first. Platform now preflights the complete composition before mutation and
  binds profile smoke to the one active composition. The stronger proof then
  exposed and closed an OOS caller-secret defect and an expired exact-source
  Workspace operations credential. Canonical merged-main up, status, smoke,
  and identity proof all passed without creating another ART Defect.
