lessons:
- id: architecture-must-separate-outcomes-from-evidence-owners
  title: Outcome applicability and evidence ownership are separate architecture facts
  failure_class: learning-closure-regression
  trigger: closed-lesson-regression
  finding: >-
    Schema v4 used one work-item list both for outcomes that depended on a case
    and for Landing Units that had to produce the proof. The invalid allocation
    survived planning and was detected only after child 1228 had merged. The
    corrected v5 model assigns evidence owners explicitly, proves causal closure
    to applicable outcomes, and selects readiness evidence by owner and phase.
    OOS also gained an evidence-preserving recovery transition for exact merged
    source plus a non-finalized merge-ready packet.
  impact: >-
    The mistake caused an unnecessary post-merge architecture supersession and
    blocked legal work-session continuation despite durable source evidence.
  status: closed
  expected_control_types:
  - contract
  - validator
  - workflow
  - skill
  control_refs:
  - type: contract
    path: workspace-governance/contracts/schemas/delivery-art-architecture-packet.schema.json
    owner_repo: workspace-governance
    note: V5 separates outcome scope from exact Landing Unit evidence owners.
  - type: validator
    path: workspace-governance/scripts/validate_contracts.py
    owner_repo: workspace-governance
    note: Validates coverage, causal closure, and terminating parent traversal.
  - type: workflow
    path: operator-orchestration-service/src/delivery-art/work-session-controller.js
    owner_repo: operator-orchestration-service
    note: Selects v5 evidence owners and preserves merged evidence during recovery.
  - type: skill
    path: workspace-governance/skills-src/project-delivery-operator/SKILL.md
    owner_repo: workspace-governance
    note: Makes v5 the normal planning and delivery shape.
  follow_up:
    owner_repo: null
    due_on: null
    note: null
- id: initiative-work-must-be-bounded-before-projection
  title: Initiative-scoped work must be bounded at the backend and tolerate pre-decision state
  failure_class: rollout-evidence-gap
  trigger: machine-visible-workflow-drift
  finding: >-
    OOS originally enumerated the full Delivery ART before narrowing one
    initiative, and the v5 work preflight demanded an evidence owner before a
    Landing Unit decision existed. Native backend filters and bounded relation
    hydration now constrain reads, while pre-decision projection exposes
    applicable cases without selecting owner cases until the decision exists.
  impact: >-
    Normal read-only work took minutes, timed out during live proof, and could
    fail before presenting the operator with the decision it needed.
  status: closed
  expected_control_types:
  - workflow
  - test
  - change-record
  control_refs:
  - type: workflow
    path: operator-orchestration-service/src/openproject-client.js
    owner_repo: operator-orchestration-service
    note: Uses bounded OpenProject filters and relation hydration for one initiative.
  - type: test
    path: operator-orchestration-service/test/delivery-art-work-session.test.js
