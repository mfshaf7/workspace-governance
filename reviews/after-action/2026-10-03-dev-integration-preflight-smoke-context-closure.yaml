- id: composition-controls-must-run-before-mutation-and-inside-context
  title: Composition prerequisites and smoke context are one operating boundary
  failure_class: workflow-doctrine-gap
  trigger: late-host-drift-discovery
  finding: >-
    Branch-bound source dependencies, runtime-directory ownership, user
    systemd, auto-resume state, writable session ancestry, and pending Helm
    operations were discovered only after composition mutation had started.
    Standalone profile smoke then omitted active composition bindings and could
    report composed dependencies inactive. Platform PR 261 resolves every
    profile first, runs one non-mutating composition preflight, and makes normal
    profile smoke derive exactly one active operator-owned composition.
  impact: >-
    The operator endured repeated long reconciliation cycles, while a passing
    smoke gave incomplete assurance about the actual composed runtime.
  status: closed
  expected_control_types:
  - workflow
  - test
  - runbook
  - change-record
  control_refs:
  - type: workflow
    path: platform-engineering/scripts/dev_integration_preflight.py
    owner_repo: platform-engineering
    note: Proves complete source and host restart prerequisites before mutation.
  - type: workflow
    path: platform-engineering/scripts/dev_integration.py
    owner_repo: platform-engineering
    note: Binds smoke to one active composition and rejects degraded or ambiguous state.
  - type: test
    path: platform-engineering/scripts/test_dev_integration_compositions.py
    owner_repo: platform-engineering
    note: Exercises composition preflight ordering and smoke-context selection through the existing CI entrypoint.
  - type: runbook
    path: platform-engineering/docs/runbooks/dev-integration-profiles.md
    owner_repo: platform-engineering
    note: Defines normal composition startup, status, smoke, and identity proof order.
  - type: change-record
    path: platform-engineering/docs/records/change-records/2026-10-03-dev-integration-composition-preflight-and-smoke-context.md
    owner_repo: platform-engineering
    note: Records validation, live proof, rollback, and the dev-integration-only boundary.
  follow_up:
    owner_repo: null
    due_on: null
    note: null
- id: stronger-smoke-must-close-dependent-auth-findings-with-exact-source-proof
  title: Stronger smoke findings require invariant-aware repair and exact-source activation
  failure_class: unsafe-assumption
  trigger: late-root-cause-discovery
  finding: >-
    Composition-aware smoke first exposed an unbound inbound caller. The first
    repair mapped that caller to the compatibility shared secret and violated
    OOS's existing distinct-secret invariant, so startup failed closed. The
    corrected repair generates separate values and validates them before
    mutation. That proof then exposed an expired GitHub App token. Security
    reviewed the exact repaired heads before Platform refreshed its pins and
    delivered a new session-bound token. Status proved authenticated Intake,
    Inventory, and invalid-caller denial from the live pod.
  impact: >-
    Two narrow assumptions extended the maintenance window: one ignored an
    existing runtime invariant and the other treated structural credential
    projection as freshness proof.
  status: closed
  expected_control_types:
  - workflow
  - test
  - change-record
  - doc
  control_refs:
  - type: workflow
    path: operator-orchestration-service/dev-integration/profiles/accepted-idea-delivery/scripts/up.sh
    owner_repo: operator-orchestration-service
    note: Projects a distinct caller-specific smoke secret and rejects invalid values before mutation.
  - type: test
    path: operator-orchestration-service/test/devint-host-service-profile.test.js
    owner_repo: operator-orchestration-service
    note: Proves caller mapping and shared-secret separation.
  - type: change-record
    path: operator-orchestration-service/docs/records/change-records/2026-10-03-devint-smoke-distinct-caller-secret.md
    owner_repo: operator-orchestration-service
    note: Records the superseding OOS repair and exact validation.
  - type: doc
    path: security-architecture/docs/reviews/components/2026-10-03-workspace-operations-post-repair-pin-refresh.md
    owner_repo: security-architecture
    note: Accepts the exact repaired revisions used by runtime identity delivery.
  - type: workflow
    path: platform-engineering/scripts/workspace_intake_identity.py
    owner_repo: platform-engineering
    note: Delivers a session-bound token and proves live authenticated operations plus denial.
  follow_up:
    owner_repo: null
    due_on: null
    note: null
- id: landing-unit-design-must-respect-source-identity-paths
  title: Source publication capability is a Landing Unit precondition
  failure_class: unsafe-assumption
  trigger: machine-visible-workflow-drift
  finding: >-
    The first Platform history changed a workflow file although Agent Gary has
    no workflow-write permission. The provider rejected publication. The
    existing validation workflow already imported the expanded test module, so
    the workflow edit was removed and the Landing Unit was rebuilt as one clean
    Agent-authored commit. No permission was broadened.
  impact: >-
    The avoidable branch rewrite delayed publication but did not bypass the
    human-review boundary or weaken the source identity.
  status: closed
  expected_control_types:
  - workflow
  - test
  control_refs:
  - type: workflow
    path: operator-orchestration-service/src/owner-source-cli.js
    owner_repo: operator-orchestration-service
    note: Preserves the bounded Agent source publication path.
  - type: test
    path: platform-engineering/scripts/test_dev_integration_compositions.py
    owner_repo: platform-engineering
    note: Is imported by the existing CI entrypoint, eliminating the unnecessary workflow edit.
  follow_up:
    owner_repo: null
    due_on: null
    note: null
