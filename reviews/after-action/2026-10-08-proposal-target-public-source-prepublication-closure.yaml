lessons:
- id: public-source-admission-must-precede-branch-publication
  title: Public source needs structural admission before any review branch is pushed
  failure_class: unsafe-assumption
  trigger: late-architecture-discovery
  finding: >-
    The original implementation treated pull-request review as the disclosure
    boundary even though branch publication had already copied caller-written
    Proposal and operator content into a public repository. Public-source
    admission belongs in the target contract and the caller projection before
    source preparation begins.
  impact: >-
    The source-backed feature could not safely proceed to runtime activation.
    Studio and OOS required owner-first corrective Landing Units, Security had
    to repeat its exact-revision review, and Epic 1203 was delayed until the
    disclosure path was structurally closed.
  status: closed
  expected_control_types:
  - contract
  - test
  - doc
  control_refs:
  - type: contract
    path: workspace-prototype-studio/contracts/proposal-target-application/request.schema.json
    owner_repo: workspace-prototype-studio
    note: Closed v2 public request schema rejects caller-written content and accepts only bounded public-safe fields.
  - type: test
    path: workspace-prototype-studio/tests/test_proposal_target_application.py
    owner_repo: workspace-prototype-studio
    note: Proves generated public capture and rejection of operator, suggestion, rationale, and custody-reference fields.
  - type: workflow
    path: operator-orchestration-service/src/proposal-target-application/service.js
    owner_repo: operator-orchestration-service
    note: Constructs the Studio request through an explicit private-to-public projection.
  - type: test
    path: operator-orchestration-service/test/proposal-target-boundary.test.js
    owner_repo: operator-orchestration-service
    note: Proves private Proposal content cannot cross the public source boundary.
  - type: doc
    path: security-architecture/docs/reviews/components/2026-10-08-proposal-target-application-trust-boundary.md
    owner_repo: security-architecture
    note: Approves only the exact repaired revisions and sequences activation after the repaired boundary.
  follow_up:
    owner_repo: null
    due_on: null
    note: null
