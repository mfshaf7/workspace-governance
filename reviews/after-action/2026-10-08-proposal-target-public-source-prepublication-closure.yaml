schema_version: 1
id: 2026-10-08-proposal-target-public-source-prepublication-closure
title: Proposal target publication now admits only public-safe generated content
recorded_on: '2026-10-08'
owner_repo: workspace-prototype-studio
summary: >-
  Security review found that the first Proposal target contract could publish
  free-form Proposal and operator content to a public Prototype Studio branch
  before human review. Studio PR 23 replaced that boundary with a closed v2
  contract containing generated identities, bounded references, digests, and
  enumerated posture. OOS PR 285 now projects only that public-safe shape, and
  Security PR 199 approved the repaired exact revisions before activation.
scope:
  related_repos:
  - operator-orchestration-service
  - security-architecture
  - workspace-prototype-studio
  related_products: []
  related_components:
  - operator-orchestration-service
  change_classes:
  - architecture-shaping
  - source-behavior
source_refs:
- https://github.com/mfshaf7/workspace-prototype-studio/pull/23
- https://github.com/mfshaf7/operator-orchestration-service/pull/285
- https://github.com/mfshaf7/security-architecture/pull/199
