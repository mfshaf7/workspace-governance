name: validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install validation dependencies
        run: pip install -r requirements.txt

      - name: Validate repo structure
        run: python3 scripts/validate_repo_structure.py --repo-root .

      - name: Validate contract model
        run: python3 scripts/validate_contracts.py --repo-root .

      - name: Validate Delivery ART artifact entrypoint
        run: |
          architecture=contracts/fixtures/delivery-art-workflow/architecture-packet.valid.json
          architecture_custody=contracts/fixtures/delivery-art-workflow/architecture-custody-receipt.valid.json
          work_start=contracts/fixtures/delivery-art-workflow/work-start-record.valid.json
          work_start_custody=contracts/fixtures/delivery-art-workflow/work-start-custody-receipt.valid.json
          merge_ready=contracts/fixtures/delivery-art-workflow/review-packet-merge-ready.valid.json
          merge_ready_custody=contracts/fixtures/delivery-art-workflow/merge-ready-custody-receipt.valid.json
          receipt=contracts/fixtures/delivery-art-workflow/readiness-receipt.valid.json
          finalized=contracts/fixtures/delivery-art-workflow/review-packet-finalized.valid.json
          finalized_custody=contracts/fixtures/delivery-art-workflow/finalized-custody-receipt.valid.json
          python3 scripts/validate_delivery_art_artifact.py "$architecture" --repo-root . \
            --dependency-artifact "$architecture_custody"
          python3 scripts/validate_delivery_art_artifact.py "$work_start" --repo-root . \
            --dependency-artifact "$architecture" \
            --dependency-artifact "$architecture_custody" \
            --dependency-artifact "$work_start_custody"
          python3 scripts/validate_delivery_art_artifact.py "$merge_ready" --repo-root . \
            --dependency-artifact "$architecture" \
            --dependency-artifact "$architecture_custody" \
            --dependency-artifact "$work_start" \
            --dependency-artifact "$work_start_custody" \
            --dependency-artifact "$merge_ready_custody"
          python3 scripts/validate_delivery_art_artifact.py "$receipt" --repo-root . \
            --dependency-artifact "$architecture" \
            --dependency-artifact "$architecture_custody" \
            --dependency-artifact "$work_start" \
            --dependency-artifact "$work_start_custody" \
            --dependency-artifact "$merge_ready" \
            --dependency-artifact "$merge_ready_custody" \
            --dependency-artifact "$finalized" \
            --dependency-artifact "$finalized_custody"
          python3 scripts/validate_delivery_art_artifact.py "$finalized" --repo-root . \
            --dependency-artifact "$architecture" \
            --dependency-artifact "$architecture_custody" \
            --dependency-artifact "$work_start" \
            --dependency-artifact "$work_start_custody" \
            --dependency-artifact "$merge_ready" \
            --dependency-artifact "$merge_ready_custody" \
            --dependency-artifact "$finalized_custody" \
            --dependency-artifact "$receipt"

      - name: Validate validation boundaries
        run: python3 -m unittest discover -s tests

      - name: Materialize active and admitted repos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import subprocess
          import yaml

          repo_root = Path(".").resolve()
          workspace_root = repo_root / ".workspace-ci"
          if workspace_root.exists():
              shutil.rmtree(workspace_root)
          workspace_root.mkdir()
          shutil.copytree(
              repo_root,
              workspace_root / "workspace-governance",
              ignore=shutil.ignore_patterns(".git", ".workspace-ci", ".workspace-skills", "__pycache__", "*.pyc"),
          )

          repos = yaml.safe_load((repo_root / "contracts" / "repos.yaml").read_text())["repos"]
          intake_repos = yaml.safe_load((repo_root / "contracts" / "intake-register.yaml").read_text()).get("repos", {})
          profiles = yaml.safe_load(
              (repo_root / "contracts" / "developer-integration-profiles.yaml").read_text()
          )["profiles"]
          admitted_repos = {
              repo_name
              for repo_name, payload in intake_repos.items()
              if payload.get("status") == "admitted"
          }
          pinned_review_repos = {
              ref["repo"]
              for profile in profiles.values()
              for admission_key in ("build_admission", "admission")
              for ref in (profile.get(admission_key) or {}).get("security_review_refs", [])
              if ref.get("source_commit")
          }
          owner_repos = sorted(set(repos.keys()) | admitted_repos)

          for repo_name in owner_repos:
              if repo_name == "workspace-governance":
                  continue
              target = workspace_root / repo_name
              clone_command = ["git", "clone"]
              if repo_name not in pinned_review_repos:
                  clone_command.extend(["--depth", "1"])
              clone_command.extend(
                  [f"https://github.com/mfshaf7/{repo_name}.git", str(target)]
              )
              subprocess.run(
                  clone_command,
                  check=True,
              )
          PY

      - name: Validate intake model
        run: python3 scripts/validate_intake.py --workspace-root .workspace-ci

      - name: Validate developer integration profiles
        run: python3 scripts/validate_developer_integration.py --repo-root . --workspace-root .workspace-ci

      - name: Validate component contracts
        run: python3 scripts/validate_component_contracts.py --workspace-root .workspace-ci --prepare-node-deps

      - name: Validate security bindings
        run: python3 scripts/validate_security_bindings.py --workspace-root .workspace-ci

      - name: Validate review coverage
        run: python3 scripts/validate_review_coverage.py --workspace-root .workspace-ci

      - name: Validate security change-record lanes
        run: python3 scripts/validate_security_change_record_lanes.py --workspace-root .workspace-ci

      - name: Validate pull-request controls
        run: python3 scripts/validate_pull_request_controls.py --workspace-root .workspace-ci

      - name: Validate improvement candidates
        run: python3 scripts/validate_improvement_candidates.py --workspace-root .workspace-ci

      - name: Audit improvement signals
        run: python3 scripts/audit_improvement_signals.py --workspace-root .workspace-ci

      - name: Validate learning closure
        run: python3 scripts/validate_learning_closure.py --workspace-root .workspace-ci

      - name: Install registered skills
        run: python3 scripts/install_skills.py --workspace-root .workspace-ci --target-root .workspace-skills

      - name: Verify installed skills
        run: python3 scripts/install_skills.py --workspace-root .workspace-ci --target-root .workspace-skills --check

      - name: Audit stale content
        run: python3 scripts/audit_stale_content.py --workspace-root . --repo-name workspace-governance

      - name: Compile validation scripts
        run: python3 -m py_compile scripts/audit_branch_lifecycle.py scripts/audit_workspace_layout.py scripts/audit_stale_content.py scripts/audit_improvement_signals.py scripts/check_remote_alignment.py scripts/contracts_lib.py scripts/install_skills.py scripts/record_after_action.py scripts/record_improvement_candidate.py scripts/scaffold_intake.py scripts/sync_workspace_root.py scripts/validate_pull_request_controls.py scripts/validate_component_contracts.py scripts/validate_contracts.py scripts/validate_delivery_art_artifact.py scripts/validate_cross_repo_truth.py scripts/validate_developer_integration.py scripts/validate_improvement_candidates.py scripts/validate_intake.py scripts/validate_learning_closure.py scripts/validate_repo_structure.py scripts/validate_review_coverage.py scripts/validate_security_bindings.py scripts/validate_security_change_record_lanes.py scripts/workspace_control_plane_summary.py tests/test_validation_boundaries.py
